openapi: 3.2.0
info:
  title: Amazon Web Services Actions API
  version: '1.0'
  description: 'Operations tagged Actions across 3 of this provider''s published API definitions: fis-openapi-original.yml, iotsitewise-openapi-original.yml, personalize-events-openapi-original.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Actions
paths:
  /actions/{id}:
    GET:
      summary: Amazon Web Services Getaction
      description: Gets information about the specified FIS action.
      operationId: amazonWebServicesGetAction
      tags:
      - Actions
  /actions:
    GET:
      summary: Amazon Web Services Listactions
      description: Lists the available FIS actions.
      operationId: amazonWebServicesListActions
      tags:
      - Actions
    POST:
      summary: Amazon Web Services Putactions
      description: Adds one or more actions to an Actions dataset. For more information see Importing actions individually.
      operationId: amazonWebServicesPutActions
      tags:
      - Actions
  /actions/{actionId}:
    GET:
      summary: Amazon Web Services Describeaction
      description: Retrieves information about an action.
      operationId: amazonWebServicesDescribeAction
      tags:
      - Actions
x-refined-from:
- fis-openapi-original.yml
- iotsitewise-openapi-original.yml
- personalize-events-openapi-original.yml
