openapi: 3.2.0
info:
  title: Amazon Web Services bedrock Model Customization Jobs API
  description: Describes the API operations for creating and managing Amazon Bedrock models.
tags:
- name: Model Customization Jobs
paths:
  /model-customization-jobs:
    GET:
      summary: Amazon Web Services Listmodelcustomizationjobs
      description: Returns a list of model customization jobs that you have submitted. You can filter the jobs to return based on one or more criteria. For more information, see Custom models in the Bedrock User Guide.
      operationId: amazonWebServicesListModelCustomizationJobs
      tags:
      - Model Customization Jobs
  /model-customization-jobs/{jobIdentifier}:
    GET:
      summary: Amazon Web Services Getmodelcustomizationjob
      description: Retrieves the properties associated with a model-customization job, including the status of the job. For more information, see Custom models in the Bedrock User Guide.
      operationId: amazonWebServicesGetModelCustomizationJob
      tags:
      - Model Customization Jobs
  /model-customization-jobs/{jobIdentifier}/stop:
    POST:
      summary: Amazon Web Services Stopmodelcustomizationjob
      description: Stops an active model customization job. For more information, see Custom models in the Bedrock User Guide.
      operationId: amazonWebServicesStopModelCustomizationJob
      tags:
      - Model Customization Jobs
