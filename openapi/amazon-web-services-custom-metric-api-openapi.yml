openapi: 3.2.0
info:
  title: Amazon Web Services iot Custom Metric API
  description: 'IoT

    IoT provides secure, bi-directional communication between Internet-connected devices (such as sensors, actuators, embedded devices, or smart appliances) and the Amazon Web Services cloud.'
tags:
- name: Custom Metric
paths:
  /custom-metric/{metricName}:
    PATCH:
      summary: Amazon Web Services Updatecustommetric
      description: Updates a Device Defender detect custom metric. Requires permission to access the UpdateCustomMetric action.
      operationId: amazonWebServicesUpdateCustomMetric
      tags:
      - Custom Metric
