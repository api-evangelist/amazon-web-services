openapi: 3.2.0
info:
  title: Amazon Web Services Profiles API
  version: '1.0'
  description: 'Operations tagged Profiles across 2 of this provider''s published API definitions: rolesanywhere-openapi-original.yml, wellarchitected-openapi-original.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Profiles
paths:
  /profiles:
    GET:
      summary: Amazon Web Services Listprofiles
      description: 'Lists all profiles in the authenticated account and Amazon Web Services Region. Required permissions: rolesanywhere:ListProfiles.'
      operationId: amazonWebServicesListProfiles
      tags:
      - Profiles
    POST:
      summary: Amazon Web Services Createprofile
      description: Create a profile.
      operationId: amazonWebServicesCreateProfile
      tags:
      - Profiles
  /profiles/{ProfileArn}/shares:
    GET:
      summary: Amazon Web Services Listprofileshares
      description: List profile shares.
      operationId: amazonWebServicesListProfileShares
      tags:
      - Profiles
  /profiles/{ProfileArn}:
    PATCH:
      summary: Amazon Web Services Updateprofile
      description: Update a profile.
      operationId: amazonWebServicesUpdateProfile
      tags:
      - Profiles
  /profiles/{ProfileArn}/shares/{ShareId}:
    DELETE:
      summary: Amazon Web Services Deleteprofileshare
      description: Delete a profile share.
      operationId: amazonWebServicesDeleteProfileShare
      tags:
      - Profiles
x-refined-from:
- rolesanywhere-openapi-original.yml
- wellarchitected-openapi-original.yml
