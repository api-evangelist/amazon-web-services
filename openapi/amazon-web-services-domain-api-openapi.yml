info:
  title: Amazon Web Services Domain API
  version: '1.0'
  description: 'Operations tagged Domain across 3 of this provider''s published API definitions: codeartifact-openapi-original.yml, es-openapi-original.yml, opensearch-openapi-original.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Domain
paths:
  /v1/domain:
    GET:
      summary: Amazon Web Services Describedomain
      description: Returns a DomainDescription object that contains information about the requested domain.
      operationId: amazonWebServicesDescribeDomain
      tags:
      - Domain
  /v1/domain/permissions/policy:
    PUT:
      summary: Amazon Web Services Putdomainpermissionspolicy
      description: Sets a resource policy on a domain that specifies permissions to access it. When you call PutDomainPermissionsPolicy, the resource policy on the domain is ignored when evaluting permissions. This ensures that the owner of a domain cannot lock themselves out of the domain, which would prevent them from being able to update the resource policy.
      operationId: amazonWebServicesPutDomainPermissionsPolicy
      tags:
      - Domain
  /v1/domain/repositories:
    POST:
      summary: Amazon Web Services Listrepositoriesindomain
      description: Returns a list of RepositorySummary objects. Each RepositorySummary contains information about a repository in the specified domain and that matches the input parameters.
      operationId: amazonWebServicesListRepositoriesInDomain
      tags:
      - Domain
  /2015-01-01/domain:
    GET:
      summary: Amazon Web Services Listdomainnames
      description: Returns the name of all Elasticsearch domains owned by the current user's account.
      operationId: amazonWebServicesListDomainNames
      tags:
      - Domain
  /2015-01-01/domain/{DomainName}/packages:
    GET:
      summary: Amazon Web Services Listpackagesfordomain
      description: Lists all packages associated with the Amazon ES domain.
      operationId: amazonWebServicesListPackagesForDomain
      tags:
      - Domain
  /2021-01-01/domain:
    GET:
      summary: Amazon Web Services Listdomainnames
      description: Returns the names of all Amazon OpenSearch Service domains owned by the current user in the active Region.
      operationId: get20210101Domain
      tags:
      - Domain
      x-operation-id-source: normalized
      x-operation-id-original: amazonWebServicesListDomainNames
  /2021-01-01/domain/{DomainName}/packages:
    GET:
      summary: Amazon Web Services Listpackagesfordomain
      description: Lists all packages associated with an Amazon OpenSearch Service domain. For more information, see Custom packages for Amazon OpenSearch Service.
      operationId: get20210101DomainByDomainNamePackages
      tags:
      - Domain
      x-operation-id-source: normalized
      x-operation-id-original: amazonWebServicesListPackagesForDomain
