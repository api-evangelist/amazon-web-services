openapi: 3.2.0
info:
  title: Amazon Web Services AWS S3 Directory Buckets API
  description: 'The API for Amazon Simple Storage Service (Amazon S3) provides an object

    storage solution with top-notch scalability, data availability, security,

    and performance. It caters to customers of varying sizes and industries,

    offering the ability to store and secure any volume of data for a wide

    range of purposes, including data lakes, cloud-native applications, and

    mobile apps.'
tags:
- name: Directory Buckets
paths:
  /:
    GET:
      summary: Amazon Web Services List Directory Buckets
      description: Returns a list of all Amazon S3 directory buckets owned by the authenticated sender of the request For more information about directory buckets, see .
      tags:
      - Directory Buckets
      operationId: listDirectoryBuckets
