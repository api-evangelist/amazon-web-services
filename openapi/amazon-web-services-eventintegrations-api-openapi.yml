openapi: 3.2.0
info:
  title: Amazon Web Services appintegrations Event Integrations API
  description: 'The Amazon AppIntegrations service enables you to configure and reuse connections to external applications.


    For information about how you can use external applications with Amazon Connect, see Set up pre-built integrations and Deliver information to agents using Amazon Connect Wisdom in the Amazon Connect Administrator Guide.'
tags:
- name: eventIntegrations
paths:
  /eventIntegrations:
    GET:
      summary: Amazon Web Services Listeventintegrations
      description: Returns a paginated list of event integrations in the account.
      operationId: amazonWebServicesListEventIntegrations
      tags:
      - eventIntegrations
  /eventIntegrations/{Name}:
    PATCH:
      summary: Amazon Web Services Updateeventintegration
      description: Updates the description of an event integration.
      operationId: amazonWebServicesUpdateEventIntegration
      tags:
      - eventIntegrations
  /eventIntegrations/{Name}/associations:
    GET:
      summary: Amazon Web Services Listeventintegrationassociations
      description: Returns a paginated list of event integration associations in the account.
      operationId: amazonWebServicesListEventIntegrationAssociations
      tags:
      - eventIntegrations
