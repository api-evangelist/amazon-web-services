openapi: 3.2.0
info:
  title: Amazon Web Services mediapackage Harvest Jobs API
  description: AWS Elemental MediaPackage
tags:
- name: Harvest Jobs
paths:
  /harvest_jobs:
    GET:
      summary: Amazon Web Services Listharvestjobs
      description: Returns a collection of HarvestJob records.
      operationId: amazonWebServicesListHarvestJobs
      tags:
      - Harvest Jobs
  /harvest_jobs/{id}:
    GET:
      summary: Amazon Web Services Describeharvestjob
      description: Gets details about an existing HarvestJob.
      operationId: amazonWebServicesDescribeHarvestJob
      tags:
      - Harvest Jobs
