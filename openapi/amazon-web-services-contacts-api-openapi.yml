openapi: 3.2.0
info:
  title: Amazon Web Services Contacts API
  version: '1.0'
  description: 'Operations tagged Contacts across 2 of this provider''s published API definitions: connect-openapi-original.yml, groundstation-openapi-original.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Contacts
paths:
  /contacts/{InstanceId}/{ContactId}:
    POST:
      summary: Amazon Web Services Updatecontact
      description: This API is in preview release for Amazon Connect and is subject to change. Adds or updates user-defined contact information associated with the specified contact. At least one field to be updated must be present in the request. You can add or update user-defined contact information for both ongoing and completed contacts.
      operationId: amazonWebServicesUpdateContact
      tags:
      - Contacts
  /contacts/{InstanceId}/{ContactId}/routing-data:
    POST:
      summary: Amazon Web Services Updatecontactroutingdata
      description: This API is in preview release for Amazon Connect and is subject to change. Updates routing priority and age on the contact (QueuePriority and QueueTimeAdjustmentInSeconds). These properties can be used to change a customer's position in the queue. For example, you can move a contact to the back of the queue by setting a lower routing priority relative to other contacts in queue; or you can move a contact to the front of the queue by increasing the routing age which will make the contact look artificially older and therefore higher up in the first-in-first-out routing order. Note that adjusting the routing age of a contact affects only its position in queue, and not its actual queue wait time as reported through metrics. These properties can also be updated by using the Set routing priority / age flow block.
      operationId: amazonWebServicesUpdateContactRoutingData
      tags:
      - Contacts
  /contacts:
    POST:
      summary: Amazon Web Services Listcontacts
      description: Returns a list of contacts. If statusList contains AVAILABLE, the request must include groundStation, missionprofileArn, and satelliteArn.
      operationId: amazonWebServicesListContacts
      tags:
      - Contacts
x-refined-from:
- connect-openapi-original.yml
- groundstation-openapi-original.yml
