    PUT:
      summary: Amazon Web Services Put Bucket Lifecycle Configuration
      description: This operation is not supported by directory buckets Creates a new lifecycle configuration for the bucket or replaces an existing lifecycle configuration
      tags:
      - Bucket Lifecycle Configuration
      operationId: putBucketLifecycleConfiguration
