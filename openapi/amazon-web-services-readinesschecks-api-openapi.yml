openapi: 3.2.0
info:
  title: Amazon Web Services route53-recovery-readiness…
  description: Recovery readiness
tags:
- name: Readinesschecks
paths:
  /readinesschecks:
    GET:
      summary: Amazon Web Services Listreadinesschecks
      description: Lists the readiness checks for an account.
      operationId: amazonWebServicesListReadinessChecks
      tags:
      - Readinesschecks
  /readinesschecks/{readinessCheckName}:
    PUT:
      summary: Amazon Web Services Updatereadinesscheck
      description: Updates a readiness check.
      operationId: amazonWebServicesUpdateReadinessCheck
      tags:
      - Readinesschecks
  /readinesschecks/{readinessCheckName}/resource/{resourceIdentifier}/status:
    GET:
      summary: Amazon Web Services Getreadinesscheckresourcestatus
      description: Gets individual readiness status for a readiness check. To see the overall readiness status for a recovery group, that considers the readiness status for all the readiness checks in the recovery group, use GetRecoveryGroupReadinessSummary.
      operationId: amazonWebServicesGetReadinessCheckResourceStatus
      tags:
      - Readinesschecks
  /readinesschecks/{readinessCheckName}/status:
    GET:
      summary: Amazon Web Services Getreadinesscheckstatus
      description: Gets the readiness status for an individual readiness check. To see the overall readiness status for a recovery group, that considers the readiness status for all the readiness checks in a recovery group, use GetRecoveryGroupReadinessSummary.
      operationId: amazonWebServicesGetReadinessCheckStatus
      tags:
      - Readinesschecks
