openapi: 3.2.0
info:
  title: Amazon Web Services connect Chat Integration Event API
  description: Amazon Connect is a cloud-based contact center solution that you use to set up and manage a customer contact center and provide reliable customer engagement at any scale.
tags:
- name: Chat Integration Event
paths:
  /chat-integration-event:
    POST:
      summary: Amazon Web Services Sendchatintegrationevent
      description: 'Processes chat integration events from Amazon Web Services or external integrations to Amazon Connect. A chat integration event includes: SourceId, DestinationId, and Subtype: a set of identifiers, uniquely representing a chat ChatEvent: details of the chat action to perform such as sending a message, event, or disconnecting from a chat When a chat integration event is sent with chat identifiers that do not map to an active chat contact, a new chat contact is also created before handling chat action. Access to this API is currently restricted to Amazon Pinpoint for supporting SMS integration.'
      operationId: amazonWebServicesSendChatIntegrationEvent
      tags:
      - Chat Integration Event
