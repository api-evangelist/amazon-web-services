      summary: Amazon Web Services Createlogicallyairgappedbackupvault
      description: This request creates a logical container to where backups may be copied. This request includes a name, the Region, the maximum number of retention days, the minimum number of retention days, and optionally can include tags and a creator request ID. Do not include sensitive data, such as passport numbers, in the name of a backup vault.
      operationId: amazonWebServicesCreateLogicallyAirGappedBackupVault
