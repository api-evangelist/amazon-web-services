openapi: 3.2.0
info:
  title: Amazon Web Services ivs Get Playback Key Pair API
  description: 'Introduction


    The Amazon Interactive Video Service (IVS) API is REST compatible, using a standard HTTP API and an Amazon Web Services EventBridge event stream for responses.'
tags:
- name: GetPlaybackKeyPair
paths:
  /GetPlaybackKeyPair:
    POST:
      summary: Amazon Web Services Getplaybackkeypair
      description: Gets a specified playback authorization key pair and returns the arn and fingerprint. The privateKey held by the caller can be used to generate viewer authorization tokens, to grant viewers access to private channels. For more information, see Setting Up Private Channels in the Amazon IVS User Guide.
      operationId: amazonWebServicesGetPlaybackKeyPair
      tags:
      - GetPlaybackKeyPair
