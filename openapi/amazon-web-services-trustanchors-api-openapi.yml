openapi: 3.2.0
info:
  title: Amazon Web Services rolesanywhere Trustanchors API
  description: Identity and Access Management Roles Anywhere provides a secure way for your workloads such as servers, containers, and applications that run outside of Amazon Web Services to obtain temporary Amazon Web Services credentials.
tags:
- name: Trustanchors
paths:
  /trustanchors:
    GET:
      summary: Amazon Web Services Listtrustanchors
      description: 'Lists the trust anchors in the authenticated account and Amazon Web Services Region. Required permissions: rolesanywhere:ListTrustAnchors.'
      operationId: amazonWebServicesListTrustAnchors
      tags:
      - Trustanchors
