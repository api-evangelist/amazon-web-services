openapi: 3.2.0
info:
  title: Amazon Web Services Orders API
  version: '1.0'
  description: 'Operations tagged Orders across 2 of this provider''s published API definitions: outposts-openapi-original.yml, privatenetworks-openapi-original.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Orders
paths:
  /orders/{OrderId}/cancel:
    POST:
      summary: Amazon Web Services Cancelorder
      description: Cancels the specified order for an Outpost.
      operationId: amazonWebServicesCancelOrder
      tags:
      - Orders
  /orders:
    POST:
      summary: Amazon Web Services Createorder
      description: Creates an order for an Outpost.
      operationId: amazonWebServicesCreateOrder
      tags:
      - Orders
  /orders/{OrderId}:
    GET:
      summary: Amazon Web Services Getorder
      description: Gets information about the specified order.
      operationId: amazonWebServicesGetOrder
      tags:
      - Orders
  /v1/orders/acknowledge:
    POST:
      summary: Amazon Web Services Acknowledgeorderreceipt
      description: Acknowledges that the specified network order was received.
      operationId: amazonWebServicesAcknowledgeOrderReceipt
      tags:
      - Orders
  /v1/orders/{orderArn}:
    GET:
      summary: Amazon Web Services Getorder
      description: Gets the specified order.
      operationId: amazonWebServicesGetOrder
      tags:
      - Orders
  /v1/orders/list:
    POST:
      summary: Amazon Web Services Listorders
      description: Lists orders. Add filters to your request to return a more specific list of results. Use filters to match the Amazon Resource Name (ARN) of the network site or the status of the order. If you specify multiple filters, filters are joined with an OR, and the request returns results that match all of the specified filters.
      operationId: amazonWebServicesListOrders
      tags:
      - Orders
x-refined-from:
- outposts-openapi-original.yml
- privatenetworks-openapi-original.yml
