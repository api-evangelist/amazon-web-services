openapi: 3.2.0
info:
  title: Amazon Web Services connect Prompts API
  description: Amazon Connect is a cloud-based contact center solution that you use to set up and manage a customer contact center and provide reliable customer engagement at any scale.
tags:
- name: Prompts
paths:
  /prompts/{InstanceId}:
    PUT:
      summary: Amazon Web Services Createprompt
      description: Creates a prompt. For more information about prompts, such as supported file types and maximum length, see Create prompts in the Amazon Connect Administrator's Guide.
      operationId: amazonWebServicesCreatePrompt
      tags:
      - Prompts
  /prompts/{InstanceId}/{PromptId}:
    POST:
      summary: Amazon Web Services Updateprompt
      description: Updates a prompt.
      operationId: amazonWebServicesUpdatePrompt
      tags:
      - Prompts
  /prompts/{InstanceId}/{PromptId}/file:
    GET:
      summary: Amazon Web Services Getpromptfile
      description: Gets the prompt file.
      operationId: amazonWebServicesGetPromptFile
      tags:
      - Prompts
