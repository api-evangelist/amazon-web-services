openapi: 3.2.0
info:
  title: Amazon Web Services workspaces-web Ip Access Settings API
  description: WorkSpaces Web is a low cost, fully managed WorkSpace built specifically to facilitate secure, web-based workloads.
tags:
- name: Ip Access Settings
paths:
  /ipAccessSettings:
    GET:
      summary: Amazon Web Services Listipaccesssettings
      description: Retrieves a list of IP access settings.
      operationId: amazonWebServicesListIpAccessSettings
      tags:
      - Ip Access Settings
  /ipAccessSettings/{ipAccessSettingsArn+}:
    PATCH:
      summary: Amazon Web Services Updateipaccesssettings
      description: Updates IP access settings.
      operationId: amazonWebServicesUpdateIpAccessSettings
      tags:
      - Ip Access Settings
