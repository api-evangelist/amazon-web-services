openapi: 3.2.0
info:
  title: Amazon Web Services controltower Disable Control API
  description: These interfaces allow you to apply the Amazon Web Services library of pre-defined controls to your organizational units, programmatically.
tags:
- name: Disable Control
paths:
  /disable-control:
    POST:
      summary: Amazon Web Services Disablecontrol
      description: This API call turns off a control. It starts an asynchronous operation that deletes AWS resources on the specified organizational unit and the accounts it contains. The resources will vary according to the control that you specify. For usage examples, see the Amazon Web Services Control Tower User Guide .
      operationId: amazonWebServicesDisableControl
      tags:
      - Disable Control
