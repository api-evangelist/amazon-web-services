openapi: 3.2.0
info:
  title: Amazon Web Services resource-groups Get Group Query API
  description: Resource Groups lets you organize Amazon Web Services resources such as Amazon Elastic Compute Cloud instances, Amazon Relational Database Service databases, and Amazon Simple Storage Service buckets into groups using criteria that you define as tags.
tags:
- name: Get Group Query
paths:
  /get-group-query:
    POST:
      summary: Amazon Web Services Getgroupquery
      description: 'Retrieves the resource query associated with the specified resource group. For more information about resource queries, see Create a tag-based group in Resource Groups. Minimum permissions To run this command, you must have the following permissions: resource-groups:GetGroupQuery'
      operationId: amazonWebServicesGetGroupQuery
      tags:
      - Get Group Query
