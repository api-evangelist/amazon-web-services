openapi: 3.2.0
info:
  title: Amazon Web Services Invitation API
  version: '1.0'
  description: 'Operations tagged Invitation across 2 of this provider''s published API definitions: detective-openapi-original.yml, guardduty-openapi-original.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Invitation
paths:
  /invitation:
    PUT:
      summary: Amazon Web Services Acceptinvitation
      description: Accepts an invitation for the member account to contribute data to a behavior graph. This operation can only be called by an invited member account. The request provides the ARN of behavior graph. The member account status in the graph must be INVITED.
      operationId: amazonWebServicesAcceptInvitation
      tags:
      - Invitation
    GET:
      summary: Amazon Web Services Listinvitations
      description: Lists all GuardDuty membership invitations that were sent to the current Amazon Web Services account.
      operationId: amazonWebServicesListInvitations
      tags:
      - Invitation
  /invitation/removal:
    POST:
      summary: Amazon Web Services Rejectinvitation
      description: Rejects an invitation to contribute the account data to a behavior graph. This operation must be called by an invited member account that has the INVITED status. RejectInvitation cannot be called by an organization account in the organization behavior graph. In the organization behavior graph, organization accounts do not receive an invitation.
      operationId: amazonWebServicesRejectInvitation
      tags:
      - Invitation
  /invitation/decline:
    POST:
      summary: Amazon Web Services Declineinvitations
      description: Declines invitations sent to the current member account by Amazon Web Services accounts specified by their account IDs.
      operationId: amazonWebServicesDeclineInvitations
      tags:
      - Invitation
  /invitation/delete:
    POST:
      summary: Amazon Web Services Deleteinvitations
      description: Deletes invitations sent to the current member account by Amazon Web Services accounts specified by their account IDs.
      operationId: amazonWebServicesDeleteInvitations
      tags:
      - Invitation
  /invitation/count:
    GET:
      summary: Amazon Web Services Getinvitationscount
      description: Returns the count of all GuardDuty membership invitations that were sent to the current member account except the currently accepted invitation.
      operationId: amazonWebServicesGetInvitationsCount
      tags:
      - Invitation
x-refined-from:
- detective-openapi-original.yml
- guardduty-openapi-original.yml
