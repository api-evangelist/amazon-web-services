openapi: 3.2.0
info:
  title: Amazon Web Services rolesanywhere Subject API
  description: Identity and Access Management Roles Anywhere provides a secure way for your workloads such as servers, containers, and applications that run outside of Amazon Web Services to obtain temporary Amazon Web Services credentials.
tags:
- name: Subject
paths:
  /subject/{subjectId}:
    GET:
      summary: Amazon Web Services Getsubject
      description: 'Gets a subject, which associates a certificate identity with authentication attempts. The subject stores auditing information such as the status of the last authentication attempt, the certificate data used in the attempt, and the last time the associated identity attempted authentication. Required permissions: rolesanywhere:GetSubject.'
      operationId: amazonWebServicesGetSubject
      tags:
      - Subject
