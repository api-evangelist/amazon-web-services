openapi: 3.2.0
info:
  title: Amazon Web Services chime-sdk-media-pipelines Media…
  description: The Amazon Chime SDK media pipeline APIs in this section allow software developers to create Amazon Chime SDK media pipelines that capture, concatenate, or stream your Amazon Chime SDK meetings. For more information about media pipelines, see Amazon Chime SDK media pipelines.
tags:
- name: Media Insights Pipeline Configurations
paths:
  /media-insights-pipeline-configurations:
    GET:
      summary: Amazon Web Services Listmediainsightspipelineconfigurations
      description: Lists the available media insights pipeline configurations.
      operationId: amazonWebServicesListMediaInsightsPipelineConfigurations
      tags:
      - Media Insights Pipeline Configurations
  /media-insights-pipeline-configurations/{identifier}:
    PUT:
      summary: Amazon Web Services Updatemediainsightspipelineconfiguration
      description: Updates the media insights pipeline's configuration settings.
      operationId: amazonWebServicesUpdateMediaInsightsPipelineConfiguration
      tags:
      - Media Insights Pipeline Configurations
