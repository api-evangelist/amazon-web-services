openapi: 3.2.0
info:
  title: Amazon Web Services codeguru-security Scans API
  description: Amazon CodeGuru Security is in preview release and is subject to change.
tags:
- name: Scans
paths:
  /scans:
    GET:
      summary: Amazon Web Services Listscans
      description: Returns a list of all the standard scans in an account. Does not return express scans.
      operationId: amazonWebServicesListScans
      tags:
      - Scans
  /scans/{scanName}:
    GET:
      summary: Amazon Web Services Getscan
      description: Returns details about a scan, including whether or not a scan has completed.
      operationId: amazonWebServicesGetScan
      tags:
      - Scans
