openapi: 3.2.0
info:
  title: Amazon Web Services Portals API
  version: '1.0'
  description: 'Operations tagged Portals across 2 of this provider''s published API definitions: iotsitewise-openapi-original.yml, workspaces-web-openapi-original.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Portals
paths:
  /portals:
    GET:
      summary: Amazon Web Services Listportals
      description: Retrieves a paginated list of IoT SiteWise Monitor portals.
      operationId: amazonWebServicesListPortals
      tags:
      - Portals
  /portals/{portalId}:
    PUT:
      summary: Amazon Web Services Updateportal
      description: Updates an IoT SiteWise Monitor portal.
      operationId: amazonWebServicesUpdatePortal
      tags:
      - Portals
  /portals/{portalArn+}/browserSettings:
    DELETE:
      summary: Amazon Web Services Disassociatebrowsersettings
      description: Disassociates browser settings from a web portal.
      operationId: amazonWebServicesDisassociateBrowserSettings
      tags:
      - Portals
  /portals/{portalArn+}/ipAccessSettings:
    DELETE:
      summary: Amazon Web Services Disassociateipaccesssettings
      description: Disassociates IP access settings from a web portal.
      operationId: amazonWebServicesDisassociateIpAccessSettings
      tags:
      - Portals
  /portals/{portalArn+}/networkSettings:
    DELETE:
      summary: Amazon Web Services Disassociatenetworksettings
      description: Disassociates network settings from a web portal.
      operationId: amazonWebServicesDisassociateNetworkSettings
      tags:
      - Portals
  /portals/{portalArn+}/trustStores:
    DELETE:
      summary: Amazon Web Services Disassociatetruststore
      description: Disassociates a trust store from a web portal.
      operationId: amazonWebServicesDisassociateTrustStore
      tags:
      - Portals
  /portals/{portalArn+}/userAccessLoggingSettings:
    DELETE:
      summary: Amazon Web Services Disassociateuseraccessloggingsettings
      description: Disassociates user access logging settings from a web portal.
      operationId: amazonWebServicesDisassociateUserAccessLoggingSettings
      tags:
      - Portals
  /portals/{portalArn+}/userSettings:
    DELETE:
      summary: Amazon Web Services Disassociateusersettings
      description: Disassociates user settings from a web portal.
      operationId: amazonWebServicesDisassociateUserSettings
      tags:
      - Portals
  /portals/{portalArn+}:
    PUT:
      summary: Amazon Web Services Updateportal
      description: Updates a web portal.
      operationId: amazonWebServicesUpdatePortal
      tags:
      - Portals
  /portals/{portalArn+}/identityProviders:
    GET:
      summary: Amazon Web Services Listidentityproviders
      description: Retrieves a list of identity providers for a specific web portal.
      operationId: amazonWebServicesListIdentityProviders
      tags:
      - Portals
x-refined-from:
- iotsitewise-openapi-original.yml
- workspaces-web-openapi-original.yml
