openapi: 3.2.0
info:
  title: Amazon Web Services inspector2 Ec2deepinspectionconfiguratio…
  description: Amazon Inspector is a vulnerability discovery service that automates continuous scanning for security vulnerabilities within your Amazon EC2, Amazon ECR, and Amazon Web Services Lambda environments.
tags:
- name: Ec2deepinspectionconfiguration
paths:
  /ec2deepinspectionconfiguration/get:
    POST:
      summary: Amazon Web Services Getec2deepinspectionconfiguration
      description: Retrieves the activation status of Amazon Inspector deep inspection and custom paths associated with your account.
      operationId: amazonWebServicesGetEc2DeepInspectionConfiguration
      tags:
      - Ec2deepinspectionconfiguration
  /ec2deepinspectionconfiguration/update:
    POST:
      summary: Amazon Web Services Updateec2deepinspectionconfiguration
      description: Activates, deactivates Amazon Inspector deep inspection, or updates custom paths for your account.
      operationId: amazonWebServicesUpdateEc2DeepInspectionConfiguration
      tags:
      - Ec2deepinspectionconfiguration
  /ec2deepinspectionconfiguration/org/update:
    POST:
      summary: Amazon Web Services Updateorgec2deepinspectionconfiguration
      description: Updates the Amazon Inspector deep inspection custom paths for your organization. You must be an Amazon Inspector delegated administrator to use this API.
      operationId: amazonWebServicesUpdateOrgEc2DeepInspectionConfiguration
      tags:
      - Ec2deepinspectionconfiguration
