openapi: 3.2.0
info:
  title: Amazon Web Services ssm-incidents Create Timeline Event API
  description: Systems Manager Incident Manager is an incident management console designed to help users mitigate and recover from incidents affecting their Amazon Web Services-hosted applications.
tags:
- name: Create Timeline Event
paths:
  /createTimelineEvent:
    POST:
      summary: Amazon Web Services Createtimelineevent
      description: Creates a custom timeline event on the incident details page of an incident record. Incident Manager automatically creates timeline events that mark key moments during an incident. You can create custom timeline events to mark important events that Incident Manager can detect automatically.
      operationId: amazonWebServicesCreateTimelineEvent
      tags:
      - Create Timeline Event
