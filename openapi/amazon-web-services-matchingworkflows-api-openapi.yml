openapi: 3.2.0
info:
  title: Amazon Web Services entityresolution Matchingworkflows API
  description: Welcome to the Entity Resolution API Reference.
tags:
- name: Matchingworkflows
paths:
  /matchingworkflows:
    GET:
      summary: Amazon Web Services Listmatchingworkflows
      description: Returns a list of all the MatchingWorkflows that have been created for an Amazon Web Services account.
      operationId: amazonWebServicesListMatchingWorkflows
      tags:
      - Matchingworkflows
  /matchingworkflows/{workflowName}:
    PUT:
      summary: Amazon Web Services Updatematchingworkflow
      description: Updates an existing MatchingWorkflow. This method is identical to CreateMatchingWorkflow, except it uses an HTTP PUT request instead of a POST request, and the MatchingWorkflow must already exist for the method to succeed.
      operationId: amazonWebServicesUpdateMatchingWorkflow
      tags:
      - Matchingworkflows
  /matchingworkflows/{workflowName}/matches:
    POST:
      summary: Amazon Web Services Getmatchid
      description: Returns the corresponding Match ID of a customer record if the record has been processed.
      operationId: amazonWebServicesGetMatchId
      tags:
      - Matchingworkflows
  /matchingworkflows/{workflowName}/jobs/{jobId}:
    GET:
      summary: Amazon Web Services Getmatchingjob
      description: Gets the status, metrics, and errors (if there are any) that are associated with a job.
      operationId: amazonWebServicesGetMatchingJob
      tags:
      - Matchingworkflows
  /matchingworkflows/{workflowName}/jobs:
    POST:
      summary: Amazon Web Services Startmatchingjob
      description: Starts the MatchingJob of a workflow. The workflow must have previously been created using the CreateMatchingWorkflow endpoint.
      operationId: amazonWebServicesStartMatchingJob
      tags:
      - Matchingworkflows
