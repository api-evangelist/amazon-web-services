openapi: 3.2.0
info:
  title: Amazon Web Services cloudfront Field Level Encryption API
  description: 'Amazon CloudFront

    This is the Amazon CloudFront API Reference. This guide is for developers who need detailed information about CloudFront API actions, data types, and errors. For detailed information about CloudFront features, see the Amazon CloudFront Developer Guide.'
tags:
- name: Field Level Encryption
paths:
  /2020-05-31/field-level-encryption:
    GET:
      summary: Amazon Web Services Listfieldlevelencryptionconfigs
      description: List all field-level encryption configurations that have been created in CloudFront for this account.
      operationId: amazonWebServicesListFieldLevelEncryptionConfigs
      tags:
      - Field Level Encryption
  /2020-05-31/field-level-encryption/{Id}:
    GET:
      summary: Amazon Web Services Getfieldlevelencryption
      description: Get the field-level encryption configuration information.
      operationId: amazonWebServicesGetFieldLevelEncryption
      tags:
      - Field Level Encryption
  /2020-05-31/field-level-encryption/{Id}/config:
    PUT:
      summary: Amazon Web Services Updatefieldlevelencryptionconfig
      description: Update a field-level encryption configuration.
      operationId: amazonWebServicesUpdateFieldLevelEncryptionConfig
      tags:
      - Field Level Encryption
