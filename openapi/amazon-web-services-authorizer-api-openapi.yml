openapi: 3.2.0
info:
  title: Amazon Web Services iot Authorizer API
  description: 'IoT

    IoT provides secure, bi-directional communication between Internet-connected devices (such as sensors, actuators, embedded devices, or smart appliances) and the Amazon Web Services cloud.'
tags:
- name: Authorizer
paths:
  /authorizer/{authorizerName}:
    PUT:
      summary: Amazon Web Services Updateauthorizer
      description: Updates an authorizer. Requires permission to access the UpdateAuthorizer action.
      operationId: amazonWebServicesUpdateAuthorizer
      tags:
      - Authorizer
  /authorizer/{authorizerName}/test:
    POST:
      summary: Amazon Web Services Testinvokeauthorizer
      description: Tests a custom authorization behavior by invoking a specified custom authorizer. Use this to test and debug the custom authorization behavior of devices that connect to the IoT device gateway. Requires permission to access the TestInvokeAuthorizer action.
      operationId: amazonWebServicesTestInvokeAuthorizer
      tags:
      - Authorizer
