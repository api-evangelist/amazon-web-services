openapi: 3.2.0
info:
  title: Amazon Web Services API
  version: '1.0'
  description: 'Operations tagged Services across 2 of this provider''s published API definitions: auditmanager-openapi-original.yml, vpc-lattice-openapi-original.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Services
paths:
  /services:
    GET:
      summary: Amazon Web Services Getservicesinscope
      description: Gets a list of all of the Amazon Web Services that you can choose to include in your assessment. When you create an assessment, specify which of these services you want to include to narrow the assessment's scope.
      operationId: amazonWebServicesGetServicesInScope
      tags:
      - Services
  /services/{serviceIdentifier}/listeners/{listenerIdentifier}/rules:
    GET:
      summary: Amazon Web Services Listrules
      description: Lists the rules for the listener.
      operationId: amazonWebServicesListRules
      tags:
      - Services
  /services/{serviceIdentifier}/listeners:
    GET:
      summary: Amazon Web Services Listlisteners
      description: Lists the listeners for the specified service.
      operationId: amazonWebServicesListListeners
      tags:
      - Services
  /services/{serviceIdentifier}/listeners/{listenerIdentifier}:
    PATCH:
      summary: Amazon Web Services Updatelistener
      description: Updates the specified listener for the specified service.
      operationId: amazonWebServicesUpdateListener
      tags:
      - Services
  /services/{serviceIdentifier}/listeners/{listenerIdentifier}/rules/{ruleIdentifier}:
    PATCH:
      summary: Amazon Web Services Updaterule
      description: Updates a rule for the listener. You can't modify a default listener rule. To modify a default listener rule, use UpdateListener.
      operationId: amazonWebServicesUpdateRule
      tags:
      - Services
  /services/{serviceIdentifier}:
    PATCH:
      summary: Amazon Web Services Updateservice
      description: Updates the specified service.
      operationId: amazonWebServicesUpdateService
      tags:
      - Services
x-refined-from:
- auditmanager-openapi-original.yml
- vpc-lattice-openapi-original.yml
