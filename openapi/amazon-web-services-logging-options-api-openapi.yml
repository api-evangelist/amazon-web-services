openapi: 3.2.0
info:
  title: Amazon Web Services iot Logging Options API
  description: 'IoT

    IoT provides secure, bi-directional communication between Internet-connected devices (such as sensors, actuators, embedded devices, or smart appliances) and the Amazon Web Services cloud.'
tags:
- name: Logging Options
paths:
  /loggingOptions:
    POST:
      summary: Amazon Web Services Setloggingoptions
      description: 'Sets the logging options. NOTE: use of this command is not recommended. Use SetV2LoggingOptions instead. Requires permission to access the SetLoggingOptions action.'
      operationId: amazonWebServicesSetLoggingOptions
      tags:
      - Logging Options
