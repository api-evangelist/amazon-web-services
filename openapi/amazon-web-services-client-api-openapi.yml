openapi: 3.2.0
info:
  title: Amazon Web Services sso-oidc Client API
  description: IAM Identity Center OpenID Connect (OIDC) is a web service that enables a client (such as CLI or a native application) to register with IAM Identity Center.
tags:
- name: Client
paths:
  /client/register:
    POST:
      summary: Amazon Web Services Registerclient
      description: Registers a client with IAM Identity Center. This allows clients to initiate device authorization. The output should be persisted for reuse through many authentication requests.
      operationId: amazonWebServicesRegisterClient
      tags:
      - Client
