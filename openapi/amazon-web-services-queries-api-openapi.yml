info:
  title: Amazon Web Services Queries API
  version: '1.0'
  description: 'Operations tagged Queries across 3 of this provider''s published API definitions: iotsitewise-openapi-original.yml, iottwinmaker-openapi-original.yml, neptune-graph-openapi-original.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Queries
paths:
  /queries/execution:
    POST:
      summary: Amazon Web Services Executequery
      description: Run SQL queries to retrieve metadata and time-series data from asset models, assets, measurements, metrics, transforms, and aggregates.
      operationId: amazonWebServicesExecuteQuery
      tags:
      - Queries
  /queries/{queryId}:
    GET:
      summary: Amazon Web Services Getquery
      description: Retrieves the status of a specified query. When invoking this operation in a Neptune Analytics cluster, the IAM user or role making the request must have the neptune-graph:GetQueryStatus IAM action attached.
      operationId: amazonWebServicesGetQuery
      tags:
      - Queries
  /queries:
    GET:
      summary: Amazon Web Services Listqueries
      description: Lists active openCypher queries.
      operationId: amazonWebServicesListQueries
      tags:
      - Queries
