openapi: 3.2.0
info:
  title: Amazon Web Services apigatewayv2 Stages API
  description: Amazon API Gateway V2
tags:
- name: Stages
paths:
  /v2/apis/{apiId}/stages:
    GET:
      summary: Amazon Web Services Getstages
      description: Gets the Stages for an API.
      operationId: amazonWebServicesGetStages
      tags:
      - Stages
  /v2/apis/{apiId}/stages/{stageName}/accesslogsettings:
    DELETE:
      summary: Amazon Web Services Deleteaccesslogsettings
      description: Deletes the AccessLogSettings for a Stage. To disable access logging for a Stage, delete its AccessLogSettings.
      operationId: amazonWebServicesDeleteAccessLogSettings
      tags:
      - Stages
  /v2/apis/{apiId}/stages/{stageName}/routesettings/{routeKey}:
    DELETE:
      summary: Amazon Web Services Deleteroutesettings
      description: Deletes the RouteSettings for a stage.
      operationId: amazonWebServicesDeleteRouteSettings
      tags:
      - Stages
  /v2/apis/{apiId}/stages/{stageName}:
    PATCH:
      summary: Amazon Web Services Updatestage
      description: Updates a Stage.
      operationId: amazonWebServicesUpdateStage
      tags:
      - Stages
  /v2/apis/{apiId}/stages/{stageName}/cache/authorizers:
    DELETE:
      summary: Amazon Web Services Resetauthorizerscache
      description: Resets all authorizer cache entries for the specified stage. Supported only for HTTP API Lambda authorizers.
      operationId: amazonWebServicesResetAuthorizersCache
      tags:
      - Stages
