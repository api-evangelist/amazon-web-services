openapi: 3.2.0
info:
  title: Amazon Web Services inspector2 Coverage API
  description: Amazon Inspector is a vulnerability discovery service that automates continuous scanning for security vulnerabilities within your Amazon EC2, Amazon ECR, and Amazon Web Services Lambda environments.
tags:
- name: Coverage
paths:
  /coverage/list:
    POST:
      summary: Amazon Web Services Listcoverage
      description: Lists coverage details for you environment.
      operationId: amazonWebServicesListCoverage
      tags:
      - Coverage
  /coverage/statistics/list:
    POST:
      summary: Amazon Web Services Listcoveragestatistics
      description: Lists Amazon Inspector coverage statistics for your environment.
      operationId: amazonWebServicesListCoverageStatistics
      tags:
      - Coverage
