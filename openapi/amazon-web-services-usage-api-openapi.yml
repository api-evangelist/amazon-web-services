openapi: 3.2.0
info:
  title: Amazon Web Services Usage API
  version: '1.0'
  description: 'Operations tagged Usage across 2 of this provider''s published API definitions: inspector2-openapi-original.yml, macie2-openapi-original.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Usage
paths:
  /usage/list:
    POST:
      summary: Amazon Web Services Listusagetotals
      description: Lists the Amazon Inspector usage totals over the last 30 days.
      operationId: amazonWebServicesListUsageTotals
      tags:
      - Usage
  /usage/statistics:
    POST:
      summary: Amazon Web Services Getusagestatistics
      description: Retrieves (queries) quotas and aggregated usage data for one or more accounts.
      operationId: amazonWebServicesGetUsageStatistics
      tags:
      - Usage
  /usage:
    GET:
      summary: Amazon Web Services Getusagetotals
      description: Retrieves (queries) aggregated usage data for an account.
      operationId: amazonWebServicesGetUsageTotals
      tags:
      - Usage
