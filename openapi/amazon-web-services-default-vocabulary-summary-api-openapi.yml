openapi: 3.2.0
info:
  title: Amazon Web Services connect Default Vocabulary Summary API
  description: Amazon Connect is a cloud-based contact center solution that you use to set up and manage a customer contact center and provide reliable customer engagement at any scale.
tags:
- name: Default Vocabulary Summary
paths:
  /default-vocabulary-summary/{InstanceId}:
    POST:
      summary: Amazon Web Services Listdefaultvocabularies
      description: Lists the default vocabularies for the specified Amazon Connect instance.
      operationId: amazonWebServicesListDefaultVocabularies
      tags:
      - Default Vocabulary Summary
