openapi: 3.2.0
info:
  title: Amazon Web Services simspaceweaver Startsimulation API
  description: SimSpace Weaver (SimSpace Weaver) is a service that you can use to build and run large-scale spatial simulations in the Amazon Web Services Cloud.
tags:
- name: Startsimulation
paths:
  /startsimulation:
    POST:
      summary: Amazon Web Services Startsimulation
      description: Starts a simulation with the given name. You must choose to start your simulation from a schema or from a snapshot. For more information about the schema, see the schema reference in the SimSpace Weaver User Guide. For more information about snapshots, see Snapshots in the SimSpace Weaver User Guide.
      operationId: amazonWebServicesStartSimulation
      tags:
      - Startsimulation
