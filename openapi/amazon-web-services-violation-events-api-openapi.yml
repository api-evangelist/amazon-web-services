openapi: 3.2.0
info:
  title: Amazon Web Services iot Violation Events API
  description: 'IoT

    IoT provides secure, bi-directional communication between Internet-connected devices (such as sensors, actuators, embedded devices, or smart appliances) and the Amazon Web Services cloud.'
tags:
- name: Violation Events
paths:
  /violation-events:
    GET:
      summary: Amazon Web Services Listviolationevents
      description: Lists the Device Defender security profile violations discovered during the given time period. You can use filters to limit the results to those alerts issued for a particular security profile, behavior, or thing (device). Requires permission to access the ListViolationEvents action.
      operationId: amazonWebServicesListViolationEvents
      tags:
      - Violation Events
