openapi: 3.2.0
info:
  title: Amazon Web Services iot Certificates Out Going API
  description: 'IoT

    IoT provides secure, bi-directional communication between Internet-connected devices (such as sensors, actuators, embedded devices, or smart appliances) and the Amazon Web Services cloud.'
tags:
- name: Certificates Out Going
paths:
  /certificates-out-going:
    GET:
      summary: Amazon Web Services Listoutgoingcertificates
      description: Lists certificates that are being transferred but not yet accepted. Requires permission to access the ListOutgoingCertificates action.
      operationId: amazonWebServicesListOutgoingCertificates
      tags:
      - Certificates Out Going
