openapi: 3.2.0
info:
  title: Amazon Web Services Connectors API
  version: '1.0'
  description: 'Operations tagged Connectors across 2 of this provider''s published API definitions: kafkaconnect-openapi-original.yml, pca-connector-ad-openapi-original.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Connectors
paths:
  /v1/connectors:
    GET:
      summary: Amazon Web Services Listconnectors
      description: Returns a list of all the connectors in this account and Region. The list is limited to connectors whose name starts with the specified prefix. The response also includes a description of each of the listed connectors.
      operationId: amazonWebServicesListConnectors
      tags:
      - Connectors
  /v1/connectors/{connectorArn}:
    PUT:
      summary: Amazon Web Services Updateconnector
      description: Updates the specified connector.
      operationId: amazonWebServicesUpdateConnector
      tags:
      - Connectors
  /connectors:
    GET:
      summary: Amazon Web Services Listconnectors
      description: Lists the connectors that you created by using the https://docs.aws.amazon.com/pca-connector-ad/latest/APIReference/API_CreateConnector action.
      operationId: amazonWebServicesListConnectors
      tags:
      - Connectors
  /connectors/{ConnectorArn}:
    GET:
      summary: Amazon Web Services Getconnector
      description: Lists information about your connector. You specify the connector on input by its ARN (Amazon Resource Name).
      operationId: amazonWebServicesGetConnector
      tags:
      - Connectors
x-refined-from:
- kafkaconnect-openapi-original.yml
- pca-connector-ad-openapi-original.yml
