openapi: 3.2.0
info:
  title: Amazon Web Services connect Predefined Attributes API
  description: Amazon Connect is a cloud-based contact center solution that you use to set up and manage a customer contact center and provide reliable customer engagement at any scale.
tags:
- name: Predefined Attributes
paths:
  /predefined-attributes/{InstanceId}:
    GET:
      summary: Amazon Web Services Listpredefinedattributes
      description: Lists predefined attributes for the specified Amazon Connect instance.
      operationId: amazonWebServicesListPredefinedAttributes
      tags:
      - Predefined Attributes
  /predefined-attributes/{InstanceId}/{Name}:
    POST:
      summary: Amazon Web Services Updatepredefinedattribute
      description: Updates a predefined attribute for the specified Amazon Connect instance.
      operationId: amazonWebServicesUpdatePredefinedAttribute
      tags:
      - Predefined Attributes
