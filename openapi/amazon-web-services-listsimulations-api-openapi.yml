openapi: 3.2.0
info:
  title: Amazon Web Services simspaceweaver Listsimulations API
  description: SimSpace Weaver (SimSpace Weaver) is a service that you can use to build and run large-scale spatial simulations in the Amazon Web Services Cloud.
tags:
- name: Listsimulations
paths:
  /listsimulations:
    GET:
      summary: Amazon Web Services Listsimulations
      description: Lists the SimSpace Weaver simulations in the Amazon Web Services account used to make the API call.
      operationId: amazonWebServicesListSimulations
      tags:
      - Listsimulations
