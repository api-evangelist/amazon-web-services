openapi: 3.2.0
info:
  title: Amazon Web Services controltower List Enabled Controls API
  description: These interfaces allow you to apply the Amazon Web Services library of pre-defined controls to your organizational units, programmatically.
tags:
- name: List Enabled Controls
paths:
  /list-enabled-controls:
    POST:
      summary: Amazon Web Services Listenabledcontrols
      description: Lists the controls enabled by Amazon Web Services Control Tower on the specified organizational unit and the accounts it contains. For usage examples, see the Amazon Web Services Control Tower User Guide .
      operationId: amazonWebServicesListEnabledControls
      tags:
      - List Enabled Controls
