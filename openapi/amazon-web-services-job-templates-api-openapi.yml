openapi: 3.2.0
info:
  title: Amazon Web Services iot Job Templates API
  description: 'IoT

    IoT provides secure, bi-directional communication between Internet-connected devices (such as sensors, actuators, embedded devices, or smart appliances) and the Amazon Web Services cloud.'
tags:
- name: Job Templates
paths:
  /job-templates/{jobTemplateId}:
    GET:
      summary: Amazon Web Services Describejobtemplate
      description: Returns information about a job template.
      operationId: amazonWebServicesDescribeJobTemplate
      tags:
      - Job Templates
  /job-templates:
    GET:
      summary: Amazon Web Services Listjobtemplates
      description: Returns a list of job templates. Requires permission to access the ListJobTemplates action.
      operationId: amazonWebServicesListJobTemplates
      tags:
      - Job Templates
  /jobtemplates:
    GET:
      summary: Amazon Web Services Listjobtemplates
      description: 'Lists job templates based on a set of parameters. Job template stores values of StartJobRun API request in a template and can be used to start a job run. Job template allows two use cases: avoid repeating recurring StartJobRun API request values, enforcing certain values in StartJobRun API request.'
      operationId: amazonWebServicesListJobTemplates
      tags:
      - Job Templates
  /jobtemplates/{templateId}:
    GET:
      summary: Amazon Web Services Describejobtemplate
      description: 'Displays detailed information about a specified job template. Job template stores values of StartJobRun API request in a template and can be used to start a job run. Job template allows two use cases: avoid repeating recurring StartJobRun API request values, enforcing certain values in StartJobRun API request.'
      operationId: amazonWebServicesDescribeJobTemplate
      tags:
      - Job Templates
