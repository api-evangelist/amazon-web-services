openapi: 3.2.0
info:
  title: Amazon Web Services applicationcostprofiler Report…
  description: 'This reference provides descriptions of the AWS Application Cost Profiler API.


    The AWS Application Cost Profiler API provides programmatic access to view, create, update, and delete application cost report definitions, as well as to import your usage data into the Application Cost Profiler service.


    For more information about using this service, see the AWS Application Cost Profiler User Guide.'
tags:
- name: reportDefinition
paths:
  /reportDefinition/{reportId}:
    PUT:
      summary: Amazon Web Services Updatereportdefinition
      description: Updates existing report in AWS Application Cost Profiler.
      operationId: amazonWebServicesUpdateReportDefinition
      tags:
      - reportDefinition
  /reportDefinition:
    POST:
      summary: Amazon Web Services Putreportdefinition
      description: Creates the report definition for a report in Application Cost Profiler.
      operationId: amazonWebServicesPutReportDefinition
      tags:
      - reportDefinition
