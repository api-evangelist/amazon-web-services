    POST:
      summary: Amazon Web Services Startstreamtranscription
      description: 'Starts a bidirectional HTTP/2 or WebSocket stream where audio is streamed to Amazon Transcribe and the transcription results are streamed to your application. The following parameters are required: language-code or identify-language or identify-multiple-language media-encoding sample-rate For more information on streaming with Amazon Transcribe, see Transcribing streaming audio.'
      operationId: amazonWebServicesStartStreamTranscription
