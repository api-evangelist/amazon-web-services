openapi: 3.2.0
info:
  title: Amazon Web Services cloudfront-keyvaluestore Key Value…
  description: Amazon CloudFront KeyValueStore Service to View and Update Data in a KVS Resource
tags:
- name: Key Value Stores
paths:
  /key-value-stores/{KvsARN}/keys/{Key}:
    PUT:
      summary: Amazon Web Services Putkey
      description: Creates a new key value pair or replaces the value of an existing key.
      operationId: amazonWebServicesPutKey
      tags:
      - Key Value Stores
  /key-value-stores/{KvsARN}:
    GET:
      summary: Amazon Web Services Describekeyvaluestore
      description: Returns metadata information about Key Value Store.
      operationId: amazonWebServicesDescribeKeyValueStore
      tags:
      - Key Value Stores
  /key-value-stores/{KvsARN}/keys:
    POST:
      summary: Amazon Web Services Updatekeys
      description: Puts or Deletes multiple key value pairs in a single, all-or-nothing operation.
      operationId: amazonWebServicesUpdateKeys
      tags:
      - Key Value Stores
