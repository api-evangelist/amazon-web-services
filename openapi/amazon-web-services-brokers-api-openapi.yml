openapi: 3.2.0
info:
  title: Amazon Web Services mq Brokers API
  description: Amazon MQ is a managed message broker service for Apache ActiveMQ and RabbitMQ that makes it easy to set up and operate message brokers in the cloud. A message broker allows software applications and components to communicate using various programming languages, operating systems, and formal messaging protocols.
tags:
- name: Brokers
paths:
  /v1/brokers:
    GET:
      summary: Amazon Web Services Listbrokers
      description: Returns a list of all brokers.
      operationId: amazonWebServicesListBrokers
      tags:
      - Brokers
  /v1/brokers/{broker-id}/users/{username}:
    PUT:
      summary: Amazon Web Services Updateuser
      description: Updates the information for an ActiveMQ user.
      operationId: amazonWebServicesUpdateUser
      tags:
      - Brokers
  /v1/brokers/{broker-id}:
    PUT:
      summary: Amazon Web Services Updatebroker
      description: Adds a pending configuration change to a broker.
      operationId: amazonWebServicesUpdateBroker
      tags:
      - Brokers
  /v1/brokers/{broker-id}/users:
    GET:
      summary: Amazon Web Services Listusers
      description: Returns a list of all ActiveMQ users.
      operationId: amazonWebServicesListUsers
      tags:
      - Brokers
  /v1/brokers/{broker-id}/promote:
    POST:
      summary: Amazon Web Services Promote
      description: Promotes a data replication replica broker to the primary broker role.
      operationId: amazonWebServicesPromote
      tags:
      - Brokers
  /v1/brokers/{broker-id}/reboot:
    POST:
      summary: Amazon Web Services Rebootbroker
      description: 'Reboots a broker. Note: This API is asynchronous.'
      operationId: amazonWebServicesRebootBroker
      tags:
      - Brokers
