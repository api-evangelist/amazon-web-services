openapi: 3.2.0
info:
  title: Amazon Web Services iot Active Violations API
  description: 'IoT

    IoT provides secure, bi-directional communication between Internet-connected devices (such as sensors, actuators, embedded devices, or smart appliances) and the Amazon Web Services cloud.'
tags:
- name: Active Violations
paths:
  /active-violations:
    GET:
      summary: Amazon Web Services Listactiveviolations
      description: Lists the active violations for a given Device Defender security profile. Requires permission to access the ListActiveViolations action.
      operationId: amazonWebServicesListActiveViolations
      tags:
      - Active Violations
