openapi: 3.2.0
info:
  title: Amazon Web Services oam Get Link API
  description: Use Amazon CloudWatch Observability Access Manager to create and manage links between source accounts and monitoring accounts by using CloudWatch cross-account observability.
tags:
- name: GetLink
paths:
  /GetLink:
    POST:
      summary: Amazon Web Services Getlink
      description: Returns complete information about one link. To use this operation, provide the link ARN. To retrieve a list of link ARNs, use ListLinks.
      operationId: amazonWebServicesGetLink
      tags:
      - GetLink
