openapi: 3.2.0
info:
  title: Amazon Web Services iotwireless Multicast Groups API
  description: AWS IoT Wireless provides bi-directional communication between internet-connected wireless devices and the AWS Cloud.
tags:
- name: Multicast Groups
paths:
  /multicast-groups/{Id}/wireless-device:
    PUT:
      summary: Amazon Web Services Associatewirelessdevicewithmulticastgroup
      description: Associates a wireless device with a multicast group.
      operationId: amazonWebServicesAssociateWirelessDeviceWithMulticastGroup
      tags:
      - Multicast Groups
  /multicast-groups/{Id}/session:
    PUT:
      summary: Amazon Web Services Startmulticastgroupsession
      description: Starts a multicast group session.
      operationId: amazonWebServicesStartMulticastGroupSession
      tags:
      - Multicast Groups
  /multicast-groups:
    GET:
      summary: Amazon Web Services Listmulticastgroups
      description: Lists the multicast groups registered to your AWS account.
      operationId: amazonWebServicesListMulticastGroups
      tags:
      - Multicast Groups
  /multicast-groups/{Id}:
    PATCH:
      summary: Amazon Web Services Updatemulticastgroup
      description: Updates properties of a multicast group session.
      operationId: amazonWebServicesUpdateMulticastGroup
      tags:
      - Multicast Groups
  /multicast-groups/{Id}/wireless-devices/{WirelessDeviceId}:
    DELETE:
      summary: Amazon Web Services Disassociatewirelessdevicefrommulticastgroup
      description: Disassociates a wireless device from a multicast group.
      operationId: amazonWebServicesDisassociateWirelessDeviceFromMulticastGroup
      tags:
      - Multicast Groups
  /multicast-groups/{Id}/data:
    POST:
      summary: Amazon Web Services Senddatatomulticastgroup
      description: Sends the specified data to a multicast group.
      operationId: amazonWebServicesSendDataToMulticastGroup
      tags:
      - Multicast Groups
  /multicast-groups/{Id}/bulk:
    POST:
      summary: Amazon Web Services Startbulkdisassociatewirelessdevicefrommulticastgroup
      description: Starts a bulk disassociatin of all qualifying wireless devices from a multicast group.
      operationId: amazonWebServicesStartBulkDisassociateWirelessDeviceFromMulticastGroup
      tags:
      - Multicast Groups
