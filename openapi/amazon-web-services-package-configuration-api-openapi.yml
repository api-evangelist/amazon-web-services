openapi: 3.2.0
info:
  title: Amazon Web Services iot Package Configuration API
  description: 'IoT

    IoT provides secure, bi-directional communication between Internet-connected devices (such as sensors, actuators, embedded devices, or smart appliances) and the Amazon Web Services cloud.'
tags:
- name: Package Configuration
paths:
  /package-configuration:
    PATCH:
      summary: Amazon Web Services Updatepackageconfiguration
      description: Updates the software package configuration. Requires permission to access the UpdatePackageConfiguration and iam:PassRole actions.
      operationId: amazonWebServicesUpdatePackageConfiguration
      tags:
      - Package Configuration
