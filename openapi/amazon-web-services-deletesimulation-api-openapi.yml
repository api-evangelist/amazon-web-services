openapi: 3.2.0
info:
  title: Amazon Web Services simspaceweaver Deletesimulation API
  description: SimSpace Weaver (SimSpace Weaver) is a service that you can use to build and run large-scale spatial simulations in the Amazon Web Services Cloud.
tags:
- name: Deletesimulation
paths:
  /deletesimulation:
    DELETE:
      summary: Amazon Web Services Deletesimulation
      description: Deletes all SimSpace Weaver resources assigned to the given simulation. Your simulation uses resources in other Amazon Web Services. This API operation doesn't delete resources in other Amazon Web Services.
      operationId: amazonWebServicesDeleteSimulation
      tags:
      - Deletesimulation
