openapi: 3.2.0
info:
  title: Amazon Web Services mediapackage Origin Endpoints API
  description: AWS Elemental MediaPackage
tags:
- name: Origin Endpoints
paths:
  /origin_endpoints:
    GET:
      summary: Amazon Web Services Listoriginendpoints
      description: Returns a collection of OriginEndpoint records.
      operationId: amazonWebServicesListOriginEndpoints
      tags:
      - Origin Endpoints
  /origin_endpoints/{id}:
    PUT:
      summary: Amazon Web Services Updateoriginendpoint
      description: Updates an existing OriginEndpoint.
      operationId: amazonWebServicesUpdateOriginEndpoint
      tags:
      - Origin Endpoints
