openapi: 3.2.0
info:
  title: Amazon Web Services inspector2 Delegatedadminaccounts API
  description: Amazon Inspector is a vulnerability discovery service that automates continuous scanning for security vulnerabilities within your Amazon EC2, Amazon ECR, and Amazon Web Services Lambda environments.
tags:
- name: Delegatedadminaccounts
paths:
  /delegatedadminaccounts/disable:
    POST:
      summary: Amazon Web Services Disabledelegatedadminaccount
      description: Disables the Amazon Inspector delegated administrator for your organization.
      operationId: amazonWebServicesDisableDelegatedAdminAccount
      tags:
      - Delegatedadminaccounts
  /delegatedadminaccounts/enable:
    POST:
      summary: Amazon Web Services Enabledelegatedadminaccount
      description: Enables the Amazon Inspector delegated administrator for your Organizations organization.
      operationId: amazonWebServicesEnableDelegatedAdminAccount
      tags:
      - Delegatedadminaccounts
  /delegatedadminaccounts/get:
    POST:
      summary: Amazon Web Services Getdelegatedadminaccount
      description: Retrieves information about the Amazon Inspector delegated administrator for your organization.
      operationId: amazonWebServicesGetDelegatedAdminAccount
      tags:
      - Delegatedadminaccounts
  /delegatedadminaccounts/list:
    POST:
      summary: Amazon Web Services Listdelegatedadminaccounts
      description: Lists information about the Amazon Inspector delegated administrator of your organization.
      operationId: amazonWebServicesListDelegatedAdminAccounts
      tags:
      - Delegatedadminaccounts
