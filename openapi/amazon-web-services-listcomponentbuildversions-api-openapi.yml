openapi: 3.2.0
info:
  title: Amazon Web Services imagebuilder List Component Build…
  description: EC2 Image Builder is a fully managed Amazon Web Services service that makes it easier to automate the creation, management, and deployment of customized, secure, and up-to-date "golden" server images that are pre-installed and pre-configured with software and settings to meet specific IT standards.
tags:
- name: ListComponentBuildVersions
paths:
  /ListComponentBuildVersions:
    POST:
      summary: Amazon Web Services Listcomponentbuildversions
      description: 'Returns the list of component build versions for the specified semantic version. The semantic version has four nodes: <major>.<minor>.<patch>/<build>. You can assign values for the first three, and can filter on all of them. Filtering: With semantic versioning, you have the flexibility to use wildcards (x) to specify the most recent versions or nodes when selecting the base image or components for your recipe. When you use a wildcard in any node, all nodes to the right of the first wildcard must also be wildcards.'
      operationId: amazonWebServicesListComponentBuildVersions
      tags:
      - ListComponentBuildVersions
