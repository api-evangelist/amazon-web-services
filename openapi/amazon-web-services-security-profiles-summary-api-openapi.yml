openapi: 3.2.0
info:
  title: Amazon Web Services connect Security Profiles Summary API
  description: Amazon Connect is a cloud-based contact center solution that you use to set up and manage a customer contact center and provide reliable customer engagement at any scale.
tags:
- name: Security Profiles Summary
paths:
  /security-profiles-summary/{InstanceId}:
    GET:
      summary: Amazon Web Services Listsecurityprofiles
      description: Provides summary information about the security profiles for the specified Amazon Connect instance. For more information about security profiles, see Security Profiles in the Amazon Connect Administrator Guide.
      operationId: amazonWebServicesListSecurityProfiles
      tags:
      - Security Profiles Summary
