openapi: 3.2.0
info:
  title: Amazon Web Services Backup API
  description: 'Backup

    Backup is a unified backup service designed to protect Amazon Web Services services and their associated data. Backup simplifies the creation, migration, restoration, and deletion of backups, while also providing reporting and auditing.'
tags:
- name: Backup
paths:
  /backup/plans/:
    GET:
      summary: Amazon Web Services Listbackupplans
      description: Returns a list of all active backup plans for an authenticated account. The list contains information such as Amazon Resource Names (ARNs), plan IDs, creation and deletion dates, version IDs, plan names, and creator request IDs.
      operationId: amazonWebServicesListBackupPlans
      tags:
      - Backup
  /backup/plans/{backupPlanId}/selections/:
    GET:
      summary: Amazon Web Services Listbackupselections
      description: Returns an array containing metadata of the resources associated with the target backup plan.
      operationId: amazonWebServicesListBackupSelections
      tags:
      - Backup
  /backup/plans/{backupPlanId}:
    POST:
      summary: Amazon Web Services Updatebackupplan
      description: Updates an existing backup plan identified by its backupPlanId with the input document in JSON format. The new version is uniquely identified by a VersionId.
      operationId: amazonWebServicesUpdateBackupPlan
      tags:
      - Backup
  /backup/plans/{backupPlanId}/selections/{selectionId}:
    GET:
      summary: Amazon Web Services Getbackupselection
      description: Returns selection metadata and a document in JSON format that specifies a list of resources that are associated with a backup plan.
      operationId: amazonWebServicesGetBackupSelection
      tags:
      - Backup
  /backup/plans/{backupPlanId}/toTemplate/:
    GET:
      summary: Amazon Web Services Exportbackupplantemplate
      description: Returns the backup plan that is specified by the plan ID as a backup template.
      operationId: amazonWebServicesExportBackupPlanTemplate
      tags:
      - Backup
  /backup/plans/{backupPlanId}/:
    GET:
      summary: Amazon Web Services Getbackupplan
      description: Returns BackupPlan details for the specified BackupPlanId. The details are the body of a backup plan in JSON format, in addition to plan metadata.
      operationId: amazonWebServicesGetBackupPlan
      tags:
      - Backup
  /backup/template/json/toPlan:
    POST:
      summary: Amazon Web Services Getbackupplanfromjson
      description: Returns a valid JSON document specifying a backup plan or an error.
      operationId: amazonWebServicesGetBackupPlanFromJSON
      tags:
      - Backup
  /backup/template/plans/{templateId}/toPlan:
    GET:
      summary: Amazon Web Services Getbackupplanfromtemplate
      description: Returns the template specified by its templateId as a backup plan.
      operationId: amazonWebServicesGetBackupPlanFromTemplate
      tags:
      - Backup
  /backup/template/plans:
    GET:
      summary: Amazon Web Services Listbackupplantemplates
      description: Returns metadata of your saved backup plan templates, including the template ID, name, and the creation and deletion dates.
      operationId: amazonWebServicesListBackupPlanTemplates
      tags:
      - Backup
  /backup/plans/{backupPlanId}/versions/:
    GET:
      summary: Amazon Web Services Listbackupplanversions
      description: Returns version metadata of your backup plans, including Amazon Resource Names (ARNs), backup plan IDs, creation and deletion dates, plan names, and version IDs.
      operationId: amazonWebServicesListBackupPlanVersions
      tags:
      - Backup
