openapi: 3.2.0
info:
  title: Amazon Web Services panorama Nodes API
  description: 'AWS Panorama

    Overview


    This is the AWS Panorama API Reference. For an introduction to the service, see What is AWS Panorama? in the AWS Panorama Developer Guide.'
tags:
- name: Nodes
paths:
  /nodes/{NodeId}:
    GET:
      summary: Amazon Web Services Describenode
      description: Returns information about a node.
      operationId: amazonWebServicesDescribeNode
      tags:
      - Nodes
  /nodes:
    GET:
      summary: Amazon Web Services Listnodes
      description: Returns a list of nodes.
      operationId: amazonWebServicesListNodes
      tags:
      - Nodes
