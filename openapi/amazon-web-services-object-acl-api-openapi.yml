openapi: 3.2.0
info:
  title: Amazon Web Services AWS S3 Object ACL API
  description: 'The API for Amazon Simple Storage Service (Amazon S3) provides an object

    storage solution with top-notch scalability, data availability, security,

    and performance. It caters to customers of varying sizes and industries,

    offering the ability to store and secure any volume of data for a wide

    range of purposes, including data lakes, cloud-native applications, and

    mobile apps.'
tags:
- name: Object ACL
paths:
  /{Bucket}/{Key+}?acl:
    PUT:
      summary: Amazon Web Services Put Object ACL
      description: This operation is not supported by directory buckets Uses the acl subresource to set the access control list (ACL) permissions for a new or existing object in an S3 bucket
      tags:
      - Object ACL
      operationId: putObjectACL
