openapi: 3.2.0
info:
  title: Amazon Web Services iot Provisioning Templates API
  description: 'IoT

    IoT provides secure, bi-directional communication between Internet-connected devices (such as sensors, actuators, embedded devices, or smart appliances) and the Amazon Web Services cloud.'
tags:
- name: Provisioning Templates
paths:
  /provisioning-templates/{templateName}/provisioning-claim:
    POST:
      summary: Amazon Web Services Createprovisioningclaim
      description: Creates a provisioning claim. Requires permission to access the CreateProvisioningClaim action.
      operationId: amazonWebServicesCreateProvisioningClaim
      tags:
      - Provisioning Templates
  /provisioning-templates:
    GET:
      summary: Amazon Web Services Listprovisioningtemplates
      description: Lists the provisioning templates in your Amazon Web Services account. Requires permission to access the ListProvisioningTemplates action.
      operationId: amazonWebServicesListProvisioningTemplates
      tags:
      - Provisioning Templates
  /provisioning-templates/{templateName}/versions:
    GET:
      summary: Amazon Web Services Listprovisioningtemplateversions
      description: A list of provisioning template versions. Requires permission to access the ListProvisioningTemplateVersions action.
      operationId: amazonWebServicesListProvisioningTemplateVersions
      tags:
      - Provisioning Templates
  /provisioning-templates/{templateName}:
    PATCH:
      summary: Amazon Web Services Updateprovisioningtemplate
      description: Updates a provisioning template. Requires permission to access the UpdateProvisioningTemplate action.
      operationId: amazonWebServicesUpdateProvisioningTemplate
      tags:
      - Provisioning Templates
  /provisioning-templates/{templateName}/versions/{versionId}:
    GET:
      summary: Amazon Web Services Describeprovisioningtemplateversion
      description: Returns information about a provisioning template version. Requires permission to access the DescribeProvisioningTemplateVersion action.
      operationId: amazonWebServicesDescribeProvisioningTemplateVersion
      tags:
      - Provisioning Templates
