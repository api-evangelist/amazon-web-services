openapi: 3.2.0
info:
  title: Amazon Web Services ivschat Delete Message API
  description: 'Introduction


    The Amazon IVS Chat control-plane API enables you to create and manage Amazon IVS Chat resources.'
tags:
- name: DeleteMessage
paths:
  /DeleteMessage:
    POST:
      summary: Amazon Web Services Deletemessage
      description: Sends an event to a specific room which directs clients to delete a specific message; that is, unrender it from view and delete it from the client’s chat history. This event’s EventName is aws:DELETE_MESSAGE. This replicates the DeleteMessage WebSocket operation in the Amazon IVS Chat Messaging API.
      operationId: amazonWebServicesDeleteMessage
      tags:
      - DeleteMessage
