openapi: 3.2.0
info:
  title: Amazon Web Services iot Fleet Metric API
  description: 'IoT

    IoT provides secure, bi-directional communication between Internet-connected devices (such as sensors, actuators, embedded devices, or smart appliances) and the Amazon Web Services cloud.'
tags:
- name: Fleet Metric
paths:
  /fleet-metric/{metricName}:
    PATCH:
      summary: Amazon Web Services Updatefleetmetric
      description: Updates the data for a fleet metric. Requires permission to access the UpdateFleetMetric action.
      operationId: amazonWebServicesUpdateFleetMetric
      tags:
      - Fleet Metric
