openapi: 3.2.0
info:
  title: Amazon Web Services resource-groups List Group Resources API
  description: Resource Groups lets you organize Amazon Web Services resources such as Amazon Elastic Compute Cloud instances, Amazon Relational Database Service databases, and Amazon Simple Storage Service buckets into groups using criteria that you define as tags.
tags:
- name: List Group Resources
paths:
  /list-group-resources:
    POST:
      summary: Amazon Web Services Listgroupresources
      description: 'Returns a list of ARNs of the resources that are members of a specified resource group. Minimum permissions To run this command, you must have the following permissions: resource-groups:ListGroupResources cloudformation:DescribeStacks cloudformation:ListStackResources tag:GetResources'
      operationId: amazonWebServicesListGroupResources
      tags:
      - List Group Resources
