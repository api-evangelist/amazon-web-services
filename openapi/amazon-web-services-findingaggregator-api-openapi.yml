openapi: 3.2.0
info:
  title: Amazon Web Services securityhub Finding Aggregator API
  description: Security Hub provides you with a comprehensive view of your security state in Amazon Web Services and helps you assess your Amazon Web Services environment against security industry standards and best practices.
tags:
- name: findingAggregator
paths:
  /findingAggregator/create:
    POST:
      summary: Amazon Web Services Createfindingaggregator
      description: Used to enable finding aggregation. Must be called from the aggregation Region. For more details about cross-Region replication, see Configuring finding aggregation in the Security Hub User Guide.
      operationId: amazonWebServicesCreateFindingAggregator
      tags:
      - findingAggregator
  /findingAggregator/delete/{FindingAggregatorArn+}:
    DELETE:
      summary: Amazon Web Services Deletefindingaggregator
      description: Deletes a finding aggregator. When you delete the finding aggregator, you stop finding aggregation. When you stop finding aggregation, findings that were already aggregated to the aggregation Region are still visible from the aggregation Region. New findings and finding updates are not aggregated.
      operationId: amazonWebServicesDeleteFindingAggregator
      tags:
      - findingAggregator
  /findingAggregator/get/{FindingAggregatorArn+}:
    GET:
      summary: Amazon Web Services Getfindingaggregator
      description: Returns the current finding aggregation configuration.
      operationId: amazonWebServicesGetFindingAggregator
      tags:
      - findingAggregator
  /findingAggregator/list:
    GET:
      summary: Amazon Web Services Listfindingaggregators
      description: If finding aggregation is enabled, then ListFindingAggregators returns the ARN of the finding aggregator. You can run this operation from any Region.
      operationId: amazonWebServicesListFindingAggregators
      tags:
      - findingAggregator
  /findingAggregator/update:
    PATCH:
      summary: Amazon Web Services Updatefindingaggregator
      description: Updates the finding aggregation configuration. Used to update the Region linking mode and the list of included or excluded Regions. You cannot use UpdateFindingAggregator to change the aggregation Region. You must run UpdateFindingAggregator from the current aggregation Region.
      operationId: amazonWebServicesUpdateFindingAggregator
      tags:
      - findingAggregator
