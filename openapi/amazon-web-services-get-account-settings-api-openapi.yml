openapi: 3.2.0
info:
  title: Amazon Web Services resource-groups Get Account Settings API
  description: Resource Groups lets you organize Amazon Web Services resources such as Amazon Elastic Compute Cloud instances, Amazon Relational Database Service databases, and Amazon Simple Storage Service buckets into groups using criteria that you define as tags.
tags:
- name: Get Account Settings
paths:
  /get-account-settings:
    POST:
      summary: Amazon Web Services Getaccountsettings
      description: Retrieves the current status of optional features in Resource Groups.
      operationId: amazonWebServicesGetAccountSettings
      tags:
      - Get Account Settings
