openapi: 3.2.0
info:
  title: Amazon Web Services cloudfront Origin Access Control API
  description: 'Amazon CloudFront

    This is the Amazon CloudFront API Reference. This guide is for developers who need detailed information about CloudFront API actions, data types, and errors. For detailed information about CloudFront features, see the Amazon CloudFront Developer Guide.'
tags:
- name: Origin Access Control
paths:
  /2020-05-31/origin-access-control:
    GET:
      summary: Amazon Web Services Listoriginaccesscontrols
      description: Gets the list of CloudFront origin access controls in this Amazon Web Services account. You can optionally specify the maximum number of items to receive in the response. If the total number of items in the list exceeds the maximum that you specify, or the default maximum, the response is paginated. To get the next page of items, send another request that specifies the NextMarker value from the current response as the Marker value in the next request.
      operationId: amazonWebServicesListOriginAccessControls
      tags:
      - Origin Access Control
  /2020-05-31/origin-access-control/{Id}:
    GET:
      summary: Amazon Web Services Getoriginaccesscontrol
      description: Gets a CloudFront origin access control, including its unique identifier.
      operationId: amazonWebServicesGetOriginAccessControl
      tags:
      - Origin Access Control
  /2020-05-31/origin-access-control/{Id}/config:
    PUT:
      summary: Amazon Web Services Updateoriginaccesscontrol
      description: Updates a CloudFront origin access control.
      operationId: amazonWebServicesUpdateOriginAccessControl
      tags:
      - Origin Access Control
