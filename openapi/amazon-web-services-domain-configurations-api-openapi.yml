openapi: 3.2.0
info:
  title: Amazon Web Services iot Domain Configurations API
  description: 'IoT

    IoT provides secure, bi-directional communication between Internet-connected devices (such as sensors, actuators, embedded devices, or smart appliances) and the Amazon Web Services cloud.'
tags:
- name: Domain Configurations
paths:
  /domainConfigurations/{domainConfigurationName}:
    PUT:
      summary: Amazon Web Services Updatedomainconfiguration
      description: Updates values stored in the domain configuration. Domain configurations for default endpoints can't be updated. Requires permission to access the UpdateDomainConfiguration action.
      operationId: amazonWebServicesUpdateDomainConfiguration
      tags:
      - Domain Configurations
  /domainConfigurations:
    GET:
      summary: Amazon Web Services Listdomainconfigurations
      description: Gets a list of domain configurations for the user. This list is sorted alphabetically by domain configuration name. Requires permission to access the ListDomainConfigurations action.
      operationId: amazonWebServicesListDomainConfigurations
      tags:
      - Domain Configurations
