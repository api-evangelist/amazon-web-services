info:
  title: Amazon Web Services backup Account Settings API
  description: 'Backup

    Backup is a unified backup service designed to protect Amazon Web Services services and their associated data. Backup simplifies the creation, migration, restoration, and deletion of backups, while also providing reporting and auditing.'
tags:
- name: Account Settings
paths:
  /account-settings:
    PUT:
      summary: Amazon Web Services Updateregionsettings
      description: Updates the current service opt-in settings for the Region. Use the DescribeRegionSettings API to determine the resource types that are supported.
      operationId: amazonWebServicesUpdateRegionSettings
      tags:
      - Account Settings
