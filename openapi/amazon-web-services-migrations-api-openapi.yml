openapi: 3.2.0
info:
  title: Amazon Web Services lex-models Migrations API
  description: 'Amazon Lex Build-Time Actions

    Amazon Lex is an AWS service for building conversational voice and text interfaces. Use these actions to create, update, and delete conversational bots for new and existing client applications.'
tags:
- name: Migrations
paths:
  /migrations/{migrationId}:
    GET:
      summary: Amazon Web Services Getmigration
      description: Provides details about an ongoing or complete migration from an Amazon Lex V1 bot to an Amazon Lex V2 bot. Use this operation to view the migration alerts and warnings related to the migration.
      operationId: amazonWebServicesGetMigration
      tags:
      - Migrations
  /migrations:
    POST:
      summary: Amazon Web Services Startmigration
      description: Starts migrating a bot from Amazon Lex V1 to Amazon Lex V2. Migrate your bot when you want to take advantage of the new features of Amazon Lex V2. For more information, see Migrating a bot in the Amazon Lex developer guide.
      operationId: amazonWebServicesStartMigration
      tags:
      - Migrations
