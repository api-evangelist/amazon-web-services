openapi: 3.2.0
info:
  title: Amazon Web Services Settings API
  version: '1.0'
  description: 'Operations tagged Settings across 3 of this provider''s published API definitions: auditmanager-openapi-original.yml, chime-openapi-original.yml, chime-sdk-voice-openapi-original.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Settings
paths:
  /settings/{attribute}:
    GET:
      summary: Amazon Web Services Getsettings
      description: Gets the settings for a specified Amazon Web Services account.
      operationId: amazonWebServicesGetSettings
      tags:
      - Settings
  /settings:
    PUT:
      summary: Amazon Web Services Updatesettings
      description: Updates Audit Manager settings for the current account.
      operationId: amazonWebServicesUpdateSettings
      tags:
      - Settings
  /settings/phone-number:
    PUT:
      summary: Amazon Web Services Updatephonenumbersettings
      description: Updates the phone number settings for the administrator's AWS account, such as the default outbound calling name. You can update the default outbound calling name once every seven days. Outbound calling names can take up to 72 hours to update.
      operationId: amazonWebServicesUpdatePhoneNumberSettings
      tags:
      - Settings
x-refined-from:
- auditmanager-openapi-original.yml
- chime-openapi-original.yml
- chime-sdk-voice-openapi-original.yml
