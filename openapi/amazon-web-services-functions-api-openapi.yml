openapi: 3.2.0
info:
  title: Amazon Web Services appsync Functions API
  description: AppSync provides API actions for creating and interacting with data sources using GraphQL from your application.
tags:
- name: Functions
paths:
  /v1/apis/{apiId}/functions:
    GET:
      summary: Amazon Web Services Listfunctions
      description: List multiple functions.
      operationId: amazonWebServicesListFunctions
      tags:
      - Functions
  /v1/apis/{apiId}/functions/{functionId}:
    POST:
      summary: Amazon Web Services Updatefunction
      description: Updates a Function object.
      operationId: amazonWebServicesUpdateFunction
      tags:
      - Functions
  /v1/apis/{apiId}/functions/{functionId}/resolvers:
    GET:
      summary: Amazon Web Services Listresolversbyfunction
      description: List the resolvers that are associated with a specific function.
      operationId: amazonWebServicesListResolversByFunction
      tags:
      - Functions
