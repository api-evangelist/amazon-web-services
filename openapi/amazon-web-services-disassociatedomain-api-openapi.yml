openapi: 3.2.0
info:
  title: Amazon Web Services worklink Disassociate Domain API
  description: Amazon WorkLink is a cloud-based service that provides secure access to internal websites and web apps from iOS and Android phones.
tags:
- name: disassociateDomain
paths:
  /disassociateDomain:
    POST:
      summary: Amazon Web Services Disassociatedomain
      description: Disassociates a domain from Amazon WorkLink. End users lose the ability to access the domain with Amazon WorkLink.
      operationId: amazonWebServicesDisassociateDomain
      tags:
      - disassociateDomain
