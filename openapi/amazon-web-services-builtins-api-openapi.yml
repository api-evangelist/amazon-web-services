openapi: 3.2.0
info:
  title: Amazon Web Services Builtins API
  version: '1.0'
  description: 'Operations tagged Builtins across 2 of this provider''s published API definitions: lex-models-openapi-original.yml, modelslexv2-openapi-original.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Builtins
paths:
  /builtins/intents/{signature}:
    GET:
      summary: Amazon Web Services Getbuiltinintent
      description: Returns information about a built-in intent. This operation requires permission for the lex:GetBuiltinIntent action.
      operationId: amazonWebServicesGetBuiltinIntent
      tags:
      - Builtins
  /builtins/intents/:
    GET:
      summary: Amazon Web Services Getbuiltinintents
      description: Gets a list of built-in intents that meet the specified criteria. This operation requires permission for the lex:GetBuiltinIntents action.
      operationId: amazonWebServicesGetBuiltinIntents
      tags:
      - Builtins
  /builtins/slottypes/:
    GET:
      summary: Amazon Web Services Getbuiltinslottypes
      description: Gets a list of built-in slot types that meet the specified criteria. For a list of built-in slot types, see Slot Type Reference in the Alexa Skills Kit. This operation requires permission for the lex:GetBuiltInSlotTypes action.
      operationId: amazonWebServicesGetBuiltinSlotTypes
      tags:
      - Builtins
  /builtins/locales/{localeId}/intents/:
    POST:
      summary: Amazon Web Services Listbuiltinintents
      description: Gets a list of built-in intents provided by Amazon Lex that you can use in your bot. To use a built-in intent as a the base for your own intent, include the built-in intent signature in the parentIntentSignature parameter when you call the CreateIntent operation. For more information, see CreateIntent.
      operationId: amazonWebServicesListBuiltInIntents
      tags:
      - Builtins
  /builtins/locales/{localeId}/slottypes/:
    POST:
      summary: Amazon Web Services Listbuiltinslottypes
      description: Gets a list of built-in slot types that meet the specified criteria.
      operationId: amazonWebServicesListBuiltInSlotTypes
      tags:
      - Builtins
x-refined-from:
- lex-models-openapi-original.yml
- modelslexv2-openapi-original.yml
