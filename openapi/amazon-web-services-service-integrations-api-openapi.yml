openapi: 3.2.0
info:
  title: Amazon Web Services devops-guru Service Integrations API
  description: Amazon DevOps Guru is a fully managed service that helps you identify anomalous behavior in business critical operational applications.
tags:
- name: Service Integrations
paths:
  /service-integrations:
    PUT:
      summary: Amazon Web Services Updateserviceintegration
      description: Enables or disables integration with a service that can be integrated with DevOps Guru. The one service that can be integrated with DevOps Guru is Amazon Web Services Systems Manager, which can be used to create an OpsItem for each generated insight.
      operationId: amazonWebServicesUpdateServiceIntegration
      tags:
      - Service Integrations
