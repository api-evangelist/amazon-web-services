openapi: 3.2.0
info:
  title: Amazon Web Services ivs Import Playback Key Pair API
  description: 'Introduction


    The Amazon Interactive Video Service (IVS) API is REST compatible, using a standard HTTP API and an Amazon Web Services EventBridge event stream for responses.'
tags:
- name: ImportPlaybackKeyPair
paths:
  /ImportPlaybackKeyPair:
    POST:
      summary: Amazon Web Services Importplaybackkeypair
      description: Imports the public portion of a new key pair and returns its arn and fingerprint. The privateKey can then be used to generate viewer authorization tokens, to grant viewers access to private channels. For more information, see Setting Up Private Channels in the Amazon IVS User Guide.
      operationId: amazonWebServicesImportPlaybackKeyPair
      tags:
      - ImportPlaybackKeyPair
