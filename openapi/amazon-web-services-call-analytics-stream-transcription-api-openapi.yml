openapi: 3.2.0
info:
  title: Amazon Web Services transcribe-streaming Call Analytics…
  description: 'Amazon Transcribe streaming offers three main types of real-time transcription: Standard, Medical, and Call Analytics.'
tags:
- name: Call Analytics Stream Transcription
paths:
  /call-analytics-stream-transcription:
    POST:
      summary: Amazon Web Services Startcallanalyticsstreamtranscription
      description: 'Starts a bidirectional HTTP/2 or WebSocket stream where audio is streamed to Amazon Transcribe and the transcription results are streamed to your application. Use this operation for Call Analytics transcriptions. The following parameters are required: language-code media-encoding sample-rate For more information on streaming with Amazon Transcribe, see Transcribing streaming audio.'
      operationId: amazonWebServicesStartCallAnalyticsStreamTranscription
      tags:
      - Call Analytics Stream Transcription
