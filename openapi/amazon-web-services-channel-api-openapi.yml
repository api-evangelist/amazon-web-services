openapi: 3.2.0
info:
  title: Amazon Web Services mediatailor Channel API
  description: Use the AWS Elemental MediaTailor SDKs and CLI to configure scalable ad insertion and linear channels.
tags:
- name: Channel
paths:
  /channel/{ChannelName}:
    PUT:
      summary: Amazon Web Services Updatechannel
      description: Updates a channel. For information about MediaTailor channels, see Working with channels in the MediaTailor User Guide.
      operationId: amazonWebServicesUpdateChannel
      tags:
      - Channel
  /channel/{ChannelName}/program/{ProgramName}:
    PUT:
      summary: Amazon Web Services Updateprogram
      description: Updates a program within a channel.
      operationId: amazonWebServicesUpdateProgram
      tags:
      - Channel
  /channel/{ChannelName}/policy:
    PUT:
      summary: Amazon Web Services Putchannelpolicy
      description: Creates an IAM policy for the channel. IAM policies are used to control access to your channel.
      operationId: amazonWebServicesPutChannelPolicy
      tags:
      - Channel
  /channel/{ChannelName}/schedule:
    GET:
      summary: Amazon Web Services Getchannelschedule
      description: Retrieves information about your channel's schedule.
      operationId: amazonWebServicesGetChannelSchedule
      tags:
      - Channel
  /channel/{ChannelName}/start:
    PUT:
      summary: Amazon Web Services Startchannel
      description: Starts a channel. For information about MediaTailor channels, see Working with channels in the MediaTailor User Guide.
      operationId: amazonWebServicesStartChannel
      tags:
      - Channel
  /channel/{ChannelName}/stop:
    PUT:
      summary: Amazon Web Services Stopchannel
      description: Stops a channel. For information about MediaTailor channels, see Working with channels in the MediaTailor User Guide.
      operationId: amazonWebServicesStopChannel
      tags:
      - Channel
