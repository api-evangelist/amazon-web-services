openapi: 3.2.0
info:
  title: Amazon Web Services kafka Replication API
  description: The operations for managing an Amazon MSK cluster.
tags:
- name: Replication
paths:
  /replication/v1/replicators:
    GET:
      summary: Amazon Web Services Listreplicators
      description: Lists the replicators.
      operationId: amazonWebServicesListReplicators
      tags:
      - Replication
  /replication/v1/replicators/{replicatorArn}:
    GET:
      summary: Amazon Web Services Describereplicator
      description: Returns a description of the Kafka Replicator whose Amazon Resource Name (ARN) is specified in the request.
      operationId: amazonWebServicesDescribeReplicator
      tags:
      - Replication
  /replication/v1/replicators/{replicatorArn}/replication-info:
    PUT:
      summary: Amazon Web Services Updatereplicationinfo
      description: Updates replication info of a replicator.
      operationId: amazonWebServicesUpdateReplicationInfo
      tags:
      - Replication
