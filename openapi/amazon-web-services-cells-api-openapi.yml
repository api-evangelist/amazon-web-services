openapi: 3.2.0
info:
  title: Amazon Web Services route53-recovery-readiness Cells API
  description: Recovery readiness
tags:
- name: Cells
paths:
  /cells:
    GET:
      summary: Amazon Web Services Listcells
      description: Lists the cells for an account.
      operationId: amazonWebServicesListCells
      tags:
      - Cells
  /cells/{cellName}:
    PUT:
      summary: Amazon Web Services Updatecell
      description: Updates a cell to replace the list of nested cells with a new list of nested cells.
      operationId: amazonWebServicesUpdateCell
      tags:
      - Cells
