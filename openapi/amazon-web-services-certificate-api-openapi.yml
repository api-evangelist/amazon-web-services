openapi: 3.2.0
info:
  title: Amazon Web Services iot Certificate API
  description: 'IoT

    IoT provides secure, bi-directional communication between Internet-connected devices (such as sensors, actuators, embedded devices, or smart appliances) and the Amazon Web Services cloud.'
tags:
- name: Certificate
paths:
  /certificate/register:
    POST:
      summary: Amazon Web Services Registercertificate
      description: Registers a device certificate with IoT in the same certificate mode as the signing CA. If you have more than one CA certificate that has the same subject field, you must specify the CA certificate that was used to sign the device certificate being registered. Requires permission to access the RegisterCertificate action.
      operationId: amazonWebServicesRegisterCertificate
      tags:
      - Certificate
  /certificate/register-no-ca:
    POST:
      summary: Amazon Web Services Registercertificatewithoutca
      description: Register a certificate that does not have a certificate authority (CA). For supported certificates, consult Certificate signing algorithms supported by IoT.
      operationId: amazonWebServicesRegisterCertificateWithoutCA
      tags:
      - Certificate
