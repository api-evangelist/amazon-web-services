openapi: 3.2.0
info:
  title: Amazon Web Services Event Configurations API
  version: '1.0'
  description: 'Operations tagged Event Configurations across 2 of this provider''s published API definitions: iot-openapi-original.yml, iotwireless-openapi-original.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Event Configurations
paths:
  /event-configurations:
    PATCH:
      summary: Amazon Web Services Updateeventconfigurations
      description: Updates the event configurations. Requires permission to access the UpdateEventConfigurations action.
      operationId: amazonWebServicesUpdateEventConfigurations
      tags:
      - Event Configurations
    GET:
      summary: Amazon Web Services Listeventconfigurations
      description: List event configurations where at least one event topic has been enabled.
      operationId: amazonWebServicesListEventConfigurations
      tags:
      - Event Configurations
  /event-configurations/{Identifier}:
    PATCH:
      summary: Amazon Web Services Updateresourceeventconfiguration
      description: Update the event configuration for a particular resource identifier.
      operationId: amazonWebServicesUpdateResourceEventConfiguration
      tags:
      - Event Configurations
x-refined-from:
- iot-openapi-original.yml
- iotwireless-openapi-original.yml
