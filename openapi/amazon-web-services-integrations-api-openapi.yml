info:
  title: Amazon Web Services Integrations API
  version: '1.0'
  description: 'Operations tagged Integrations across 2 of this provider''s published API definitions: apigatewayv2-openapi-original.yml, customer-profiles-openapi-original.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Integrations
paths:
  /v2/apis/{apiId}/integrations:
    GET:
      summary: Amazon Web Services Getintegrations
      description: Gets the Integrations for an API.
      operationId: amazonWebServicesGetIntegrations
      tags:
      - Integrations
  /v2/apis/{apiId}/integrations/{integrationId}/integrationresponses:
    GET:
      summary: Amazon Web Services Getintegrationresponses
      description: Gets the IntegrationResponses for an Integration.
      operationId: amazonWebServicesGetIntegrationResponses
      tags:
      - Integrations
  /v2/apis/{apiId}/integrations/{integrationId}:
    PATCH:
      summary: Amazon Web Services Updateintegration
      description: Updates an Integration.
      operationId: amazonWebServicesUpdateIntegration
      tags:
      - Integrations
  /v2/apis/{apiId}/integrations/{integrationId}/integrationresponses/{integrationResponseId}:
    PATCH:
      summary: Amazon Web Services Updateintegrationresponse
      description: Updates an IntegrationResponses.
      operationId: amazonWebServicesUpdateIntegrationResponse
      tags:
      - Integrations
  /integrations:
    POST:
      summary: Amazon Web Services Listaccountintegrations
      description: Lists all of the integrations associated to a specific URI in the AWS account.
      operationId: amazonWebServicesListAccountIntegrations
      tags:
      - Integrations
