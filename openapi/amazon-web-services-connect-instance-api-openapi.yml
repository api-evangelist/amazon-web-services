openapi: 3.2.0
info:
  title: Amazon Web Services connectcampaigns Connect Instance API
  description: Provide APIs to create and manage Amazon Connect Campaigns.
tags:
- name: Connect Instance
paths:
  /connect-instance/{connectInstanceId}/config:
    GET:
      summary: Amazon Web Services Getconnectinstanceconfig
      description: Get the specific Connect instance config.
      operationId: amazonWebServicesGetConnectInstanceConfig
      tags:
      - Connect Instance
  /connect-instance/{connectInstanceId}/onboarding:
    PUT:
      summary: Amazon Web Services Startinstanceonboardingjob
      description: Onboard the specific Amazon Connect instance to Connect Campaigns.
      operationId: amazonWebServicesStartInstanceOnboardingJob
      tags:
      - Connect Instance
