openapi: 3.2.0
info:
  title: Amazon Web Services codestar-notifications Unsubscribe API
  description: This AWS CodeStar Notifications API Reference provides descriptions and usage examples of the operations and data types for the AWS CodeStar Notifications API.
tags:
- name: Unsubscribe
paths:
  /unsubscribe:
    POST:
      summary: Amazon Web Services Unsubscribe
      description: Removes an association between a notification rule and an Chatbot topic so that subscribers to that topic stop receiving notifications when the events described in the rule are triggered.
      operationId: amazonWebServicesUnsubscribe
      tags:
      - Unsubscribe
