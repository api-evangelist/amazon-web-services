openapi: 3.2.0
info:
  title: Amazon Web Services Certificates API
  version: '1.0'
  description: 'Operations tagged Certificates across 2 of this provider''s published API definitions: iot-openapi-original.yml, mediaconvert-openapi-original.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Certificates
paths:
  /certificates:
    GET:
      summary: Amazon Web Services Listcertificates
      description: Lists the certificates registered in your Amazon Web Services account. The results are paginated with a default page size of 25. You can use the returned marker to retrieve additional results. Requires permission to access the ListCertificates action.
      operationId: amazonWebServicesListCertificates
      tags:
      - Certificates
  /certificates/{certificateId}:
    PUT:
      summary: Amazon Web Services Updatecertificate
      description: Updates the status of the specified certificate. This operation is idempotent. Requires permission to access the UpdateCertificate action. Certificates must be in the ACTIVE state to authenticate devices that use a certificate to connect to IoT. Within a few minutes of updating a certificate from the ACTIVE state to any other state, IoT disconnects all devices that used that certificate to connect. Devices cannot use a certificate that is not in the ACTIVE state to reconnect.
      operationId: amazonWebServicesUpdateCertificate
      tags:
      - Certificates
  /2017-08-29/certificates:
    POST:
      summary: Amazon Web Services Associatecertificate
      description: Associates an AWS Certificate Manager (ACM) Amazon Resource Name (ARN) with AWS Elemental MediaConvert.
      operationId: amazonWebServicesAssociateCertificate
      tags:
      - Certificates
  /2017-08-29/certificates/{arn}:
    DELETE:
      summary: Amazon Web Services Disassociatecertificate
      description: Removes an association between the Amazon Resource Name (ARN) of an AWS Certificate Manager (ACM) certificate and an AWS Elemental MediaConvert resource.
      operationId: amazonWebServicesDisassociateCertificate
      tags:
      - Certificates
x-refined-from:
- iot-openapi-original.yml
- mediaconvert-openapi-original.yml
