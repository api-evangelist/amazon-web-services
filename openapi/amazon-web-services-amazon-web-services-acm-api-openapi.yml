openapi: 3.2.0
info:
  title: Amazon Web Services Acm API
  description: 'Certificate Manager

    You can use Certificate Manager (ACM) to manage SSL/TLS certificates for your Amazon Web Services-based websites and applications. For more information about using ACM, see the Certificate Manager User Guide.'
tags:
- name: Amazon Web Services Acm
paths:
  /:
    POST:
      summary: Amazon Web Services Updatecertificateoptions
      description: Updates a certificate. Currently, you can use this function to specify whether to opt in to or out of recording your certificate in a certificate transparency log. For more information, see Opting Out of Certificate Transparency Logging.
      operationId: amazonWebServicesUpdateCertificateOptions
      tags:
      - Amazon Web Services Acm
