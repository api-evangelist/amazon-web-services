openapi: 3.2.0
info:
  title: Amazon Web Services vpc-lattice Accesslogsubscriptions API
  description: Amazon VPC Lattice is a fully managed application networking service that you use to connect, secure, and monitor all of your services across multiple accounts and virtual private clouds (VPCs). Amazon VPC Lattice interconnects your microservices and legacy services within a logical boundary, so that you can discover and manage them more efficiently. For more information, see the Amazon VPC Lattice User Guide
tags:
- name: Accesslogsubscriptions
paths:
  /accesslogsubscriptions:
    GET:
      summary: Amazon Web Services Listaccesslogsubscriptions
      description: Lists all access log subscriptions for the specified service network or service.
      operationId: amazonWebServicesListAccessLogSubscriptions
      tags:
      - Accesslogsubscriptions
  /accesslogsubscriptions/{accessLogSubscriptionIdentifier}:
    PATCH:
      summary: Amazon Web Services Updateaccesslogsubscription
      description: Updates the specified access log subscription.
      operationId: amazonWebServicesUpdateAccessLogSubscription
      tags:
      - Accesslogsubscriptions
