openapi: 3.2.0
info:
  title: Amazon Web Services amplifyuibuilder Export API
  description: The Amplify UI Builder API provides a programmatic interface for creating and configuring user interface (UI) component libraries and themes for use in your Amplify applications.
tags:
- name: Export
paths:
  /export/app/{appId}/environment/{environmentName}/components:
    GET:
      summary: Amazon Web Services Exportcomponents
      description: Exports component configurations to code that is ready to integrate into an Amplify app.
      operationId: amazonWebServicesExportComponents
      tags:
      - Export
  /export/app/{appId}/environment/{environmentName}/forms:
    GET:
      summary: Amazon Web Services Exportforms
      description: Exports form configurations to code that is ready to integrate into an Amplify app.
      operationId: amazonWebServicesExportForms
      tags:
      - Export
  /export/app/{appId}/environment/{environmentName}/themes:
    GET:
      summary: Amazon Web Services Exportthemes
      description: Exports theme configurations to code that is ready to integrate into an Amplify app.
      operationId: amazonWebServicesExportThemes
      tags:
      - Export
