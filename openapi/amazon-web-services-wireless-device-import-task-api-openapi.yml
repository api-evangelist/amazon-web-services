openapi: 3.2.0
info:
  title: Amazon Web Services iotwireless Wireless Device Import Task…
  description: AWS IoT Wireless provides bi-directional communication between internet-connected wireless devices and the AWS Cloud.
tags:
- name: Wireless Device Import Task
paths:
  /wireless_device_import_task/{Id}:
    PATCH:
      summary: Amazon Web Services Updatewirelessdeviceimporttask
      description: Update an import task to add more devices to the task.
      operationId: amazonWebServicesUpdateWirelessDeviceImportTask
      tags:
      - Wireless Device Import Task
  /wireless_device_import_task:
    POST:
      summary: Amazon Web Services Startwirelessdeviceimporttask
      description: Start import task for provisioning Sidewalk devices in bulk using an S3 CSV file.
      operationId: amazonWebServicesStartWirelessDeviceImportTask
      tags:
      - Wireless Device Import Task
