openapi: 3.2.0
info:
  title: Amazon Web Services docdb-elastic Cluster Snapshot API
  description: The new Amazon Elastic DocumentDB service endpoint.
tags:
- name: Cluster Snapshot
paths:
  /cluster-snapshot:
    POST:
      summary: Amazon Web Services Createclustersnapshot
      description: Creates a snapshot of a cluster.
      operationId: amazonWebServicesCreateClusterSnapshot
      tags:
      - Cluster Snapshot
  /cluster-snapshot/{snapshotArn}:
    GET:
      summary: Amazon Web Services Getclustersnapshot
      description: Returns information about a specific Elastic DocumentDB snapshot
      operationId: amazonWebServicesGetClusterSnapshot
      tags:
      - Cluster Snapshot
  /cluster-snapshot/{snapshotArn}/restore:
    POST:
      summary: Amazon Web Services Restoreclusterfromsnapshot
      description: Restores a Elastic DocumentDB cluster from a snapshot.
      operationId: amazonWebServicesRestoreClusterFromSnapshot
      tags:
      - Cluster Snapshot
