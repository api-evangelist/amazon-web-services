openapi: 3.2.0
info:
  title: Amazon Web Services cloudfront Key Value Store API
  description: 'Amazon CloudFront

    This is the Amazon CloudFront API Reference. This guide is for developers who need detailed information about CloudFront API actions, data types, and errors. For detailed information about CloudFront features, see the Amazon CloudFront Developer Guide.'
tags:
- name: Key Value Store
paths:
  /2020-05-31/key-value-store/:
    POST:
      summary: Amazon Web Services Createkeyvaluestore
      description: Specifies the Key Value Store resource to add to your account. In your account, the Key Value Store names must be unique. You can also import Key Value Store data in JSON format from an S3 bucket by providing a valid ImportSource that you own.
      operationId: amazonWebServicesCreateKeyValueStore
      tags:
      - Key Value Store
  /2020-05-31/key-value-store/{Name}:
    PUT:
      summary: Amazon Web Services Updatekeyvaluestore
      description: Specifies the Key Value Store to update.
      operationId: amazonWebServicesUpdateKeyValueStore
      tags:
      - Key Value Store
  /2020-05-31/key-value-store:
    GET:
      summary: Amazon Web Services Listkeyvaluestores
      description: Specifies the Key Value Stores to list.
      operationId: amazonWebServicesListKeyValueStores
      tags:
      - Key Value Store
