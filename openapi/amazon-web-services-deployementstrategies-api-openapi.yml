openapi: 3.2.0
info:
  title: Amazon Web Services appconfig Deployementstrategies API
  description: Use AppConfig, a capability of Amazon Web Services Systems Manager, to create, manage, and quickly deploy application configurations.
tags:
- name: Deployementstrategies
paths:
  /deployementstrategies/{DeploymentStrategyId}:
    DELETE:
      summary: Amazon Web Services Deletedeploymentstrategy
      description: Deletes a deployment strategy. Deleting a deployment strategy does not delete a configuration from a host.
      operationId: amazonWebServicesDeleteDeploymentStrategy
      tags:
      - Deployementstrategies
