openapi: 3.2.0
info:
  title: Amazon Web Services ssm-sap List Applications API
  description: This API reference provides descriptions, syntax, and other details about each of the actions and data types for AWS Systems Manager for SAP. The topic for each action shows the API request parameters and responses.
tags:
- name: List Applications
paths:
  /list-applications:
    POST:
      summary: Amazon Web Services Listapplications
      description: Lists all the applications registered with AWS Systems Manager for SAP.
      operationId: amazonWebServicesListApplications
      tags:
      - List Applications
  /ListApplications:
    POST:
      summary: Amazon Web Services Listapplications
      description: Retrieves all applications or multiple applications by ID.
      operationId: amazonWebServicesListApplications
      tags:
      - List Applications
