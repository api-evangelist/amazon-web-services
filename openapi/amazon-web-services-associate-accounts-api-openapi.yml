openapi: 3.2.0
info:
  title: Amazon Web Services billingconductor Associate Accounts API
  description: Amazon Web Services Billing Conductor is a fully managed service that you can use to customize a proforma version of your billing data each month, to accurately show or chargeback your end customers.
tags:
- name: Associate Accounts
paths:
  /associate-accounts:
    POST:
      summary: Amazon Web Services Associateaccounts
      description: Connects an array of account IDs in a consolidated billing family to a predefined billing group. The account IDs must be a part of the consolidated billing family during the current month, and not already associated with another billing group. The maximum number of accounts that can be associated in one call is 30.
      operationId: amazonWebServicesAssociateAccounts
      tags:
      - Associate Accounts
