openapi: 3.2.0
info:
  title: Amazon Web Services connect Analytics Data API
  description: Amazon Connect is a cloud-based contact center solution that you use to set up and manage a customer contact center and provide reliable customer engagement at any scale.
tags:
- name: Analytics Data
paths:
  /analytics-data/instance/{InstanceId}/association:
    GET:
      summary: Amazon Web Services Listanalyticsdataassociations
      description: This API is in preview release for Amazon Connect and is subject to change. Lists the association status of requested dataset ID for a given Amazon Connect instance.
      operationId: amazonWebServicesListAnalyticsDataAssociations
      tags:
      - Analytics Data
  /analytics-data/instance/{InstanceId}/associations:
    POST:
      summary: Amazon Web Services Batchdisassociateanalyticsdataset
      description: This API is in preview release for Amazon Connect and is subject to change. Removes a list of analytics datasets associated with a given Amazon Connect instance. You can disassociate multiple datasets in a single call.
      operationId: amazonWebServicesBatchDisassociateAnalyticsDataSet
      tags:
      - Analytics Data
