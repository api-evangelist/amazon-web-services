openapi: 3.2.0
info:
  title: Amazon Web Services devops-guru Anomalies API
  description: Amazon DevOps Guru is a fully managed service that helps you identify anomalous behavior in business critical operational applications.
tags:
- name: Anomalies
paths:
  /anomalies/{Id}:
    GET:
      summary: Amazon Web Services Describeanomaly
      description: Returns details about an anomaly that you specify using its ID.
      operationId: amazonWebServicesDescribeAnomaly
      tags:
      - Anomalies
  /anomalies/insight/{InsightId}:
    POST:
      summary: Amazon Web Services Listanomaliesforinsight
      description: Returns a list of the anomalies that belong to an insight that you specify using its ID.
      operationId: amazonWebServicesListAnomaliesForInsight
      tags:
      - Anomalies
