openapi: 3.2.0
info:
  title: Amazon Web Services Vpclinks API
  version: '1.0'
  description: 'Operations tagged Vpclinks across 2 of this provider''s published API definitions: apigateway-openapi-original.yml, apigatewayv2-openapi-original.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Vpclinks
paths:
  /vpclinks:
    GET:
      summary: Amazon Web Services Getvpclinks
      description: Gets the VpcLinks collection under the caller's account in a selected region.
      operationId: amazonWebServicesGetVpcLinks
      tags:
      - Vpclinks
  /vpclinks/{vpclink_id}:
    PATCH:
      summary: Amazon Web Services Updatevpclink
      description: Updates an existing VpcLink of a specified identifier.
      operationId: amazonWebServicesUpdateVpcLink
      tags:
      - Vpclinks
  /v2/vpclinks:
    GET:
      summary: Amazon Web Services Getvpclinks
      description: Gets a collection of VPC links.
      operationId: amazonWebServicesGetVpcLinks
      tags:
      - Vpclinks
  /v2/vpclinks/{vpcLinkId}:
    PATCH:
      summary: Amazon Web Services Updatevpclink
      description: Updates a VPC link.
      operationId: amazonWebServicesUpdateVpcLink
      tags:
      - Vpclinks
x-refined-from:
- apigateway-openapi-original.yml
- apigatewayv2-openapi-original.yml
