openapi: 3.2.0
info:
  title: Amazon Web Services simspaceweaver Stopsimulation API
  description: SimSpace Weaver (SimSpace Weaver) is a service that you can use to build and run large-scale spatial simulations in the Amazon Web Services Cloud.
tags:
- name: Stopsimulation
paths:
  /stopsimulation:
    POST:
      summary: Amazon Web Services Stopsimulation
      description: Stops the given simulation. You can't restart a simulation after you stop it. If you want to restart a simulation, then you must stop it, delete it, and start a new instance of it.
      operationId: amazonWebServicesStopSimulation
      tags:
      - Stopsimulation
