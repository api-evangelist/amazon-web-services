openapi: 3.2.0
info:
  title: Amazon Web Services iot Registrationcode API
  description: 'IoT

    IoT provides secure, bi-directional communication between Internet-connected devices (such as sensors, actuators, embedded devices, or smart appliances) and the Amazon Web Services cloud.'
tags:
- name: Registrationcode
paths:
  /registrationcode:
    GET:
      summary: Amazon Web Services Getregistrationcode
      description: Gets a registration code used to register a CA certificate with IoT. IoT will create a registration code as part of this API call if the registration code doesn't exist or has been deleted. If you already have a registration code, this API call will return the same registration code. Requires permission to access the GetRegistrationCode action.
      operationId: amazonWebServicesGetRegistrationCode
      tags:
      - Registrationcode
