openapi: 3.2.0
info:
  title: Amazon Web Services sagemaker-a2i-runtime Human Loops API
  description: Amazon Augmented AI (Amazon A2I) adds the benefit of human judgment to any machine learning application.
tags:
- name: Human Loops
paths:
  /human-loops/{HumanLoopName}:
    GET:
      summary: Amazon Web Services Describehumanloop
      description: Returns information about the specified human loop. If the human loop was deleted, this operation will return a ResourceNotFoundException error.
      operationId: amazonWebServicesDescribeHumanLoop
      tags:
      - Human Loops
  /human-loops:
    POST:
      summary: Amazon Web Services Starthumanloop
      description: Starts a human loop, provided that at least one activation condition is met.
      operationId: amazonWebServicesStartHumanLoop
      tags:
      - Human Loops
  /human-loops/stop:
    POST:
      summary: Amazon Web Services Stophumanloop
      description: Stops the specified human loop.
      operationId: amazonWebServicesStopHumanLoop
      tags:
      - Human Loops
