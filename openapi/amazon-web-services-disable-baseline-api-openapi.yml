openapi: 3.2.0
info:
  title: Amazon Web Services controltower Disable Baseline API
  description: These interfaces allow you to apply the Amazon Web Services library of pre-defined controls to your organizational units, programmatically.
tags:
- name: Disable Baseline
paths:
  /disable-baseline:
    POST:
      summary: Amazon Web Services Disablebaseline
      description: Disable an EnabledBaseline resource on the specified Target. This API starts an asynchronous operation to remove all resources deployed as part of the baseline enablement. The resource will vary depending on the enabled baseline.
      operationId: amazonWebServicesDisableBaseline
      tags:
      - Disable Baseline
