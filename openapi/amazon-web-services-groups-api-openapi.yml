info:
  title: Amazon Web Services Groups API
  version: '1.0'
  description: 'Operations tagged Groups across 4 of this provider''s published API definitions: resource-groups-openapi-original.yml, synthetics-openapi-original.yml, workdocs-openapi-original.yml, xray-openapi-original.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Groups
paths:
  /groups:
    POST:
      summary: Amazon Web Services Creategroup
      description: 'Creates a resource group with the specified name and description. You can optionally include either a resource query or a service configuration. For more information about constructing a resource query, see Build queries and groups in Resource Groups in the Resource Groups User Guide. For more information about service-linked groups and service configurations, see Service configurations for Resource Groups. Minimum permissions To run this command, you must have the following permissions: resource-groups:CreateGroup'
      operationId: amazonWebServicesCreateGroup
      tags:
      - Groups
  /api/v1/groups:
    GET:
      summary: Amazon Web Services Describegroups
      description: Describes the groups specified by the query. Groups are defined by the underlying Active Directory.
      operationId: amazonWebServicesDescribeGroups
      tags:
      - Groups
  /Groups:
    POST:
      summary: Amazon Web Services Getgroups
      description: Retrieves all active group details.
      operationId: amazonWebServicesGetGroups
      tags:
      - Groups
