openapi: 3.2.0
info:
  title: Amazon Web Services AWS S3 Public Access Block API
  description: 'The API for Amazon Simple Storage Service (Amazon S3) provides an object

    storage solution with top-notch scalability, data availability, security,

    and performance. It caters to customers of varying sizes and industries,

    offering the ability to store and secure any volume of data for a wide

    range of purposes, including data lakes, cloud-native applications, and

    mobile apps.'
tags:
- name: Public Access Block
paths:
  /{Bucket}?publicAccessBlock:
    PUT:
      summary: Amazon Web Services Put Public Access Block
      description: This operation is not supported by directory buckets Creates or modifies the PublicAccessBlock configuration for an Amazon S3 bucket
      tags:
      - Public Access Block
      operationId: putPublicAccessBlock
