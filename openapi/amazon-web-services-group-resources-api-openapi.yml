openapi: 3.2.0
info:
  title: Amazon Web Services resource-groups Group Resources API
  description: Resource Groups lets you organize Amazon Web Services resources such as Amazon Elastic Compute Cloud instances, Amazon Relational Database Service databases, and Amazon Simple Storage Service buckets into groups using criteria that you define as tags.
tags:
- name: Group Resources
paths:
  /group-resources:
    POST:
      summary: Amazon Web Services Groupresources
      description: 'Adds the specified resources to the specified group. You can use this operation with only resource groups that are configured with the following types: AWS::EC2::HostManagement AWS::EC2::CapacityReservationPool Other resource group type and resource types aren''t currently supported by this operation. Minimum permissions To run this command, you must have the following permissions: resource-groups:GroupResources'
      operationId: amazonWebServicesGroupResources
      tags:
      - Group Resources
