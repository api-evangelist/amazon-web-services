openapi: 3.2.0
info:
  title: Amazon Web Services auditmanager Controls API
  description: Welcome to the Audit Manager API reference.
tags:
- name: Controls
paths:
  /controls:
    GET:
      summary: Amazon Web Services Listcontrols
      description: Returns a list of controls from Audit Manager.
      operationId: amazonWebServicesListControls
      tags:
      - Controls
  /controls/{controlId}:
    PUT:
      summary: Amazon Web Services Updatecontrol
      description: Updates a custom control in Audit Manager.
      operationId: amazonWebServicesUpdateControl
      tags:
      - Controls
