openapi: 3.2.0
info:
  title: Amazon Web Services vpc-lattice Servicenetworks API
  description: Amazon VPC Lattice is a fully managed application networking service that you use to connect, secure, and monitor all of your services across multiple accounts and virtual private clouds (VPCs). Amazon VPC Lattice interconnects your microservices and legacy services within a logical boundary, so that you can discover and manage them more efficiently. For more information, see the Amazon VPC Lattice User Guide
tags:
- name: Service Networks
paths:
  /servicenetworks:
    GET:
      summary: Amazon Web Services Listservicenetworks
      description: Lists the service networks owned by the caller account or shared with the caller account. Also includes the account ID in the ARN to show which account owns the service network.
      operationId: amazonWebServicesListServiceNetworks
      tags:
      - Service Networks
  /servicenetworks/{serviceNetworkIdentifier}:
    PATCH:
      summary: Amazon Web Services Updateservicenetwork
      description: Updates the specified service network.
      operationId: amazonWebServicesUpdateServiceNetwork
      tags:
      - Service Networks
