openapi: 3.2.0
info:
  title: Amazon Web Services controltower Enable Baseline API
  description: These interfaces allow you to apply the Amazon Web Services library of pre-defined controls to your organizational units, programmatically.
tags:
- name: Enable Baseline
paths:
  /enable-baseline:
    POST:
      summary: Amazon Web Services Enablebaseline
      description: Enable (apply) a Baseline to a Target. This API starts an asynchronous operation to deploy resources specified by the Baseline to the specified Target.
      operationId: amazonWebServicesEnableBaseline
      tags:
      - Enable Baseline
