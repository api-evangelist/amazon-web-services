openapi: 3.2.0
info:
  title: Amazon Web Services AWS S3 Restore Object. API
  description: 'The API for Amazon Simple Storage Service (Amazon S3) provides an object

    storage solution with top-notch scalability, data availability, security,

    and performance. It caters to customers of varying sizes and industries,

    offering the ability to store and secure any volume of data for a wide

    range of purposes, including data lakes, cloud-native applications, and

    mobile apps.'
tags:
- name: Restore Object.
paths:
  /{Bucket}/{Key+}?restore:
    POST:
      summary: Amazon Web Services Restore Object
      description: This operation is not supported by directory buckets Restores an archived copy of an object back into Amazon S3 This functionality is not supported for Amazon S3 on Outposts
      tags:
      - Restore Object.
      operationId: restoreObject
