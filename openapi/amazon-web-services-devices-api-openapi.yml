openapi: 3.2.0
info:
  title: Amazon Web Services Devices API
  version: '1.0'
  description: 'Operations tagged Devices across 4 of this provider''s published API definitions: braket-openapi-original.yml, iot1click-devices-openapi-original.yml, panorama-openapi-original.yml, workspaces-thin-client-openapi-original.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Devices
paths:
  /devices:
    POST:
      summary: Amazon Web Services Searchdevices
      description: Searches for devices using the specified filters.
      operationId: amazonWebServicesSearchDevices
      tags:
      - Devices
    GET:
      summary: Amazon Web Services Listdevices
      description: Lists the 1-Click compatible devices associated with your AWS account.
      operationId: amazonWebServicesListDevices
      tags:
      - Devices
  /devices/{deviceId}:
    GET:
      summary: Amazon Web Services Describedevice
      description: 'Given a device ID, returns a DescribeDeviceResponse object describing the

        details of the device.'
      operationId: amazonWebServicesDescribeDevice
      tags:
      - Devices
  /devices/{deviceId}/finalize-claim:
    PUT:
      summary: Amazon Web Services Finalizedeviceclaim
      description: 'Given a device ID, finalizes the claim request for the associated device.

        Claiming a device consists of initiating a claim, then publishing a device event,

        and finalizing the claim. For a device of type button, a device event can

        be published by simply clicking the device.'
      operationId: amazonWebServicesFinalizeDeviceClaim
      tags:
      - Devices
  /devices/{deviceId}/methods:
    POST:
      summary: Amazon Web Services Invokedevicemethod
      description: 'Given a device ID, issues a request to invoke a named device method (with possible

        parameters). See the "Example POST" code snippet below.'
      operationId: amazonWebServicesInvokeDeviceMethod
      tags:
      - Devices
  /devices/{deviceId}/initiate-claim:
    PUT:
      summary: Amazon Web Services Initiatedeviceclaim
      description: 'Given a device ID, initiates a claim request for the associated device.

        Claiming a device consists of initiating a claim, then publishing a device event,

        and finalizing the claim. For a device of type button, a device event can

        be published by simply clicking the device.'
      operationId: amazonWebServicesInitiateDeviceClaim
      tags:
      - Devices
  /devices/{deviceId}/events:
    GET:
      summary: Amazon Web Services Listdeviceevents
      description: 'Using a device ID, returns a DeviceEventsResponse object containing an

        array of events for the device.'
      operationId: amazonWebServicesListDeviceEvents
      tags:
      - Devices
  /devices/{deviceId}/unclaim:
    PUT:
      summary: Amazon Web Services Unclaimdevice
      description: Disassociates a device from your AWS account using its device ID.
      operationId: amazonWebServicesUnclaimDevice
      tags:
      - Devices
  /devices/{deviceId}/state:
    PUT:
      summary: Amazon Web Services Updatedevicestate
      description: 'Using a Boolean value (true or false), this operation

        enables or disables the device given a device ID.'
      operationId: amazonWebServicesUpdateDeviceState
      tags:
      - Devices
  /devices/{DeviceId}:
    PUT:
      summary: Amazon Web Services Updatedevicemetadata
      description: Updates a device's metadata.
      operationId: amazonWebServicesUpdateDeviceMetadata
      tags:
      - Devices
  /devices/{id}:
    PATCH:
      summary: Amazon Web Services Updatedevice
      description: Updates a thin client device.
      operationId: amazonWebServicesUpdateDevice
      tags:
      - Devices
x-refined-from:
