openapi: 3.2.0
info:
  title: Amazon Web Services rolesanywhere Crls API
  description: Identity and Access Management Roles Anywhere provides a secure way for your workloads such as servers, containers, and applications that run outside of Amazon Web Services to obtain temporary Amazon Web Services credentials.
tags:
- name: Crls
paths:
  /crls:
    GET:
      summary: Amazon Web Services Listcrls
      description: 'Lists all certificate revocation lists (CRL) in the authenticated account and Amazon Web Services Region. Required permissions: rolesanywhere:ListCrls.'
      operationId: amazonWebServicesListCrls
      tags:
      - Crls
