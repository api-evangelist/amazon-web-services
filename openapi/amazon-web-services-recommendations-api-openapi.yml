openapi: 3.2.0
info:
  title: Amazon Web Services Recommendations API
  version: '1.0'
  description: 'Operations tagged Recommendations across 3 of this provider''s published API definitions: devops-guru-openapi-original.yml, personalize-runtime-openapi-original.yml, trustedadvisor-openapi-original.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Recommendations
paths:
  /recommendations:
    POST:
      summary: Amazon Web Services Listrecommendations
      description: Returns a list of a specified insight's recommendations. Each recommendation includes a list of related metrics and a list of related events.
      operationId: amazonWebServicesListRecommendations
      tags:
      - Recommendations
  /v1/recommendations/{recommendationIdentifier}:
    GET:
      summary: Amazon Web Services Getrecommendation
      description: Get a specific Recommendation
      operationId: amazonWebServicesGetRecommendation
      tags:
      - Recommendations
  /v1/recommendations/{recommendationIdentifier}/resources:
    GET:
      summary: Amazon Web Services Listrecommendationresources
      description: List Resources of a Recommendation
      operationId: amazonWebServicesListRecommendationResources
      tags:
      - Recommendations
  /v1/recommendations:
    GET:
      summary: Amazon Web Services Listrecommendations
      description: List a filterable set of Recommendations
      operationId: amazonWebServicesListRecommendations
      tags:
      - Recommendations
  /v1/recommendations/{recommendationIdentifier}/lifecycle:
    PUT:
      summary: Amazon Web Services Updaterecommendationlifecycle
      description: Update the lifecyle of a Recommendation. This API only supports prioritized recommendations.
      operationId: amazonWebServicesUpdateRecommendationLifecycle
      tags:
      - Recommendations
