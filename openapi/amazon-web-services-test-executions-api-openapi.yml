openapi: 3.2.0
info:
  title: Amazon Web Services models.lex.v2 Testexecutions API
  description: ''
tags:
- name: Test Executions
paths:
  /testexecutions/{testExecutionId}:
    GET:
      summary: Amazon Web Services Describetestexecution
      description: Gets metadata information about the test execution.
      operationId: amazonWebServicesDescribeTestExecution
      tags:
      - Test Executions
  /testexecutions/{testExecutionId}/artifacturl:
    GET:
      summary: Amazon Web Services Gettestexecutionartifactsurl
      description: The pre-signed Amazon S3 URL to download the test execution result artifacts.
      operationId: amazonWebServicesGetTestExecutionArtifactsUrl
      tags:
      - Test Executions
  /testexecutions/{testExecutionId}/results:
    POST:
      summary: Amazon Web Services Listtestexecutionresultitems
      description: Gets a list of test execution result items.
      operationId: amazonWebServicesListTestExecutionResultItems
      tags:
      - Test Executions
  /testexecutions:
    POST:
      summary: Amazon Web Services Listtestexecutions
      description: The list of test set executions.
      operationId: amazonWebServicesListTestExecutions
      tags:
      - Test Executions
