openapi: 3.2.0
info:
  title: Amazon Web Services iot Metric Values API
  description: 'IoT

    IoT provides secure, bi-directional communication between Internet-connected devices (such as sensors, actuators, embedded devices, or smart appliances) and the Amazon Web Services cloud.'
tags:
- name: Metric Values
paths:
  /metric-values:
    GET:
      summary: Amazon Web Services Listmetricvalues
      description: Lists the values reported for an IoT Device Defender metric (device-side metric, cloud-side metric, or custom metric) by the given thing during the specified time period.
      operationId: amazonWebServicesListMetricValues
      tags:
      - Metric Values
