openapi: 3.2.0
info:
  title: Amazon Web Services lambda 2019 09 30 API
  description: 'Lambda

    Overview


    Lambda is a compute service that lets you run code without provisioning or managing servers.'
tags:
- name: 2019 09 30
paths:
  /2019-09-30/functions/{FunctionName}/provisioned-concurrency:
    PUT:
      summary: Amazon Web Services Putprovisionedconcurrencyconfig
      description: Adds a provisioned concurrency configuration to a function's alias or version.
      operationId: amazonWebServicesPutProvisionedConcurrencyConfig
      tags:
      - 2019 09 30
  /2019-09-30/functions/{FunctionName}/concurrency:
    GET:
      summary: Amazon Web Services Getfunctionconcurrency
      description: Returns details about the reserved concurrency configuration for a function. To set a concurrency limit for a function, use PutFunctionConcurrency.
      operationId: amazonWebServicesGetFunctionConcurrency
      tags:
      - 2019 09 30
  /2019-09-30/functions/{FunctionName}/provisioned-concurrency?List=ALL:
    GET:
      summary: Amazon Web Services Listprovisionedconcurrencyconfigs
      description: Retrieves a list of provisioned concurrency configurations for a function.
      operationId: amazonWebServicesListProvisionedConcurrencyConfigs
      tags:
      - 2019 09 30
