openapi: 3.2.0
info:
  title: Amazon Web Services simspaceweaver Stopapp API
  description: SimSpace Weaver (SimSpace Weaver) is a service that you can use to build and run large-scale spatial simulations in the Amazon Web Services Cloud.
tags:
- name: Stopapp
paths:
  /stopapp:
    POST:
      summary: Amazon Web Services Stopapp
      description: Stops the given custom app and shuts down all of its allocated compute resources.
      operationId: amazonWebServicesStopApp
      tags:
      - Stopapp
