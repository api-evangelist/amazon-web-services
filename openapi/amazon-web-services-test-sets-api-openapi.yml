openapi: 3.2.0
info:
  title: Amazon Web Services models.lex.v2 Testsets API
  description: ''
tags:
- name: Test Sets
paths:
  /testsets/{testSetId}/testsetdiscrepancy:
    POST:
      summary: Amazon Web Services Createtestsetdiscrepancyreport
      description: Create a report that describes the differences between the bot and the test set.
      operationId: amazonWebServicesCreateTestSetDiscrepancyReport
      tags:
      - Test Sets
  /testsets/{testSetId}:
    PUT:
      summary: Amazon Web Services Updatetestset
      description: The action to update the test set.
      operationId: amazonWebServicesUpdateTestSet
      tags:
      - Test Sets
  /testsets/{testSetId}/records:
    POST:
      summary: Amazon Web Services Listtestsetrecords
      description: The list of test set records.
      operationId: amazonWebServicesListTestSetRecords
      tags:
      - Test Sets
  /testsets:
    POST:
      summary: Amazon Web Services Listtestsets
      description: The list of the test sets
      operationId: amazonWebServicesListTestSets
      tags:
      - Test Sets
  /testsets/{testSetId}/testexecutions:
    POST:
      summary: Amazon Web Services Starttestexecution
      description: The action to start test set execution.
      operationId: amazonWebServicesStartTestExecution
      tags:
      - Test Sets
