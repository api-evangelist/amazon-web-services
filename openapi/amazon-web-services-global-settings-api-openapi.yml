info:
  title: Amazon Web Services Global Settings API
  version: '1.0'
  description: 'Operations tagged Global Settings across 2 of this provider''s published API definitions: backup-openapi-original.yml, wellarchitected-openapi-original.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Global Settings
paths:
  /global-settings:
    PUT:
      summary: Amazon Web Services Updateglobalsettings
      description: Updates whether the Amazon Web Services account is opted in to cross-account backup. Returns an error if the account is not an Organizations management account. Use the DescribeGlobalSettings API to determine the current settings.
      operationId: amazonWebServicesUpdateGlobalSettings
      tags:
      - Global Settings
    PATCH:
      summary: Amazon Web Services Updateglobalsettings
      description: Updates whether the Amazon Web Services account is opted into organization sharing and discovery integration features.
      operationId: amazonWebServicesUpdateGlobalSettings
      tags:
      - Global Settings
