openapi: 3.2.0
info:
  title: Amazon Web Services evidently Segments API
  description: You can use Amazon CloudWatch Evidently to safely validate new features by serving them to a specified percentage of your users while you roll out the feature.
tags:
- name: Segments
paths:
  /segments:
    GET:
      summary: Amazon Web Services Listsegments
      description: Returns a list of audience segments that you have created in your account in this Region.
      operationId: amazonWebServicesListSegments
      tags:
      - Segments
  /segments/{segment}:
    GET:
      summary: Amazon Web Services Getsegment
      description: Returns information about the specified segment. Specify the segment you want to view by specifying its ARN.
      operationId: amazonWebServicesGetSegment
      tags:
      - Segments
  /segments/{segment}/references:
    GET:
      summary: Amazon Web Services Listsegmentreferences
      description: Use this operation to find which experiments or launches are using a specified segment.
      operationId: amazonWebServicesListSegmentReferences
      tags:
      - Segments
