openapi: 3.2.0
info:
  title: Amazon Web Services appconfigdata Configurationsessions API
  description: AppConfig Data provides the data plane APIs your application uses to retrieve configuration data.
tags:
- name: Configurationsessions
paths:
  /configurationsessions:
    POST:
      summary: Amazon Web Services Startconfigurationsession
      description: Starts a configuration session used to retrieve a deployed configuration. For more information about this API action and to view example CLI commands that show how to use it with the GetLatestConfiguration API action, see Retrieving the configuration in the AppConfig User Guide.
      operationId: amazonWebServicesStartConfigurationSession
      tags:
      - Configurationsessions
