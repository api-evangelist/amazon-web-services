info:
  title: Amazon Web Services Imports API
  version: '1.0'
  description: 'Operations tagged Imports across 2 of this provider''s published API definitions: lex-models-openapi-original.yml, modelslexv2-openapi-original.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Imports
paths:
  /imports/{importId}:
    GET:
      summary: Amazon Web Services Getimport
      description: Gets information about an import job started with the StartImport operation.
      operationId: amazonWebServicesGetImport
      tags:
      - Imports
  /imports/:
    POST:
      summary: Amazon Web Services Startimport
      description: Starts a job to import a resource to Amazon Lex.
      operationId: amazonWebServicesStartImport
      tags:
      - Imports
    PUT:
      summary: Amazon Web Services Startimport
      description: Starts importing a bot, bot locale, or custom vocabulary from a zip archive that you uploaded to an S3 bucket.
      operationId: amazonWebServicesStartImport
      tags:
      - Imports
  /imports/{importId}/:
    GET:
      summary: Amazon Web Services Describeimport
      description: Gets information about a specific import.
      operationId: amazonWebServicesDescribeImport
      tags:
      - Imports
