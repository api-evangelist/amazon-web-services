openapi: 3.2.0
info:
  title: Amazon Web Services resource-groups Ungroup Resources API
  description: Resource Groups lets you organize Amazon Web Services resources such as Amazon Elastic Compute Cloud instances, Amazon Relational Database Service databases, and Amazon Simple Storage Service buckets into groups using criteria that you define as tags.
tags:
- name: Ungroup Resources
paths:
  /ungroup-resources:
    POST:
      summary: Amazon Web Services Ungroupresources
      description: 'Removes the specified resources from the specified group. This operation works only with static groups that you populated using the GroupResources operation. It doesn''t work with any resource groups that are automatically populated by tag-based or CloudFormation stack-based queries. Minimum permissions To run this command, you must have the following permissions: resource-groups:UngroupResources'
      operationId: amazonWebServicesUngroupResources
      tags:
      - Ungroup Resources
