openapi: 3.2.0
info:
  title: Amazon Web Services snow-device-management Managed Device…
  description: Amazon Web Services Snow Device Management documentation.
tags:
- name: Managed Device
paths:
  /managed-device/{managedDeviceId}/describe:
    POST:
      summary: Amazon Web Services Describedevice
      description: Checks device-specific information, such as the device type, software version, IP addresses, and lock status.
      operationId: amazonWebServicesDescribeDevice
      tags:
      - Managed Device
  /managed-device/{managedDeviceId}/resources/ec2/describe:
    POST:
      summary: Amazon Web Services Describedeviceec2instances
      description: Checks the current state of the Amazon EC2 instances. The output is similar to describeDevice, but the results are sourced from the device cache in the Amazon Web Services Cloud and include a subset of the available fields.
      operationId: amazonWebServicesDescribeDeviceEc2Instances
      tags:
      - Managed Device
  /managed-device/{managedDeviceId}/resources:
    GET:
      summary: Amazon Web Services Listdeviceresources
      description: Returns a list of the Amazon Web Services resources available for a device. Currently, Amazon EC2 instances are the only supported resource type.
      operationId: amazonWebServicesListDeviceResources
      tags:
      - Managed Device
