openapi: 3.2.0
info:
  title: Amazon Web Services appsync Source APIS API
  description: AppSync provides API actions for creating and interacting with data sources using GraphQL from your application.
tags:
- name: sourceApis
paths:
  /v1/sourceApis/{sourceApiIdentifier}/mergedApiAssociations:
    POST:
      summary: Amazon Web Services Associatemergedgraphqlapi
      description: Creates an association between a Merged API and source API using the source API's identifier.
      operationId: amazonWebServicesAssociateMergedGraphqlApi
      tags:
      - sourceApis
  /v1/sourceApis/{sourceApiIdentifier}/mergedApiAssociations/{associationId}:
    DELETE:
      summary: Amazon Web Services Disassociatemergedgraphqlapi
      description: Deletes an association between a Merged API and source API using the source API's identifier and the association ID.
      operationId: amazonWebServicesDisassociateMergedGraphqlApi
      tags:
      - sourceApis
