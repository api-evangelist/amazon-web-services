openapi: 3.2.0
info:
  title: Amazon Web Services iot Certificate Providers API
  description: 'IoT

    IoT provides secure, bi-directional communication between Internet-connected devices (such as sensors, actuators, embedded devices, or smart appliances) and the Amazon Web Services cloud.'
tags:
- name: Certificate Providers
paths:
  /certificate-providers/{certificateProviderName}:
    PUT:
      summary: Amazon Web Services Updatecertificateprovider
      description: Updates a certificate provider. Requires permission to access the UpdateCertificateProvider action.
      operationId: amazonWebServicesUpdateCertificateProvider
      tags:
      - Certificate Providers
  /certificate-providers/:
    GET:
      summary: Amazon Web Services Listcertificateproviders
      description: Lists all your certificate providers in your Amazon Web Services account. Requires permission to access the ListCertificateProviders action.
      operationId: amazonWebServicesListCertificateProviders
      tags:
      - Certificate Providers
