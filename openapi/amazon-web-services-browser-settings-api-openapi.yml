openapi: 3.2.0
info:
  title: Amazon Web Services workspaces-web Browser Settings API
  description: WorkSpaces Web is a low cost, fully managed WorkSpace built specifically to facilitate secure, web-based workloads.
tags:
- name: Browser Settings
paths:
  /browserSettings:
    GET:
      summary: Amazon Web Services Listbrowsersettings
      description: Retrieves a list of browser settings.
      operationId: amazonWebServicesListBrowserSettings
      tags:
      - Browser Settings
  /browserSettings/{browserSettingsArn+}:
    PATCH:
      summary: Amazon Web Services Updatebrowsersettings
      description: Updates browser settings.
      operationId: amazonWebServicesUpdateBrowserSettings
      tags:
      - Browser Settings
