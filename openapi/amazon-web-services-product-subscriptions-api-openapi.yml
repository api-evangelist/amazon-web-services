openapi: 3.2.0
info:
  title: Amazon Web Services securityhub Product Subscriptions API
  description: Security Hub provides you with a comprehensive view of your security state in Amazon Web Services and helps you assess your Amazon Web Services environment against security industry standards and best practices.
tags:
- name: Product Subscriptions
paths:
  /productSubscriptions/{ProductSubscriptionArn+}:
    DELETE:
      summary: Amazon Web Services Disableimportfindingsforproduct
      description: Disables the integration of the specified product with Security Hub. After the integration is disabled, findings from that product are no longer sent to Security Hub.
      operationId: amazonWebServicesDisableImportFindingsForProduct
      tags:
      - Product Subscriptions
  /productSubscriptions:
    GET:
      summary: Amazon Web Services Listenabledproductsforimport
      description: Lists all findings-generating solutions (products) that you are subscribed to receive findings from in Security Hub.
      operationId: amazonWebServicesListEnabledProductsForImport
      tags:
      - Product Subscriptions
