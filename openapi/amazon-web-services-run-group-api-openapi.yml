openapi: 3.2.0
info:
  title: Amazon Web Services omics Run Group API
  description: This is the AWS HealthOmics API Reference. For an introduction to the service, see What is AWS HealthOmics? in the AWS HealthOmics User Guide.
tags:
- name: Run Group
paths:
  /runGroup:
    GET:
      summary: Amazon Web Services Listrungroups
      description: Retrieves a list of run groups.
      operationId: amazonWebServicesListRunGroups
      tags:
      - Run Group
  /runGroup/{id}:
    POST:
      summary: Amazon Web Services Updaterungroup
      description: Updates a run group.
      operationId: amazonWebServicesUpdateRunGroup
      tags:
      - Run Group
