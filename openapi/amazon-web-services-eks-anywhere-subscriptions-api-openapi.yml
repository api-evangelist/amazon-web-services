openapi: 3.2.0
info:
  title: Amazon Web Services eks Eks Anywhere Subscriptions API
  description: Amazon Elastic Kubernetes Service (Amazon EKS) is a managed service that makes it easy for you to run Kubernetes on Amazon Web Services without needing to setup or maintain your own Kubernetes control plane.
tags:
- name: Eks Anywhere Subscriptions
paths:
  /eks-anywhere-subscriptions:
    GET:
      summary: Amazon Web Services Listeksanywheresubscriptions
      description: Displays the full description of the subscription.
      operationId: amazonWebServicesListEksAnywhereSubscriptions
      tags:
      - Eks Anywhere Subscriptions
  /eks-anywhere-subscriptions/{id}:
    POST:
      summary: Amazon Web Services Updateeksanywheresubscription
      description: Update an EKS Anywhere Subscription. Only auto renewal and tags can be updated after subscription creation.
      operationId: amazonWebServicesUpdateEksAnywhereSubscription
      tags:
      - Eks Anywhere Subscriptions
