openapi: 3.2.0
info:
  title: Amazon Web Services applicationcostprofiler Import…
  description: 'This reference provides descriptions of the AWS Application Cost Profiler API.


    The AWS Application Cost Profiler API provides programmatic access to view, create, update, and delete application cost report definitions, as well as to import your usage data into the Application Cost Profiler service.


    For more information about using this service, see the AWS Application Cost Profiler User Guide.'
tags:
- name: importApplicationUsage
paths:
  /importApplicationUsage:
    POST:
      summary: Amazon Web Services Importapplicationusage
      description: Ingests application usage data from Amazon Simple Storage Service (Amazon S3). The data must already exist in the S3 location. As part of the action, AWS Application Cost Profiler copies the object from your S3 bucket to an S3 bucket owned by Amazon for processing asynchronously.
      operationId: amazonWebServicesImportApplicationUsage
      tags:
      - importApplicationUsage
