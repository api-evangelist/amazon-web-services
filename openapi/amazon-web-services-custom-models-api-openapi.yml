openapi: 3.2.0
info:
  title: Amazon Web Services bedrock Custom Models API
  description: Describes the API operations for creating and managing Amazon Bedrock models.
tags:
- name: Custom Models
paths:
  /custom-models/{modelIdentifier}:
    GET:
      summary: Amazon Web Services Getcustommodel
      description: Get the properties associated with a Amazon Bedrock custom model that you have created.For more information, see Custom models in the Bedrock User Guide.
      operationId: amazonWebServicesGetCustomModel
      tags:
      - Custom Models
  /custom-models:
    GET:
      summary: Amazon Web Services Listcustommodels
      description: Returns a list of the custom models that you have created with the CreateModelCustomizationJob operation. For more information, see Custom models in the Bedrock User Guide.
      operationId: amazonWebServicesListCustomModels
      tags:
      - Custom Models
