openapi: 3.2.0
info:
  title: Amazon Web Services kafka Vpc Connection API
  description: The operations for managing an Amazon MSK cluster.
tags:
- name: Vpc Connection
paths:
  /v1/vpc-connection:
    POST:
      summary: Amazon Web Services Createvpcconnection
      description: Creates a new Amazon MSK VPC connection.
      operationId: amazonWebServicesCreateVpcConnection
      tags:
      - Vpc Connection
  /v1/vpc-connection/{arn}:
    GET:
      summary: Amazon Web Services Describevpcconnection
      description: Displays information about the specified Amazon MSK VPC connection.
      operationId: amazonWebServicesDescribeVpcConnection
      tags:
      - Vpc Connection
