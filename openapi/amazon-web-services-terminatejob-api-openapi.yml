openapi: 3.2.0
info:
  title: Amazon Web Services batch Terminatejob API
  description: 'Batch

    Using Batch, you can run batch computing workloads on the Amazon Web Services Cloud.'
tags:
- name: Terminatejob
paths:
  /v1/terminatejob:
    POST:
      summary: Amazon Web Services Terminatejob
      description: Terminates a job in a job queue. Jobs that are in the STARTING or RUNNING state are terminated, which causes them to transition to FAILED. Jobs that have not progressed to the STARTING state are cancelled.
      operationId: amazonWebServicesTerminateJob
      tags:
      - Terminatejob
