openapi: 3.2.0
info:
  title: Amazon Web Services omics Variant Store API
  description: This is the AWS HealthOmics API Reference. For an introduction to the service, see What is AWS HealthOmics? in the AWS HealthOmics User Guide.
tags:
- name: Variant Store
paths:
  /variantStore:
    POST:
      summary: Amazon Web Services Createvariantstore
      description: Creates a variant store.
      operationId: amazonWebServicesCreateVariantStore
      tags:
      - Variant Store
  /variantStore/{name}:
    POST:
      summary: Amazon Web Services Updatevariantstore
      description: Updates a variant store.
      operationId: amazonWebServicesUpdateVariantStore
      tags:
      - Variant Store
