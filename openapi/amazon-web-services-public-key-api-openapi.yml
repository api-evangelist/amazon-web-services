openapi: 3.2.0
info:
  title: Amazon Web Services cloudfront Public Key API
  description: 'Amazon CloudFront

    This is the Amazon CloudFront API Reference. This guide is for developers who need detailed information about CloudFront API actions, data types, and errors. For detailed information about CloudFront features, see the Amazon CloudFront Developer Guide.'
tags:
- name: Public Key
paths:
  /2020-05-31/public-key:
    GET:
      summary: Amazon Web Services Listpublickeys
      description: List all public keys that have been added to CloudFront for this account.
      operationId: amazonWebServicesListPublicKeys
      tags:
      - Public Key
  /2020-05-31/public-key/{Id}:
    GET:
      summary: Amazon Web Services Getpublickey
      description: Gets a public key.
      operationId: amazonWebServicesGetPublicKey
      tags:
      - Public Key
  /2020-05-31/public-key/{Id}/config:
    PUT:
      summary: Amazon Web Services Updatepublickey
      description: Update public key information. Note that the only value you can change is the comment.
      operationId: amazonWebServicesUpdatePublicKey
      tags:
      - Public Key
