openapi: 3.2.0
info:
  title: Amazon Web Services trustedadvisor Organization…
  description: TrustedAdvisor Public API
tags:
- name: Organization Recommendations
paths:
  /v1/organization-recommendations/{organizationRecommendationIdentifier}:
    GET:
      summary: Amazon Web Services Getorganizationrecommendation
      description: Get a specific recommendation within an AWS Organizations organization. This API supports only prioritized recommendations.
      operationId: amazonWebServicesGetOrganizationRecommendation
      tags:
      - Organization Recommendations
  /v1/organization-recommendations/{organizationRecommendationIdentifier}/accounts:
    GET:
      summary: Amazon Web Services Listorganizationrecommendationaccounts
      description: Lists the accounts that own the resources for an organization aggregate recommendation. This API only supports prioritized recommendations.
      operationId: amazonWebServicesListOrganizationRecommendationAccounts
      tags:
      - Organization Recommendations
  /v1/organization-recommendations/{organizationRecommendationIdentifier}/resources:
    GET:
      summary: Amazon Web Services Listorganizationrecommendationresources
      description: List Resources of a Recommendation within an Organization. This API only supports prioritized recommendations.
      operationId: amazonWebServicesListOrganizationRecommendationResources
      tags:
      - Organization Recommendations
  /v1/organization-recommendations:
    GET:
      summary: Amazon Web Services Listorganizationrecommendations
      description: List a filterable set of Recommendations within an Organization. This API only supports prioritized recommendations.
      operationId: amazonWebServicesListOrganizationRecommendations
      tags:
      - Organization Recommendations
  /v1/organization-recommendations/{organizationRecommendationIdentifier}/lifecycle:
    PUT:
      summary: Amazon Web Services Updateorganizationrecommendationlifecycle
      description: Update the lifecyle of a Recommendation within an Organization. This API only supports prioritized recommendations.
      operationId: amazonWebServicesUpdateOrganizationRecommendationLifecycle
      tags:
      - Organization Recommendations
