openapi: 3.2.0
info:
  title: Amazon Web Services iot Dynamic Thing Groups API
  description: 'IoT

    IoT provides secure, bi-directional communication between Internet-connected devices (such as sensors, actuators, embedded devices, or smart appliances) and the Amazon Web Services cloud.'
tags:
- name: Dynamic Thing Groups
paths:
  /dynamic-thing-groups/{thingGroupName}:
    PATCH:
      summary: Amazon Web Services Updatedynamicthinggroup
      description: Updates a dynamic thing group. Requires permission to access the UpdateDynamicThingGroup action.
      operationId: amazonWebServicesUpdateDynamicThingGroup
      tags:
      - Dynamic Thing Groups
