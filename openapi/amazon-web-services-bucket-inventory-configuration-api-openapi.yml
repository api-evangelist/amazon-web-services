openapi: 3.2.0
info:
  title: Amazon Web Services AWS S3 Bucket Inventory Configuration…
  description: 'The API for Amazon Simple Storage Service (Amazon S3) provides an object

    storage solution with top-notch scalability, data availability, security,

    and performance. It caters to customers of varying sizes and industries,

    offering the ability to store and secure any volume of data for a wide

    range of purposes, including data lakes, cloud-native applications, and

    mobile apps.'
tags:
- name: Bucket Inventory Configuration
paths:
  /{Bucket}?inventory:
    PUT:
      summary: Amazon Web Services Put Bucket Inventory Configuration
      description: This operation is not supported by directory buckets This implementation of the PUT action adds an inventory configuration (identified by the inventory ID) to the bucket
      tags:
      - Bucket Inventory Configuration
      operationId: putBucketInventoryConfiguration
