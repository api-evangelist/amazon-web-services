openapi: 3.2.0
info:
  title: Amazon Web Services resource-groups Update Account Settings…
  description: Resource Groups lets you organize Amazon Web Services resources such as Amazon Elastic Compute Cloud instances, Amazon Relational Database Service databases, and Amazon Simple Storage Service buckets into groups using criteria that you define as tags.
tags:
- name: Update Account Settings
paths:
  /update-account-settings:
    POST:
      summary: Amazon Web Services Updateaccountsettings
      description: Turns on or turns off optional features in Resource Groups. The preceding example shows that the request to turn on group lifecycle events is IN_PROGRESS. You can call the GetAccountSettings operation to check for completion by looking for GroupLifecycleEventsStatus to change to ACTIVE.
      operationId: amazonWebServicesUpdateAccountSettings
      tags:
      - Update Account Settings
