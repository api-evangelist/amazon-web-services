openapi: 3.2.0
info:
  title: Amazon Web Services rum Rummetrics API
  description: With Amazon CloudWatch RUM, you can perform real-user monitoring to collect client-side data about your web application performance from actual user sessions in real time.
tags:
- name: Rummetrics
paths:
  /rummetrics/{AppMonitorName}/metrics:
    PATCH:
      summary: Amazon Web Services Updaterummetricdefinition
      description: Modifies one existing metric definition for CloudWatch RUM extended metrics. For more information about extended metrics, see BatchCreateRumMetricsDefinitions.
      operationId: amazonWebServicesUpdateRumMetricDefinition
      tags:
      - Rummetrics
  /rummetrics/{AppMonitorName}/metricsdestination:
    POST:
      summary: Amazon Web Services Putrummetricsdestination
      description: Creates or updates a destination to receive extended metrics from CloudWatch RUM. You can send extended metrics to CloudWatch or to a CloudWatch Evidently experiment. For more information about extended metrics, see BatchCreateRumMetricDefinitions.
      operationId: amazonWebServicesPutRumMetricsDestination
      tags:
      - Rummetrics
