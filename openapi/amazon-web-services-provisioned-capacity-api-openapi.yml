openapi: 3.2.0
info:
  title: Amazon Web Services glacier Provisioned Capacity API
  description: 'Amazon S3 Glacier (Glacier) is a storage solution for "cold data."


    Glacier is an extremely low-cost storage service that provides secure, durable, and easy-to-use storage for data backup and archival.'
tags:
- name: Provisioned Capacity
paths:
  /{accountId}/provisioned-capacity:
    POST:
      summary: Amazon Web Services Purchaseprovisionedcapacity
      description: This operation purchases a provisioned capacity unit for an AWS account.
      operationId: amazonWebServicesPurchaseProvisionedCapacity
      tags:
      - Provisioned Capacity
