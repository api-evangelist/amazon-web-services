openapi: 3.2.0
info:
  title: Amazon Web Services mediapackage-vod Packaging Groups API
  description: AWS Elemental MediaPackage VOD
tags:
- name: Packaging Groups
paths:
  /packaging_groups/{id}/configure_logs:
    PUT:
      summary: Amazon Web Services Configurelogs
      description: Changes the packaging group's properities to configure log subscription
      operationId: amazonWebServicesConfigureLogs
      tags:
      - Packaging Groups
  /packaging_groups:
    GET:
      summary: Amazon Web Services Listpackaginggroups
      description: Returns a collection of MediaPackage VOD PackagingGroup resources.
      operationId: amazonWebServicesListPackagingGroups
      tags:
      - Packaging Groups
  /packaging_groups/{id}:
    PUT:
      summary: Amazon Web Services Updatepackaginggroup
      description: Updates a specific packaging group. You can't change the id attribute or any other system-generated attributes.
      operationId: amazonWebServicesUpdatePackagingGroup
      tags:
      - Packaging Groups
