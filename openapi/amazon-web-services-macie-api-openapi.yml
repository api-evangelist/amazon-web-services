openapi: 3.2.0
info:
  title: Amazon Web Services macie2 Macie API
  description: Amazon Macie is a fully managed data security and data privacy service that uses machine learning and pattern matching to help you discover and protect your sensitive data in AWS.
tags:
- name: Macie
paths:
  /macie:
    PATCH:
      summary: Amazon Web Services Updatemaciesession
      description: Suspends or re-enables Amazon Macie, or updates the configuration settings for a Macie account.
      operationId: amazonWebServicesUpdateMacieSession
      tags:
      - Macie
  /macie/members/{id}:
    PATCH:
      summary: Amazon Web Services Updatemembersession
      description: Enables an Amazon Macie administrator to suspend or re-enable Macie for a member account.
      operationId: amazonWebServicesUpdateMemberSession
      tags:
      - Macie
