openapi: 3.2.0
info:
  title: Amazon Web Services codeartifact Repositories API
  description: CodeArtifact is a fully managed artifact repository compatible with language-native package managers and build tools such as npm, Apache Maven, pip, and dotnet.
tags:
- name: Repositories
paths:
  /v1/repositories:
    POST:
      summary: Amazon Web Services Listrepositories
      description: Returns a list of RepositorySummary objects. Each RepositorySummary contains information about a repository in the specified Amazon Web Services account and that matches the input parameters.
      operationId: amazonWebServicesListRepositories
      tags:
      - Repositories
