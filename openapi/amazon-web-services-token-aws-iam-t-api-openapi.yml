openapi: 3.2.0
info:
  title: Amazon Web Services sso-oidc Token?aws Iam=t API
  description: IAM Identity Center OpenID Connect (OIDC) is a web service that enables a client (such as CLI or a native application) to register with IAM Identity Center.
tags:
- name: Token?aws Iam=t
paths:
  /token?aws_iam=t:
    POST:
      summary: Amazon Web Services Createtokenwithiam
      description: Creates and returns access and refresh tokens for clients and applications that are authenticated using IAM entities. The access token can be used to fetch short-term credentials for the assigned AWS accounts or to access application APIs using bearer authentication.
      operationId: amazonWebServicesCreateTokenWithIAM
      tags:
      - Token?aws Iam=t
