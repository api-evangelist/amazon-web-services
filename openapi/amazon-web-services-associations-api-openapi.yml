  description: 'Operations tagged Associations across 2 of this provider''s published API definitions: codeguru-reviewer-openapi-original.yml, securityhub-openapi-original.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Associations
paths:
  /associations:
    GET:
      summary: Amazon Web Services Listrepositoryassociations
      description: Returns a list of RepositoryAssociationSummary objects that contain summary information about a repository association. You can filter the returned list by ProviderType, Name, State, and Owner.
      operationId: amazonWebServicesListRepositoryAssociations
      tags:
      - Associations
  /associations/{AssociationArn}:
    DELETE:
      summary: Amazon Web Services Disassociaterepository
      description: Removes the association between Amazon CodeGuru Reviewer and a repository.
      operationId: amazonWebServicesDisassociateRepository
      tags:
      - Associations
  /associations/batchGet:
    POST:
      summary: Amazon Web Services Batchgetstandardscontrolassociations
      description: For a batch of security controls and standards, identifies whether each control is currently enabled or disabled in a standard.
      operationId: amazonWebServicesBatchGetStandardsControlAssociations
      tags:
      - Associations
