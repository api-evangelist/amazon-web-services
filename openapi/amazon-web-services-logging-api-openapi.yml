info:
  title: Amazon Web Services Logging API
  version: '1.0'
  description: 'Operations tagged Logging across 4 of this provider''s published API definitions: bedrock-openapi-original.yml, iotanalytics-openapi-original.yml, iotevents-openapi-original.yml, iotsitewise-openapi-original.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Logging
paths:
  /logging/modelinvocations:
    PUT:
      summary: Amazon Web Services Putmodelinvocationloggingconfiguration
      description: Set the configuration values for model invocation logging.
      operationId: amazonWebServicesPutModelInvocationLoggingConfiguration
      tags:
      - Logging
  /logging:
    PUT:
      summary: Amazon Web Services Putloggingoptions
      description: Sets or updates the IoT Analytics logging options. If you update the value of any loggingOptions field, it takes up to one minute for the change to take effect. Also, if you change the policy attached to the role you specified in the roleArn field (for example, to correct an invalid policy), it takes up to five minutes for that change to take effect.
      operationId: amazonWebServicesPutLoggingOptions
      tags:
      - Logging
