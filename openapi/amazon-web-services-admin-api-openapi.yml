openapi: 3.2.0
info:
  title: Amazon Web Services Admin API
  version: '1.0'
  description: 'Operations tagged Admin across 2 of this provider''s published API definitions: guardduty-openapi-original.yml, macie2-openapi-original.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Admin
paths:
  /admin/disable:
    POST:
      summary: Amazon Web Services Disableorganizationadminaccount
      description: Removes the existing GuardDuty delegated administrator of the organization. Only the organization's management account can run this API operation.
      operationId: amazonWebServicesDisableOrganizationAdminAccount
      tags:
      - Admin
  /admin/enable:
    POST:
      summary: Amazon Web Services Enableorganizationadminaccount
      description: Designates an Amazon Web Services account within the organization as your GuardDuty delegated administrator. Only the organization's management account can run this API operation.
      operationId: amazonWebServicesEnableOrganizationAdminAccount
      tags:
      - Admin
  /admin:
    GET:
      summary: Amazon Web Services Listorganizationadminaccounts
      description: Lists the accounts designated as GuardDuty delegated administrators. Only the organization's management account can run this API operation.
      operationId: amazonWebServicesListOrganizationAdminAccounts
      tags:
      - Admin
  /admin/configuration:
    PATCH:
      summary: Amazon Web Services Updateorganizationconfiguration
      description: Updates the Amazon Macie configuration settings for an organization in Organizations.
      operationId: amazonWebServicesUpdateOrganizationConfiguration
      tags:
      - Admin
x-refined-from:
- guardduty-openapi-original.yml
- macie2-openapi-original.yml
