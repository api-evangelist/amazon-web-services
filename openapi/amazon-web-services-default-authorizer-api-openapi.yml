openapi: 3.2.0
info:
  title: Amazon Web Services iot Default Authorizer API
  description: 'IoT

    IoT provides secure, bi-directional communication between Internet-connected devices (such as sensors, actuators, embedded devices, or smart appliances) and the Amazon Web Services cloud.'
tags:
- name: Default Authorizer
paths:
  /default-authorizer:
    POST:
      summary: Amazon Web Services Setdefaultauthorizer
      description: Sets the default authorizer. This will be used if a websocket connection is made without specifying an authorizer. Requires permission to access the SetDefaultAuthorizer action.
      operationId: amazonWebServicesSetDefaultAuthorizer
      tags:
      - Default Authorizer
