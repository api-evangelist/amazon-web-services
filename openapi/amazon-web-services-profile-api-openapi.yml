openapi: 3.2.0
info:
  title: Amazon Web Services rolesanywhere Profile API
  description: Identity and Access Management Roles Anywhere provides a secure way for your workloads such as servers, containers, and applications that run outside of Amazon Web Services to obtain temporary Amazon Web Services credentials.
tags:
- name: Profile
paths:
  /profile/{profileId}:
    PATCH:
      summary: Amazon Web Services Updateprofile
      description: 'Updates a profile, a list of the roles that IAM Roles Anywhere service is trusted to assume. You use profiles to intersect permissions with IAM managed policies. Required permissions: rolesanywhere:UpdateProfile.'
      operationId: amazonWebServicesUpdateProfile
      tags:
      - Profile
  /profile/{profileId}/disable:
    POST:
      summary: Amazon Web Services Disableprofile
      description: 'Disables a profile. When disabled, temporary credential requests with this profile fail. Required permissions: rolesanywhere:DisableProfile.'
      operationId: amazonWebServicesDisableProfile
      tags:
      - Profile
  /profile/{profileId}/enable:
    POST:
      summary: Amazon Web Services Enableprofile
      description: 'Enables temporary credential requests for a profile. Required permissions: rolesanywhere:EnableProfile.'
      operationId: amazonWebServicesEnableProfile
      tags:
      - Profile
