openapi: 3.2.0
info:
  title: Amazon Web Services appsync Merged APIS API
  description: AppSync provides API actions for creating and interacting with data sources using GraphQL from your application.
tags:
- name: mergedApis
paths:
  /v1/mergedApis/{mergedApiIdentifier}/sourceApiAssociations:
    POST:
      summary: Amazon Web Services Associatesourcegraphqlapi
      description: Creates an association between a Merged API and source API using the Merged API's identifier.
      operationId: amazonWebServicesAssociateSourceGraphqlApi
      tags:
      - mergedApis
  /v1/mergedApis/{mergedApiIdentifier}/sourceApiAssociations/{associationId}:
    POST:
      summary: Amazon Web Services Updatesourceapiassociation
      description: Updates some of the configuration choices of a particular source API association.
      operationId: amazonWebServicesUpdateSourceApiAssociation
      tags:
      - mergedApis
  /v1/mergedApis/{mergedApiIdentifier}/sourceApiAssociations/{associationId}/types:
    GET:
      summary: Amazon Web Services Listtypesbyassociation
      description: Lists Type objects by the source API association ID.
      operationId: amazonWebServicesListTypesByAssociation
      tags:
      - mergedApis
  /v1/mergedApis/{mergedApiIdentifier}/sourceApiAssociations/{associationId}/merge:
    POST:
      summary: Amazon Web Services Startschemamerge
      description: Initiates a merge operation. Returns a status that shows the result of the merge operation.
      operationId: amazonWebServicesStartSchemaMerge
      tags:
      - mergedApis
