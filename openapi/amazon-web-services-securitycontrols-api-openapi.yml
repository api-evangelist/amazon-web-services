openapi: 3.2.0
info:
  title: Amazon Web Services securityhub Security Controls API
  description: Security Hub provides you with a comprehensive view of your security state in Amazon Web Services and helps you assess your Amazon Web Services environment against security industry standards and best practices.
tags:
- name: securityControls
paths:
  /securityControls/batchGet:
    POST:
      summary: Amazon Web Services Batchgetsecuritycontrols
      description: Provides details about a batch of security controls for the current Amazon Web Services account and Amazon Web Services Region.
      operationId: amazonWebServicesBatchGetSecurityControls
      tags:
      - securityControls
  /securityControls/definitions:
    GET:
      summary: Amazon Web Services Listsecuritycontroldefinitions
      description: Lists all of the security controls that apply to a specified standard.
      operationId: amazonWebServicesListSecurityControlDefinitions
      tags:
      - securityControls
