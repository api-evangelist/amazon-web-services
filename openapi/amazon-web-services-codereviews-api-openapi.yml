openapi: 3.2.0
info:
  title: Amazon Web Services codeguru-reviewer Codereviews API
  description: This section provides documentation for the Amazon CodeGuru Reviewer API operations.
tags:
- name: Codereviews
paths:
  /codereviews:
    GET:
      summary: Amazon Web Services Listcodereviews
      description: Lists all the code reviews that the customer has created in the past 90 days.
      operationId: amazonWebServicesListCodeReviews
      tags:
      - Codereviews
  /codereviews/{CodeReviewArn}:
    GET:
      summary: Amazon Web Services Describecodereview
      description: Returns the metadata associated with the code review along with its status.
      operationId: amazonWebServicesDescribeCodeReview
      tags:
      - Codereviews
  /codereviews/{CodeReviewArn}/Recommendations:
    GET:
      summary: Amazon Web Services Listrecommendations
      description: Returns the list of all recommendations for a completed code review.
      operationId: amazonWebServicesListRecommendations
      tags:
      - Codereviews
