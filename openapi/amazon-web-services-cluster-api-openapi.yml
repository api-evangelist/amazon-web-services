openapi: 3.2.0
info:
  title: Amazon Web Services Cluster API
  version: '1.0'
  description: 'Operations tagged Cluster across 2 of this provider''s published API definitions: docdb-elastic-openapi-original.yml, route53-recovery-control-config-openapi-original.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Cluster
paths:
  /cluster:
    POST:
      summary: Amazon Web Services Createcluster
      description: Creates a new Elastic DocumentDB cluster and returns its Cluster structure.
      operationId: amazonWebServicesCreateCluster
      tags:
      - Cluster
    GET:
      summary: Amazon Web Services Listclusters
      description: Returns an array of all the clusters in an account.
      operationId: amazonWebServicesListClusters
      tags:
      - Cluster
  /cluster/{clusterArn}:
    PUT:
      summary: Amazon Web Services Updatecluster
      description: Modifies a Elastic DocumentDB cluster. This includes updating admin-username/password, upgrading API version setting up a backup window and maintenance window
      operationId: amazonWebServicesUpdateCluster
      tags:
      - Cluster
  /cluster/{ClusterArn}:
    GET:
      summary: Amazon Web Services Describecluster
      description: Display the details about a cluster. The response includes the cluster name, endpoints, status, and Amazon Resource Name (ARN).
      operationId: amazonWebServicesDescribeCluster
      tags:
      - Cluster
x-refined-from:
- docdb-elastic-openapi-original.yml
- route53-recovery-control-config-openapi-original.yml
