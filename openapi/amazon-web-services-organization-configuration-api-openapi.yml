openapi: 3.2.0
info:
  title: Amazon Web Services inspector2 Organizationconfiguration API
  description: Amazon Inspector is a vulnerability discovery service that automates continuous scanning for security vulnerabilities within your Amazon EC2, Amazon ECR, and Amazon Web Services Lambda environments.
tags:
- name: Organization Configuration
paths:
  /organizationconfiguration/describe:
    POST:
      summary: Amazon Web Services Describeorganizationconfiguration
      description: Describe Amazon Inspector configuration settings for an Amazon Web Services organization.
      operationId: amazonWebServicesDescribeOrganizationConfiguration
      tags:
      - Organization Configuration
  /organizationconfiguration/update:
    POST:
      summary: Amazon Web Services Updateorganizationconfiguration
      description: Updates the configurations for your Amazon Inspector organization.
      operationId: amazonWebServicesUpdateOrganizationConfiguration
      tags:
      - Organization Configuration
