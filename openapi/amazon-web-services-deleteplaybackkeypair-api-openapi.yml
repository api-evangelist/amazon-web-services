info:
  title: Amazon Web Services ivs Delete Playback Key Pair API
  description: 'Introduction


    The Amazon Interactive Video Service (IVS) API is REST compatible, using a standard HTTP API and an Amazon Web Services EventBridge event stream for responses.'
tags:
- name: DeletePlaybackKeyPair
paths:
  /DeletePlaybackKeyPair:
    POST:
      summary: Amazon Web Services Deleteplaybackkeypair
      description: Deletes a specified authorization key pair. This invalidates future viewer tokens generated using the key pair’s privateKey. For more information, see Setting Up Private Channels in the Amazon IVS User Guide.
      operationId: amazonWebServicesDeletePlaybackKeyPair
      tags:
      - DeletePlaybackKeyPair
