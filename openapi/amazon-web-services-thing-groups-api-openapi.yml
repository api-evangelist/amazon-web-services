openapi: 3.2.0
info:
  title: Amazon Web Services iot Thing Groups API
  description: 'IoT

    IoT provides secure, bi-directional communication between Internet-connected devices (such as sensors, actuators, embedded devices, or smart appliances) and the Amazon Web Services cloud.'
tags:
- name: Thing Groups
paths:
  /thing-groups/addThingToThingGroup:
    PUT:
      summary: Amazon Web Services Addthingtothinggroup
      description: Adds a thing to a thing group. Requires permission to access the AddThingToThingGroup action.
      operationId: amazonWebServicesAddThingToThingGroup
      tags:
      - Thing Groups
  /thing-groups/{thingGroupName}:
    PATCH:
      summary: Amazon Web Services Updatethinggroup
      description: Update a thing group. Requires permission to access the UpdateThingGroup action.
      operationId: amazonWebServicesUpdateThingGroup
      tags:
      - Thing Groups
  /thing-groups:
    GET:
      summary: Amazon Web Services Listthinggroups
      description: List the thing groups in your account. Requires permission to access the ListThingGroups action.
      operationId: amazonWebServicesListThingGroups
      tags:
      - Thing Groups
  /thing-groups/{thingGroupName}/things:
    GET:
      summary: Amazon Web Services Listthingsinthinggroup
      description: Lists the things in the specified group. Requires permission to access the ListThingsInThingGroup action.
      operationId: amazonWebServicesListThingsInThingGroup
      tags:
      - Thing Groups
  /thing-groups/removeThingFromThingGroup:
    PUT:
      summary: Amazon Web Services Removethingfromthinggroup
      description: Remove the specified thing from the specified group. You must specify either a thingGroupArn or a thingGroupName to identify the thing group and either a thingArn or a thingName to identify the thing to remove from the thing group. Requires permission to access the RemoveThingFromThingGroup action.
      operationId: amazonWebServicesRemoveThingFromThingGroup
      tags:
      - Thing Groups
  /thing-groups/updateThingGroupsForThing:
    PUT:
      summary: Amazon Web Services Updatethinggroupsforthing
      description: Updates the groups to which the thing belongs. Requires permission to access the UpdateThingGroupsForThing action.
      operationId: amazonWebServicesUpdateThingGroupsForThing
      tags:
      - Thing Groups
