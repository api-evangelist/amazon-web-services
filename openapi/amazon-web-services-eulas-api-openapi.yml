info:
  title: Amazon Web Services nimble Eulas API
  description: 'Welcome to the Amazon Nimble Studio API reference. This API reference provides methods, schema, resources, parameters, and more to help you get the most out of Nimble Studio.


    Nimble Studio is a virtual studio that empowers visual effects, animation, and interactive content teams to create content securely within a scalable, private cloud service.'
tags:
- name: Eulas
paths:
  /2020-08-01/eulas/{eulaId}:
    GET:
      summary: Amazon Web Services Geteula
      description: Get EULA.
      operationId: amazonWebServicesGetEula
      tags:
      - Eulas
  /2020-08-01/eulas:
    GET:
      summary: Amazon Web Services Listeulas
      description: List EULAs.
      operationId: amazonWebServicesListEulas
      tags:
      - Eulas
