openapi: 3.2.0
info:
  title: Amazon Web Services omics Run API
  description: This is the AWS HealthOmics API Reference. For an introduction to the service, see What is AWS HealthOmics? in the AWS HealthOmics User Guide.
tags:
- name: Run
paths:
  /run/{id}/cancel:
    POST:
      summary: Amazon Web Services Cancelrun
      description: Cancels a run.
      operationId: amazonWebServicesCancelRun
      tags:
      - Run
  /run/{id}:
    GET:
      summary: Amazon Web Services Getrun
      description: Gets information about a workflow run.
      operationId: amazonWebServicesGetRun
      tags:
      - Run
  /run/{id}/task/{taskId}:
    GET:
      summary: Amazon Web Services Getruntask
      description: Gets information about a workflow run task.
      operationId: amazonWebServicesGetRunTask
      tags:
      - Run
  /run/{id}/task:
    GET:
      summary: Amazon Web Services Listruntasks
      description: Retrieves a list of tasks for a run.
      operationId: amazonWebServicesListRunTasks
      tags:
      - Run
  /run:
    POST:
      summary: Amazon Web Services Startrun
      description: Starts a workflow run. To duplicate a run, specify the run's ID and a role ARN. The remaining parameters are copied from the previous run. The total number of runs in your account is subject to a quota per Region. To avoid needing to delete runs manually, you can set the retention mode to REMOVE. Runs with this setting are deleted automatically when the run quoata is exceeded.
      operationId: amazonWebServicesStartRun
      tags:
      - Run
