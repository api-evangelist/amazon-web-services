openapi: 3.2.0
info:
  title: Amazon Web Services oam List Attached Links API
  description: Use Amazon CloudWatch Observability Access Manager to create and manage links between source accounts and monitoring accounts by using CloudWatch cross-account observability.
tags:
- name: ListAttachedLinks
paths:
  /ListAttachedLinks:
    POST:
      summary: Amazon Web Services Listattachedlinks
      description: Returns a list of source account links that are linked to this monitoring account sink. To use this operation, provide the sink ARN. To retrieve a list of sink ARNs, use ListSinks. To find a list of links for one source account, use ListLinks.
      operationId: amazonWebServicesListAttachedLinks
      tags:
      - ListAttachedLinks
