openapi: 3.2.0
info:
  title: Amazon Web Services rum Appmonitors API
  description: With Amazon CloudWatch RUM, you can perform real-user monitoring to collect client-side data about your web application performance from actual user sessions in real time.
tags:
- name: Appmonitors
paths:
  /appmonitors:
    POST:
      summary: Amazon Web Services Listappmonitors
      description: Returns a list of the Amazon CloudWatch RUM app monitors in the account.
      operationId: amazonWebServicesListAppMonitors
      tags:
      - Appmonitors
  /appmonitors/{Id}/:
    POST:
      summary: Amazon Web Services Putrumevents
      description: Sends telemetry events about your application performance and user behavior to CloudWatch RUM. The code snippet that RUM generates for you to add to your application includes PutRumEvents operations to send this data to RUM. Each PutRumEvents operation can send a batch of events from one user session.
      operationId: amazonWebServicesPutRumEvents
      tags:
      - Appmonitors
