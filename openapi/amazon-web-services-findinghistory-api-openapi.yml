openapi: 3.2.0
info:
  title: Amazon Web Services securityhub Finding History API
  description: Security Hub provides you with a comprehensive view of your security state in Amazon Web Services and helps you assess your Amazon Web Services environment against security industry standards and best practices.
tags:
- name: findingHistory
paths:
  /findingHistory/get:
    POST:
      summary: Amazon Web Services Getfindinghistory
      description: Returns history for a Security Hub finding in the last 90 days. The history includes changes made to any fields in the Amazon Web Services Security Finding Format (ASFF).
      operationId: amazonWebServicesGetFindingHistory
      tags:
      - findingHistory
