openapi: 3.2.0
info:
  title: Amazon Web Services Exports API
  version: '1.0'
  description: 'Operations tagged Exports across 4 of this provider''s published API definitions: apigatewayv2-openapi-original.yml, lex-models-openapi-original.yml, mobile-openapi-original.yml, modelslexv2-openapi-original.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Exports
paths:
  /v2/apis/{apiId}/exports/{specification}:
    GET:
      summary: Amazon Web Services Exportapi
      description: Exports a definition of an API in a particular output format and specification.
      operationId: amazonWebServicesExportApi
      tags:
      - Exports
  /exports/:
    GET:
      summary: Amazon Web Services Getexport
      description: Exports the contents of a Amazon Lex resource in a specified format.
      operationId: amazonWebServicesGetExport
      tags:
      - Exports
    POST:
      summary: Amazon Web Services Listexports
      description: Lists the exports for a bot, bot locale, or custom vocabulary. Exports are kept in the list for 7 days.
      operationId: amazonWebServicesListExports
      tags:
      - Exports
  /exports/{projectId}:
    POST:
      summary: Amazon Web Services Exportproject
      description: Exports project configuration to a snapshot which can be downloaded and shared. Note that mobile app push credentials are encrypted in exported projects, so they can only be shared successfully within the same AWS account.
      operationId: amazonWebServicesExportProject
      tags:
      - Exports
  /exports/{exportId}/:
    PUT:
      summary: Amazon Web Services Updateexport
      description: Updates the password used to protect an export zip archive. The password is not required. If you don't supply a password, Amazon Lex generates a zip file that is not protected by a password. This is the archive that is available at the pre-signed S3 URL provided by the DescribeExport operation.
      operationId: amazonWebServicesUpdateExport
      tags:
      - Exports
x-refined-from:
- apigatewayv2-openapi-original.yml
- lex-models-openapi-original.yml
- mobile-openapi-original.yml
- modelslexv2-openapi-original.yml
