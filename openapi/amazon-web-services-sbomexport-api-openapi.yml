openapi: 3.2.0
info:
  title: Amazon Web Services inspector2 Sbomexport API
  description: Amazon Inspector is a vulnerability discovery service that automates continuous scanning for security vulnerabilities within your Amazon EC2, Amazon ECR, and Amazon Web Services Lambda environments.
tags:
- name: Sbomexport
paths:
  /sbomexport/cancel:
    POST:
      summary: Amazon Web Services Cancelsbomexport
      description: Cancels a software bill of materials (SBOM) report.
      operationId: amazonWebServicesCancelSbomExport
      tags:
      - Sbomexport
  /sbomexport/create:
    POST:
      summary: Amazon Web Services Createsbomexport
      description: Creates a software bill of materials (SBOM) report.
      operationId: amazonWebServicesCreateSbomExport
      tags:
      - Sbomexport
  /sbomexport/get:
    POST:
      summary: Amazon Web Services Getsbomexport
      description: Gets details of a software bill of materials (SBOM) report.
      operationId: amazonWebServicesGetSbomExport
      tags:
      - Sbomexport
