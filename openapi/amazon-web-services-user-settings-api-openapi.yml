openapi: 3.2.0
info:
  title: Amazon Web Services workspaces-web User Settings API
  description: WorkSpaces Web is a low cost, fully managed WorkSpace built specifically to facilitate secure, web-based workloads.
tags:
- name: User Settings
paths:
  /userSettings:
    GET:
      summary: Amazon Web Services Listusersettings
      description: Retrieves a list of user settings.
      operationId: amazonWebServicesListUserSettings
      tags:
      - User Settings
  /userSettings/{userSettingsArn+}:
    PATCH:
      summary: Amazon Web Services Updateusersettings
      description: Updates the user settings.
      operationId: amazonWebServicesUpdateUserSettings
      tags:
      - User Settings
