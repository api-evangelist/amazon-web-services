openapi: 3.2.0
info:
  title: Amazon Web Services controltower Get Control Operation API
  description: These interfaces allow you to apply the Amazon Web Services library of pre-defined controls to your organizational units, programmatically.
tags:
- name: Get Control Operation
paths:
  /get-control-operation:
    POST:
      summary: Amazon Web Services Getcontroloperation
      description: Returns the status of a particular EnableControl or DisableControl operation. Displays a message in case of error. Details for an operation are available for 90 days. For usage examples, see the Amazon Web Services Control Tower User Guide .
      operationId: amazonWebServicesGetControlOperation
      tags:
      - Get Control Operation
