openapi: 3.2.0
info:
  title: Amazon Web Services iot Target Policies API
  description: 'IoT

    IoT provides secure, bi-directional communication between Internet-connected devices (such as sensors, actuators, embedded devices, or smart appliances) and the Amazon Web Services cloud.'
tags:
- name: Target Policies
paths:
  /target-policies/{policyName}:
    POST:
      summary: Amazon Web Services Detachpolicy
      description: Detaches a policy from the specified target. Because of the distributed nature of Amazon Web Services, it can take up to five minutes after a policy is detached before it's ready to be deleted. Requires permission to access the DetachPolicy action.
      operationId: amazonWebServicesDetachPolicy
      tags:
      - Target Policies
