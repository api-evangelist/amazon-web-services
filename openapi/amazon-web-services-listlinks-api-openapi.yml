openapi: 3.2.0
info:
  title: Amazon Web Services oam List Links API
  description: Use Amazon CloudWatch Observability Access Manager to create and manage links between source accounts and monitoring accounts by using CloudWatch cross-account observability.
tags:
- name: ListLinks
paths:
  /ListLinks:
    POST:
      summary: Amazon Web Services Listlinks
      description: Use this operation in a source account to return a list of links to monitoring account sinks that this source account has. To find a list of links for one monitoring account sink, use ListAttachedLinks from within the monitoring account.
      operationId: amazonWebServicesListLinks
      tags:
      - ListLinks
