openapi: 3.2.0
info:
  title: Amazon Web Services iot Keys and Certificate API
  description: 'IoT

    IoT provides secure, bi-directional communication between Internet-connected devices (such as sensors, actuators, embedded devices, or smart appliances) and the Amazon Web Services cloud.'
tags:
- name: Keys And Certificate
paths:
  /keys-and-certificate:
    POST:
      summary: Amazon Web Services Createkeysandcertificate
      description: Creates a 2048-bit RSA key pair and issues an X.509 certificate using the issued public key. You can also call CreateKeysAndCertificate over MQTT from a device, for more information, see Provisioning MQTT API. Note This is the only time IoT issues the private key for this certificate, so it is important to keep it in a secure location. Requires permission to access the CreateKeysAndCertificate action.
      operationId: amazonWebServicesCreateKeysAndCertificate
      tags:
      - Keys And Certificate
