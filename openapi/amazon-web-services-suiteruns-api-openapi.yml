openapi: 3.2.0
info:
  title: Amazon Web Services iotdeviceadvisor Suite Runs API
  description: Amazon Web Services IoT Core Device Advisor is a cloud-based, fully managed test capability for validating IoT devices during device software development.
tags:
- name: suiteRuns
paths:
  /suiteRuns:
    GET:
      summary: Amazon Web Services Listsuiteruns
      description: Lists runs of the specified Device Advisor test suite. You can list all runs of the test suite, or the runs of a specific version of the test suite. Requires permission to access the ListSuiteRuns action.
      operationId: amazonWebServicesListSuiteRuns
      tags:
      - suiteRuns
