openapi: 3.2.0
info:
  title: Amazon Web Services networkmanager Peerings API
  description: Amazon Web Services enables you to centrally manage your Amazon Web Services Cloud WAN core network and your Transit Gateway network across Amazon Web Services accounts, Regions, and on-premises locations.
tags:
- name: Peerings
paths:
  /peerings/{peeringId}:
    DELETE:
      summary: Amazon Web Services Deletepeering
      description: Deletes an existing peering connection.
      operationId: amazonWebServicesDeletePeering
      tags:
      - Peerings
  /peerings:
    GET:
      summary: Amazon Web Services Listpeerings
      description: Lists the peerings for a core network.
      operationId: amazonWebServicesListPeerings
      tags:
      - Peerings
