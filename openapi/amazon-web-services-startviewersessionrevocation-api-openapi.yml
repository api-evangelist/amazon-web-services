openapi: 3.2.0
info:
  title: Amazon Web Services ivs Start Viewer Session Revocation API
  description: 'Introduction


    The Amazon Interactive Video Service (IVS) API is REST compatible, using a standard HTTP API and an Amazon Web Services EventBridge event stream for responses.'
tags:
- name: StartViewerSessionRevocation
paths:
  /StartViewerSessionRevocation:
    POST:
      summary: Amazon Web Services Startviewersessionrevocation
      description: Starts the process of revoking the viewer session associated with a specified channel ARN and viewer ID. Optionally, you can provide a version to revoke viewer sessions less than and including that version. For instructions on associating a viewer ID with a viewer session, see Setting Up Private Channels.
      operationId: amazonWebServicesStartViewerSessionRevocation
      tags:
      - StartViewerSessionRevocation
