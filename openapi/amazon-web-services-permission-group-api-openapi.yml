openapi: 3.2.0
info:
  title: Amazon Web Services finspace-data Permission Group API
  description: The FinSpace APIs let you take actions inside the FinSpace.
tags:
- name: Permission Group
paths:
  /permission-group/{permissionGroupId}/users/{userId}:
    DELETE:
      summary: Amazon Web Services Disassociateuserfrompermissiongroup
      description: Removes a user from a permission group.
      operationId: amazonWebServicesDisassociateUserFromPermissionGroup
      tags:
      - Permission Group
  /permission-group:
    GET:
      summary: Amazon Web Services Listpermissiongroups
      description: Lists all available permission groups in FinSpace.
      operationId: amazonWebServicesListPermissionGroups
      tags:
      - Permission Group
  /permission-group/{permissionGroupId}:
    PUT:
      summary: Amazon Web Services Updatepermissiongroup
      description: Modifies the details of a permission group. You cannot modify a permissionGroupID.
      operationId: amazonWebServicesUpdatePermissionGroup
      tags:
      - Permission Group
  /permission-group/{permissionGroupId}/users:
    GET:
      summary: Amazon Web Services Listusersbypermissiongroup
      description: Lists details of all the users in a specific permission group.
      operationId: amazonWebServicesListUsersByPermissionGroup
      tags:
      - Permission Group
