openapi: 3.2.0
info:
  title: Amazon Web Services apigatewayv2 Deployments API
  description: Amazon API Gateway V2
tags:
- name: Deployments
paths:
  /v2/apis/{apiId}/deployments:
    GET:
      summary: Amazon Web Services Getdeployments
      description: Gets the Deployments for an API.
      operationId: amazonWebServicesGetDeployments
      tags:
      - Deployments
  /v2/apis/{apiId}/deployments/{deploymentId}:
    PATCH:
      summary: Amazon Web Services Updatedeployment
      description: Updates a Deployment.
      operationId: amazonWebServicesUpdateDeployment
      tags:
      - Deployments
