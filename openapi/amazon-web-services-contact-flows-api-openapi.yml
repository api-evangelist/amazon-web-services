openapi: 3.2.0
info:
  title: Amazon Web Services connect Contact Flows API
  description: Amazon Connect is a cloud-based contact center solution that you use to set up and manage a customer contact center and provide reliable customer engagement at any scale.
tags:
- name: Contact Flows
paths:
  /contact-flows/{InstanceId}:
    PUT:
      summary: Amazon Web Services Createcontactflow
      description: Creates a flow for the specified Amazon Connect instance. You can also create and update flows using the Amazon Connect Flow language.
      operationId: amazonWebServicesCreateContactFlow
      tags:
      - Contact Flows
  /contact-flows/{InstanceId}/{ContactFlowId}:
    GET:
      summary: Amazon Web Services Describecontactflow
      description: Describes the specified flow. You can also create and update flows using the Amazon Connect Flow language.
      operationId: amazonWebServicesDescribeContactFlow
      tags:
      - Contact Flows
  /contact-flows/{InstanceId}/{ContactFlowId}/content:
    POST:
      summary: Amazon Web Services Updatecontactflowcontent
      description: Updates the specified flow. You can also create and update flows using the Amazon Connect Flow language.
      operationId: amazonWebServicesUpdateContactFlowContent
      tags:
      - Contact Flows
  /contact-flows/{InstanceId}/{ContactFlowId}/metadata:
    POST:
      summary: Amazon Web Services Updatecontactflowmetadata
      description: Updates metadata about specified flow.
      operationId: amazonWebServicesUpdateContactFlowMetadata
      tags:
      - Contact Flows
  /contact-flows/{InstanceId}/{ContactFlowId}/name:
    POST:
      summary: Amazon Web Services Updatecontactflowname
      description: The name of the flow. You can also create and update flows using the Amazon Connect Flow language.
      operationId: amazonWebServicesUpdateContactFlowName
      tags:
      - Contact Flows
