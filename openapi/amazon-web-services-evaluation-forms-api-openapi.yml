openapi: 3.2.0
info:
  title: Amazon Web Services connect Evaluation Forms API
  description: Amazon Connect is a cloud-based contact center solution that you use to set up and manage a customer contact center and provide reliable customer engagement at any scale.
tags:
- name: Evaluation Forms
paths:
  /evaluation-forms/{InstanceId}/{EvaluationFormId}/activate:
    POST:
      summary: Amazon Web Services Activateevaluationform
      description: Activates an evaluation form in the specified Amazon Connect instance. After the evaluation form is activated, it is available to start new evaluations based on the form.
      operationId: amazonWebServicesActivateEvaluationForm
      tags:
      - Evaluation Forms
  /evaluation-forms/{InstanceId}:
    GET:
      summary: Amazon Web Services Listevaluationforms
      description: Lists evaluation forms in the specified Amazon Connect instance.
      operationId: amazonWebServicesListEvaluationForms
      tags:
      - Evaluation Forms
  /evaluation-forms/{InstanceId}/{EvaluationFormId}/deactivate:
    POST:
      summary: Amazon Web Services Deactivateevaluationform
      description: Deactivates an evaluation form in the specified Amazon Connect instance. After a form is deactivated, it is no longer available for users to start new evaluations based on the form.
      operationId: amazonWebServicesDeactivateEvaluationForm
      tags:
      - Evaluation Forms
  /evaluation-forms/{InstanceId}/{EvaluationFormId}:
    PUT:
      summary: Amazon Web Services Updateevaluationform
      description: Updates details about a specific evaluation form version in the specified Amazon Connect instance. Question and section identifiers cannot be duplicated within the same evaluation form. This operation does not support partial updates. Instead it does a full update of evaluation form content.
      operationId: amazonWebServicesUpdateEvaluationForm
      tags:
      - Evaluation Forms
  /evaluation-forms/{InstanceId}/{EvaluationFormId}/versions:
    GET:
      summary: Amazon Web Services Listevaluationformversions
      description: Lists versions of an evaluation form in the specified Amazon Connect instance.
      operationId: amazonWebServicesListEvaluationFormVersions
      tags:
      - Evaluation Forms
