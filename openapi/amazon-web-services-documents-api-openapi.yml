openapi: 3.2.0
info:
  title: Amazon Web Services Documents API
  version: '1.0'
  description: 'Operations tagged Documents across 2 of this provider''s published API definitions: cloudsearchdomain-openapi-original.yml, workdocs-openapi-original.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Documents
paths:
  /2013-01-01/documents/batch?format=sdk:
    POST:
      summary: Amazon Web Services Uploaddocuments
      description: Posts a batch of documents to a search domain for indexing. A document batch is a collection of add and delete operations that represent the documents you want to add, update, or delete from your domain. Batches can be described in either JSON or XML. Each item that you want Amazon CloudSearch to return as a search result (such as a product) is represented as a document. Every document has a unique ID and one or more fields that contain the data that you want to search and return in results. Individual documents cannot contain more than 1 MB of data. The entire batch cannot exceed 5 MB. To get the best possible upload performance, group add and delete operations in batches that are close the 5 MB limit. Submitting a large volume of single-document batches can overload a domain's document service. The endpoint for submitting UploadDocuments requests is domain-specific. To get the document endpoint for your domain, use the Amazon CloudSearch configuration service DescribeDomains action. A domain's endpoints are also displayed on the domain dashboard in the Amazon CloudSearch console. For more information about formatting your data for Amazon CloudSearch, see Preparing Your Data in the Amazon CloudSearch Developer Guide. For more information about uploading data for indexing, see Uploading Data in the Amazon CloudSearch Developer Guide.
      operationId: amazonWebServicesUploadDocuments
      tags:
      - Documents
  /api/v1/documents/{DocumentId}/versions/{VersionId}:
    PATCH:
      summary: Amazon Web Services Updatedocumentversion
      description: Changes the status of the document version to ACTIVE. Amazon WorkDocs also sets its document container to ACTIVE. This is the last step in a document upload, after the client uploads the document to an S3-presigned URL returned by InitiateDocumentVersionUpload.
      operationId: amazonWebServicesUpdateDocumentVersion
      tags:
      - Documents
  /api/v1/documents/{DocumentId}/versions/{VersionId}/comment:
    POST:
      summary: Amazon Web Services Createcomment
      description: Adds a new comment to the specified document version.
      operationId: amazonWebServicesCreateComment
      tags:
      - Documents
  /api/v1/documents/{DocumentId}/versions/{VersionId}/comment/{CommentId}:
    DELETE:
      summary: Amazon Web Services Deletecomment
      description: Deletes the specified comment from the document version.
      operationId: amazonWebServicesDeleteComment
      tags:
      - Documents
  /api/v1/documents/{DocumentId}:
    PATCH:
      summary: Amazon Web Services Updatedocument
      description: Updates the specified attributes of a document. The user must have access to both the document and its parent folder, if applicable.
      operationId: amazonWebServicesUpdateDocument
      tags:
      - Documents
  /api/v1/documents/{DocumentId}/versions/{VersionId}/comments:
    GET:
      summary: Amazon Web Services Describecomments
      description: List all the comments for the specified document version.
      operationId: amazonWebServicesDescribeComments
      tags:
      - Documents
  /api/v1/documents/{DocumentId}/versions:
    GET:
      summary: Amazon Web Services Describedocumentversions
      description: Retrieves the document versions for the specified document. By default, only active versions are returned.
      operationId: amazonWebServicesDescribeDocumentVersions
      tags:
      - Documents
  /api/v1/documents/{DocumentId}/path:
    GET:
      summary: Amazon Web Services Getdocumentpath
      description: Retrieves the path information (the hierarchy from the root folder) for the requested document. By default, Amazon WorkDocs returns a maximum of 100 levels upwards from the requested document and only includes the IDs of the parent folders in the path. You can limit the maximum number of levels. You can also request the names of the parent folders.
      operationId: amazonWebServicesGetDocumentPath
      tags:
      - Documents
  /api/v1/documents:
    POST:
      summary: Amazon Web Services Initiatedocumentversionupload
      description: Creates a new document object and version object. The client specifies the parent folder ID and name of the document to upload. The ID is optionally specified when creating a new version of an existing document. This is the first step to upload a document. Next, upload the document to the URL returned from the call, and then call UpdateDocumentVersion. To cancel the document upload, call AbortDocumentVersionUpload.
      operationId: amazonWebServicesInitiateDocumentVersionUpload
      tags:
      - Documents
x-refined-from:
- cloudsearchdomain-openapi-original.yml
- workdocs-openapi-original.yml
