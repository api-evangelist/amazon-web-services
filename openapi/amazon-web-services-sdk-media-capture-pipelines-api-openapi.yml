openapi: 3.2.0
info:
  title: Amazon Web Services chime-sdk-media-pipelines Sdk Media…
  description: The Amazon Chime SDK media pipeline APIs in this section allow software developers to create Amazon Chime SDK media pipelines that capture, concatenate, or stream your Amazon Chime SDK meetings. For more information about media pipelines, see Amazon Chime SDK media pipelines.
tags:
- name: Sdk Media Capture Pipelines
paths:
  /sdk-media-capture-pipelines:
    GET:
      summary: Amazon Web Services Listmediacapturepipelines
      description: Returns a list of media pipelines.
      operationId: amazonWebServicesListMediaCapturePipelines
      tags:
      - Sdk Media Capture Pipelines
  /sdk-media-capture-pipelines/{mediaPipelineId}:
    GET:
      summary: Amazon Web Services Getmediacapturepipeline
      description: Gets an existing media pipeline.
      operationId: amazonWebServicesGetMediaCapturePipeline
      tags:
      - Sdk Media Capture Pipelines
