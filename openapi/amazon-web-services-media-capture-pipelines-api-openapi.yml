openapi: 3.2.0
info:
  title: Amazon Web Services chime Media Capture Pipelines API
  description: Most of these APIs are no longer supported and will not be updated.
tags:
- name: Media Capture Pipelines
paths:
  /media-capture-pipelines:
    GET:
      summary: Amazon Web Services Listmediacapturepipelines
      description: Returns a list of media capture pipelines. This API is is no longer supported and will not be updated. We recommend using the latest version, ListMediaCapturePipelines, in the Amazon Chime SDK. Using the latest version requires migrating to a dedicated namespace. For more information, refer to Migrating from the Amazon Chime namespace in the Amazon Chime SDK Developer Guide.
      operationId: amazonWebServicesListMediaCapturePipelines
      tags:
      - Media Capture Pipelines
  /media-capture-pipelines/{mediaPipelineId}:
    GET:
      summary: Amazon Web Services Getmediacapturepipeline
      description: Gets an existing media capture pipeline. This API is is no longer supported and will not be updated. We recommend using the latest version, GetMediaCapturePipeline, in the Amazon Chime SDK. Using the latest version requires migrating to a dedicated namespace. For more information, refer to Migrating from the Amazon Chime namespace in the Amazon Chime SDK Developer Guide.
      operationId: amazonWebServicesGetMediaCapturePipeline
      tags:
      - Media Capture Pipelines
