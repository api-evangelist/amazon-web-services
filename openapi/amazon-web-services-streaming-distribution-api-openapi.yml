openapi: 3.2.0
info:
  title: Amazon Web Services cloudfront Streaming Distribution API
  description: 'Amazon CloudFront

    This is the Amazon CloudFront API Reference. This guide is for developers who need detailed information about CloudFront API actions, data types, and errors. For detailed information about CloudFront features, see the Amazon CloudFront Developer Guide.'
tags:
- name: Streaming Distribution
paths:
  /2020-05-31/streaming-distribution:
    GET:
      summary: Amazon Web Services Liststreamingdistributions
      description: List streaming distributions.
      operationId: amazonWebServicesListStreamingDistributions
      tags:
      - Streaming Distribution
  /2020-05-31/streaming-distribution?WithTags:
    POST:
      summary: Amazon Web Services Createstreamingdistributionwithtags
      description: This API is deprecated. Amazon CloudFront is deprecating real-time messaging protocol (RTMP) distributions on December 31, 2020. For more information, read the announcement on the Amazon CloudFront discussion forum.
      operationId: amazonWebServicesCreateStreamingDistributionWithTags
      tags:
      - Streaming Distribution
  /2020-05-31/streaming-distribution/{Id}:
    GET:
      summary: Amazon Web Services Getstreamingdistribution
      description: Gets information about a specified RTMP distribution, including the distribution configuration.
      operationId: amazonWebServicesGetStreamingDistribution
      tags:
      - Streaming Distribution
  /2020-05-31/streaming-distribution/{Id}/config:
    PUT:
      summary: Amazon Web Services Updatestreamingdistribution
      description: Update a streaming distribution.
      operationId: amazonWebServicesUpdateStreamingDistribution
      tags:
      - Streaming Distribution
