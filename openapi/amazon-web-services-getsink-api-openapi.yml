openapi: 3.2.0
info:
  title: Amazon Web Services oam Get Sink API
  description: Use Amazon CloudWatch Observability Access Manager to create and manage links between source accounts and monitoring accounts by using CloudWatch cross-account observability.
tags:
- name: GetSink
paths:
  /GetSink:
    POST:
      summary: Amazon Web Services Getsink
      description: Returns complete information about one monitoring account sink. To use this operation, provide the sink ARN. To retrieve a list of sink ARNs, use ListSinks.
      operationId: amazonWebServicesGetSink
      tags:
      - GetSink
