openapi: 3.2.0
info:
  title: Amazon Web Services lambda 2019 09 25 API
  description: 'Lambda

    Overview


    Lambda is a compute service that lets you run code without provisioning or managing servers.'
tags:
- name: 2019 09 25
paths:
  /2019-09-25/functions/{FunctionName}/event-invoke-config:
    POST:
      summary: Amazon Web Services Updatefunctioneventinvokeconfig
      description: Updates the configuration for asynchronous invocation for a function, version, or alias. To configure options for asynchronous invocation, use PutFunctionEventInvokeConfig.
      operationId: amazonWebServicesUpdateFunctionEventInvokeConfig
      tags:
      - 2019 09 25
  /2019-09-25/functions/{FunctionName}/event-invoke-config/list:
    GET:
      summary: Amazon Web Services Listfunctioneventinvokeconfigs
      description: Retrieves a list of configurations for asynchronous invocation for a function. To configure options for asynchronous invocation, use PutFunctionEventInvokeConfig.
      operationId: amazonWebServicesListFunctionEventInvokeConfigs
      tags:
      - 2019 09 25
