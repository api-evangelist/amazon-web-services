openapi: 3.2.0
info:
  title: Amazon Web Services vpc-lattice…
  description: Amazon VPC Lattice is a fully managed application networking service that you use to connect, secure, and monitor all of your services across multiple accounts and virtual private clouds (VPCs). Amazon VPC Lattice interconnects your microservices and legacy services within a logical boundary, so that you can discover and manage them more efficiently. For more information, see the Amazon VPC Lattice User Guide
tags:
- name: Servicenetworkserviceassociations
paths:
  /servicenetworkserviceassociations:
    GET:
      summary: Amazon Web Services Listservicenetworkserviceassociations
      description: Lists the associations between the service network and the service. You can filter the list either by service or service network. You must provide either the service network identifier or the service identifier. Every association in Amazon VPC Lattice is given a unique Amazon Resource Name (ARN), such as when a service network is associated with a VPC or when a service is associated with a service network. If the association is for a resource that is shared with another account, the association will include the local account ID as the prefix in the ARN for each account the resource is shared with.
      operationId: amazonWebServicesListServiceNetworkServiceAssociations
      tags:
      - Servicenetworkserviceassociations
  /servicenetworkserviceassociations/{serviceNetworkServiceAssociationIdentifier}:
    GET:
      summary: Amazon Web Services Getservicenetworkserviceassociation
      description: Retrieves information about the specified association between a service network and a service.
      operationId: amazonWebServicesGetServiceNetworkServiceAssociation
      tags:
      - Servicenetworkserviceassociations
