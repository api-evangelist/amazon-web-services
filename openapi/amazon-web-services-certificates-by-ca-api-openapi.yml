openapi: 3.2.0
info:
  title: Amazon Web Services iot Certificates by Ca API
  description: 'IoT

    IoT provides secure, bi-directional communication between Internet-connected devices (such as sensors, actuators, embedded devices, or smart appliances) and the Amazon Web Services cloud.'
tags:
- name: Certificates By Ca
paths:
  /certificates-by-ca/{caCertificateId}:
    GET:
      summary: Amazon Web Services Listcertificatesbyca
      description: List the device certificates signed by the specified CA certificate. Requires permission to access the ListCertificatesByCA action.
      operationId: amazonWebServicesListCertificatesByCA
      tags:
      - Certificates By Ca
