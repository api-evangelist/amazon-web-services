openapi: 3.2.0
info:
  title: Amazon Web Services iot Attached Policies API
  description: 'IoT

    IoT provides secure, bi-directional communication between Internet-connected devices (such as sensors, actuators, embedded devices, or smart appliances) and the Amazon Web Services cloud.'
tags:
- name: Attached Policies
paths:
  /attached-policies/{target}:
    POST:
      summary: Amazon Web Services Listattachedpolicies
      description: Lists the policies attached to the specified thing group. Requires permission to access the ListAttachedPolicies action.
      operationId: amazonWebServicesListAttachedPolicies
      tags:
      - Attached Policies
