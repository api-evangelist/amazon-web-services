openapi: 3.2.0
info:
  title: Amazon Web Services iotwireless Service Profiles API
  description: AWS IoT Wireless provides bi-directional communication between internet-connected wireless devices and the AWS Cloud.
tags:
- name: Service Profiles
paths:
  /service-profiles:
    GET:
      summary: Amazon Web Services Listserviceprofiles
      description: Lists the service profiles registered to your AWS account.
      operationId: amazonWebServicesListServiceProfiles
      tags:
      - Service Profiles
  /service-profiles/{Id}:
    GET:
      summary: Amazon Web Services Getserviceprofile
      description: Gets information about a service profile.
      operationId: amazonWebServicesGetServiceProfile
      tags:
      - Service Profiles
