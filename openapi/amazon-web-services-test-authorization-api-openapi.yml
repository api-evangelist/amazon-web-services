openapi: 3.2.0
info:
  title: Amazon Web Services iot Test Authorization API
  description: 'IoT

    IoT provides secure, bi-directional communication between Internet-connected devices (such as sensors, actuators, embedded devices, or smart appliances) and the Amazon Web Services cloud.'
tags:
- name: Test Authorization
paths:
  /test-authorization:
    POST:
      summary: Amazon Web Services Testauthorization
      description: Tests if a specified principal is authorized to perform an IoT action on a specified resource. Use this to test and debug the authorization behavior of devices that connect to the IoT device gateway. Requires permission to access the TestAuthorization action.
      operationId: amazonWebServicesTestAuthorization
      tags:
      - Test Authorization
