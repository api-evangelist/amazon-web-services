openapi: 3.2.0
info:
  title: Amazon Web Services detective Investigations API
  description: Detective uses machine learning and purpose-built visualizations to help you to analyze and investigate security issues across your Amazon Web Services (Amazon Web Services) workloads.
tags:
- name: Investigations
paths:
  /investigations/getInvestigation:
    POST:
      summary: Amazon Web Services Getinvestigation
      description: Returns the investigation results of an investigation for a behavior graph.
      operationId: amazonWebServicesGetInvestigation
      tags:
      - Investigations
  /investigations/listIndicators:
    POST:
      summary: Amazon Web Services Listindicators
      description: Get the indicators from an investigation
      operationId: amazonWebServicesListIndicators
      tags:
      - Investigations
  /investigations/listInvestigations:
    POST:
      summary: Amazon Web Services Listinvestigations
      description: List all Investigations.
      operationId: amazonWebServicesListInvestigations
      tags:
      - Investigations
  /investigations/startInvestigation:
    POST:
      summary: Amazon Web Services Startinvestigation
      description: initiate an investigation on an entity in a graph
      operationId: amazonWebServicesStartInvestigation
      tags:
      - Investigations
  /investigations/updateInvestigationState:
    POST:
      summary: Amazon Web Services Updateinvestigationstate
      description: Update the state of an investigation.
      operationId: amazonWebServicesUpdateInvestigationState
      tags:
      - Investigations
