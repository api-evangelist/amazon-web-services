openapi: 3.2.0
info:
  title: Amazon Web Services AWS S3 Bucket Encryption API
  description: 'The API for Amazon Simple Storage Service (Amazon S3) provides an object

    storage solution with top-notch scalability, data availability, security,

    and performance. It caters to customers of varying sizes and industries,

    offering the ability to store and secure any volume of data for a wide

    range of purposes, including data lakes, cloud-native applications, and

    mobile apps.'
tags:
- name: Bucket Encryption
paths:
  /{Bucket}?encryption:
    PUT:
      summary: Amazon Web Services Put Bucket Encryption
      description: This operation is not supported by directory buckets This action uses the encryption subresource to configure default encryption and Amazon S3 Bucket Keys for an existing bucket
      tags:
      - Bucket Encryption
      operationId: putBucketEncryption
