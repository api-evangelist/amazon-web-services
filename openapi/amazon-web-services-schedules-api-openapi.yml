info:
  title: Amazon Web Services Schedules API
  version: '1.0'
  description: 'Operations tagged Schedules across 2 of this provider''s published API definitions: databrew-openapi-original.yml, scheduler-openapi-original.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Schedules
paths:
  /schedules:
    GET:
      summary: Amazon Web Services Listschedules
      description: Lists the DataBrew schedules that are defined.
      operationId: amazonWebServicesListSchedules
      tags:
      - Schedules
  /schedules/{name}:
    PUT:
      summary: Amazon Web Services Updateschedule
      description: Modifies the definition of an existing DataBrew schedule.
      operationId: amazonWebServicesUpdateSchedule
      tags:
      - Schedules
  /schedules/{Name}:
    PUT:
      summary: Amazon Web Services Updateschedule
      description: Updates the specified schedule. When you call UpdateSchedule, EventBridge Scheduler uses all values, including empty values, specified in the request and overrides the existing schedule. This is by design. This means that if you do not set an optional field in your request, that field will be set to its system-default value after the update. Before calling this operation, we recommend that you call the GetSchedule API operation and make a note of all optional parameters for your UpdateSchedule call.
      operationId: amazonWebServicesUpdateSchedule
      tags:
      - Schedules
