openapi: 3.2.0
info:
  title: Amazon Web Services appconfig Deploymentstrategies API
  description: Use AppConfig, a capability of Amazon Web Services Systems Manager, to create, manage, and quickly deploy application configurations.
tags:
- name: Deploymentstrategies
paths:
  /deploymentstrategies:
    GET:
      summary: Amazon Web Services Listdeploymentstrategies
      description: Lists deployment strategies.
      operationId: amazonWebServicesListDeploymentStrategies
      tags:
      - Deploymentstrategies
  /deploymentstrategies/{DeploymentStrategyId}:
    PATCH:
      summary: Amazon Web Services Updatedeploymentstrategy
      description: Updates a deployment strategy.
      operationId: amazonWebServicesUpdateDeploymentStrategy
      tags:
      - Deploymentstrategies
