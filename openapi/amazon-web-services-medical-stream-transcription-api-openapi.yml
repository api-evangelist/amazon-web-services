paths:
  /medical-stream-transcription:
    POST:
      summary: Amazon Web Services Startmedicalstreamtranscription
      description: 'Starts a bidirectional HTTP/2 or WebSocket stream where audio is streamed to Amazon Transcribe Medical and the transcription results are streamed to your application. The following parameters are required: language-code media-encoding sample-rate For more information on streaming with Amazon Transcribe Medical, see Transcribing streaming audio.'
      operationId: amazonWebServicesStartMedicalStreamTranscription
      tags:
      - Medical Stream Transcription
