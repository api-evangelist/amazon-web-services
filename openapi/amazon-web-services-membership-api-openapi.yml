openapi: 3.2.0
info:
  title: Amazon Web Services detective Membership API
  description: Detective uses machine learning and purpose-built visualizations to help you to analyze and investigate security issues across your Amazon Web Services (Amazon Web Services) workloads.
tags:
- name: Membership
paths:
  /membership/datasources/get:
    POST:
      summary: Amazon Web Services Batchgetmembershipdatasources
      description: Gets information on the data source package history for an account.
      operationId: amazonWebServicesBatchGetMembershipDatasources
      tags:
      - Membership
  /membership/removal:
    POST:
      summary: Amazon Web Services Disassociatemembership
      description: Removes the member account from the specified behavior graph. This operation can only be called by an invited member account that has the ENABLED status. DisassociateMembership cannot be called by an organization account in the organization behavior graph. For the organization behavior graph, the Detective administrator account determines which organization accounts to enable or disable as member accounts.
      operationId: amazonWebServicesDisassociateMembership
      tags:
      - Membership
