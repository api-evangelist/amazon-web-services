openapi: 3.2.0
info:
  title: Amazon Web Services braket Quantum Task API
  description: 'The Amazon Braket API Reference provides information about the operations and structures supported in Amazon Braket.


    Additional Resources:


    Amazon Braket Developer Guide'
tags:
- name: Quantum Task
paths:
  /quantum-task/{quantumTaskArn}/cancel:
    PUT:
      summary: Amazon Web Services Cancelquantumtask
      description: Cancels the specified task.
      operationId: amazonWebServicesCancelQuantumTask
      tags:
      - Quantum Task
  /quantum-task:
    POST:
      summary: Amazon Web Services Createquantumtask
      description: Creates a quantum task.
      operationId: amazonWebServicesCreateQuantumTask
      tags:
      - Quantum Task
  /quantum-task/{quantumTaskArn}:
    GET:
      summary: Amazon Web Services Getquantumtask
      description: Retrieves the specified quantum task.
      operationId: amazonWebServicesGetQuantumTask
      tags:
      - Quantum Task
