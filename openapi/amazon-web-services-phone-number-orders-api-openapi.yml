info:
  title: Amazon Web Services Phone Number Orders API
  version: '1.0'
  description: 'Operations tagged Phone Number Orders across 2 of this provider''s published API definitions: chime-openapi-original.yml, chime-sdk-voice-openapi-original.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Phone Number Orders
paths:
  /phone-number-orders:
    GET:
      summary: Amazon Web Services Listphonenumberorders
      description: Lists the phone number orders for the administrator's Amazon Chime account.
      operationId: amazonWebServicesListPhoneNumberOrders
      tags:
      - Phone Number Orders
  /phone-number-orders/{phoneNumberOrderId}:
    GET:
      summary: Amazon Web Services Getphonenumberorder
      description: Retrieves details for the specified phone number order, such as the order creation timestamp, phone numbers in E.164 format, product type, and order status.
      operationId: amazonWebServicesGetPhoneNumberOrder
      tags:
      - Phone Number Orders
