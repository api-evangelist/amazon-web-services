openapi: 3.2.0
info:
  title: Amazon Web Services route53 Hostedzonesbyvpc API
  description: 'Amazon Route 53 is a highly available and scalable Domain Name System (DNS) web service.


    You can use Route 53 to:


    Register domain names.


    For more information, see How domain registration works.


    Route internet traffic to the resources for your domain


    For more information, see How internet traffic is routed to your website or web application.


    Check the health of your resources.


    For more information, see How Route 53 checks the health of your resources.'
tags:
- name: Hostedzonesbyvpc
paths:
  /2013-04-01/hostedzonesbyvpc:
    GET:
      summary: Amazon Web Services Listhostedzonesbyvpc
      description: 'Lists all the private hosted zones that a specified VPC is associated with, regardless of which Amazon Web Services account or Amazon Web Services service owns the hosted zones. The HostedZoneOwner structure in the response contains one of the following values: An OwningAccount element, which contains the account number of either the current Amazon Web Services account or another Amazon Web Services account. Some services, such as Cloud Map, create hosted zones using the current account. An OwningService element, which identifies the Amazon Web Services service that created and owns the hosted zone. For example, if a hosted zone was created by Amazon Elastic File System (Amazon EFS), the value of Owner is efs.amazonaws.com. When listing private hosted zones, the hosted zone and the Amazon VPC must belong to the same partition where the hosted zones were created. A partition is a group of Amazon Web Services Regions. Each Amazon Web Services account is scoped to one partition. The following are the supported partitions: aws - Amazon Web Services Regions aws-cn - China Regions aws-us-gov - Amazon Web Services GovCloud (US) Region For more information, see Access Management in the Amazon Web Services General Reference.'
      operationId: amazonWebServicesListHostedZonesByVPC
      tags:
      - Hostedzonesbyvpc
