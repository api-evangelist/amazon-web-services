openapi: 3.2.0
info:
  title: Amazon Web Services controltower Reset Enabled Baseline API
  description: These interfaces allow you to apply the Amazon Web Services library of pre-defined controls to your organizational units, programmatically.
tags:
- name: Reset Enabled Baseline
paths:
  /reset-enabled-baseline:
    POST:
      summary: Amazon Web Services Resetenabledbaseline
      description: Re-enables an EnabledBaseline resource. For example, this API can re-apply the existing Baseline after a new member account is moved to the target OU.
      operationId: amazonWebServicesResetEnabledBaseline
      tags:
      - Reset Enabled Baseline
