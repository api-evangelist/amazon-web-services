openapi: 3.2.0
info:
  title: Amazon Web Services iot Violations API
  description: 'IoT

    IoT provides secure, bi-directional communication between Internet-connected devices (such as sensors, actuators, embedded devices, or smart appliances) and the Amazon Web Services cloud.'
tags:
- name: Violations
paths:
  /violations/verification-state/{violationId}:
    POST:
      summary: Amazon Web Services Putverificationstateonviolation
      description: Set a verification state and provide a description of that verification state on a violation (detect alarm).
      operationId: amazonWebServicesPutVerificationStateOnViolation
      tags:
      - Violations
