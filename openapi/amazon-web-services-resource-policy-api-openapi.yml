openapi: 3.2.0
info:
  title: Amazon Web Services networkmanager Resource Policy API
  description: Amazon Web Services enables you to centrally manage your Amazon Web Services Cloud WAN core network and your Transit Gateway network across Amazon Web Services accounts, Regions, and on-premises locations.
tags:
- name: Resource Policy
paths:
  /resource-policy/{resourceArn}:
    POST:
      summary: Amazon Web Services Putresourcepolicy
      description: Creates or updates a resource policy.
      operationId: amazonWebServicesPutResourcePolicy
      tags:
      - Resource Policy
  /resourcepolicy/{Identifier}:
    GET:
      summary: Amazon Web Services Getresourcepolicy
      description: Gets the resource-based permission policy that is set for the given environment.
      operationId: amazonWebServicesGetResourcePolicy
      tags:
      - Resource Policy
  /resourcepolicy:
    PUT:
      summary: Amazon Web Services Putresourcepolicy
      description: Attaches a resource-based permission policy to the Amazon Web Services Migration Hub Refactor Spaces environment. The policy must contain the same actions and condition statements as the arn:aws:ram::aws:permission/AWSRAMDefaultPermissionRefactorSpacesEnvironment permission in Resource Access Manager. The policy must not contain new lines or blank lines.
      operationId: amazonWebServicesPutResourcePolicy
      tags:
      - Resource Policy
  /resourcePolicy/{ResourceArn}:
    GET:
      summary: Amazon Web Services Getresourcepolicy
      description: Get information about the resource policy for a cluster.
      operationId: amazonWebServicesGetResourcePolicy
      tags:
      - Resource Policy
  /resourcepolicy/{resourceArn}:
    PUT:
      summary: Amazon Web Services Putresourcepolicy
      description: Attaches a resource-based permission policy to a service or service network. The policy must contain the same actions and condition statements as the Amazon Web Services Resource Access Manager permission for sharing services and service networks.
      operationId: amazonWebServicesPutResourcePolicy
      tags:
      - Resource Policy
