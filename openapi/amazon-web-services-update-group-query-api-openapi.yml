openapi: 3.2.0
info:
  title: Amazon Web Services resource-groups Update Group Query API
  description: Resource Groups lets you organize Amazon Web Services resources such as Amazon Elastic Compute Cloud instances, Amazon Relational Database Service databases, and Amazon Simple Storage Service buckets into groups using criteria that you define as tags.
tags:
- name: Update Group Query
paths:
  /update-group-query:
    POST:
      summary: Amazon Web Services Updategroupquery
      description: 'Updates the resource query of a group. For more information about resource queries, see Create a tag-based group in Resource Groups. Minimum permissions To run this command, you must have the following permissions: resource-groups:UpdateGroupQuery'
      operationId: amazonWebServicesUpdateGroupQuery
      tags:
      - Update Group Query
