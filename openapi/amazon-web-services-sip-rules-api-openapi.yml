openapi: 3.2.0
info:
  title: Amazon Web Services Sip Rules API
  version: '1.0'
  description: 'Operations tagged Sip Rules across 2 of this provider''s published API definitions: chime-openapi-original.yml, chime-sdk-voice-openapi-original.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Sip Rules
paths:
  /sip-rules:
    GET:
      summary: Amazon Web Services Listsiprules
      description: Lists the SIP rules under the administrator's AWS account. This API is is no longer supported and will not be updated. We recommend using the latest version, ListSipRules, in the Amazon Chime SDK. Using the latest version requires migrating to a dedicated namespace. For more information, refer to Migrating from the Amazon Chime namespace in the Amazon Chime SDK Developer Guide.
      operationId: amazonWebServicesListSipRules
      tags:
      - Sip Rules
  /sip-rules/{sipRuleId}:
    PUT:
      summary: Amazon Web Services Updatesiprule
      description: Updates the details of the specified SIP rule. This API is is no longer supported and will not be updated. We recommend using the latest version, UpdateSipRule, in the Amazon Chime SDK. Using the latest version requires migrating to a dedicated namespace. For more information, refer to Migrating from the Amazon Chime namespace in the Amazon Chime SDK Developer Guide.
      operationId: amazonWebServicesUpdateSipRule
      tags:
      - Sip Rules
x-refined-from:
- chime-openapi-original.yml
- chime-sdk-voice-openapi-original.yml
