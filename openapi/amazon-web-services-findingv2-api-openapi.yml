openapi: 3.2.0
info:
  title: Amazon Web Services accessanalyzer Findingv2 API
  description: Identity and Access Management Access Analyzer helps you to set, verify, and refine your IAM policies by providing a suite of capabilities.
tags:
- name: Findingv2
paths:
  /findingv2/{id}:
    GET:
      summary: Amazon Web Services Getfindingv2
      description: Retrieves information about the specified finding.
      operationId: amazonWebServicesGetFindingV2
      tags:
      - Findingv2
  /findingv2:
    POST:
      summary: Amazon Web Services Listfindingsv2
      description: Retrieves a list of findings generated by the specified analyzer. To learn about filter keys that you can use to retrieve a list of findings, see IAM Access Analyzer filter keys in the IAM User Guide.
      operationId: amazonWebServicesListFindingsV2
      tags:
      - Findingv2
