openapi: 3.2.0
info:
  title: Amazon Web Services billingconductor List Pricing Plans API
  description: Amazon Web Services Billing Conductor is a fully managed service that you can use to customize a proforma version of your billing data each month, to accurately show or chargeback your end customers.
tags:
- name: List Pricing Plans
paths:
  /list-pricing-plans:
    POST:
      summary: Amazon Web Services Listpricingplans
      description: A paginated call to get pricing plans for the given billing period. If you don't provide a billing period, the current billing period is used.
      operationId: amazonWebServicesListPricingPlans
      tags:
      - List Pricing Plans
