openapi: 3.2.0
info:
  title: Amazon Web Services networkmanager Attachments API
  description: Amazon Web Services enables you to centrally manage your Amazon Web Services Cloud WAN core network and your Transit Gateway network across Amazon Web Services accounts, Regions, and on-premises locations.
tags:
- name: Attachments
paths:
  /attachments/{attachmentId}/accept:
    POST:
      summary: Amazon Web Services Acceptattachment
      description: Accepts a core network attachment request. Once the attachment request is accepted by a core network owner, the attachment is created and connected to a core network.
      operationId: amazonWebServicesAcceptAttachment
      tags:
      - Attachments
  /attachments/{attachmentId}:
    DELETE:
      summary: Amazon Web Services Deleteattachment
      description: Deletes an attachment. Supports all attachment types.
      operationId: amazonWebServicesDeleteAttachment
      tags:
      - Attachments
  /attachments:
    GET:
      summary: Amazon Web Services Listattachments
      description: Returns a list of core network attachments.
      operationId: amazonWebServicesListAttachments
      tags:
      - Attachments
  /attachments/{attachmentId}/reject:
    POST:
      summary: Amazon Web Services Rejectattachment
      description: Rejects a core network attachment request.
      operationId: amazonWebServicesRejectAttachment
      tags:
      - Attachments
