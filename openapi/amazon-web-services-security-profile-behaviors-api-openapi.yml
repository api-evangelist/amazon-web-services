openapi: 3.2.0
info:
  title: Amazon Web Services iot Security Profile Behaviors API
  description: 'IoT

    IoT provides secure, bi-directional communication between Internet-connected devices (such as sensors, actuators, embedded devices, or smart appliances) and the Amazon Web Services cloud.'
tags:
- name: Security Profile Behaviors
paths:
  /security-profile-behaviors/validate:
    POST:
      summary: Amazon Web Services Validatesecurityprofilebehaviors
      description: Validates a Device Defender security profile behaviors specification. Requires permission to access the ValidateSecurityProfileBehaviors action.
      operationId: amazonWebServicesValidateSecurityProfileBehaviors
      tags:
      - Security Profile Behaviors
