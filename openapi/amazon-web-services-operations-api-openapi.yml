openapi: 3.2.0
info:
  title: Amazon Web Services kafka Operations API
  description: The operations for managing an Amazon MSK cluster.
tags:
- name: Operations
paths:
  /v1/operations/{clusterOperationArn}:
    GET:
      summary: Amazon Web Services Describeclusteroperation
      description: Returns a description of the cluster operation specified by the ARN.
      operationId: amazonWebServicesDescribeClusterOperation
      tags:
      - Operations
  /api/v2/operations/{clusterOperationArn}:
    GET:
      summary: Amazon Web Services Describeclusteroperationv2
      description: Returns a description of the cluster operation specified by the ARN.
      operationId: amazonWebServicesDescribeClusterOperationV2
      tags:
      - Operations
