paths:
  /untagResource:
    POST:
      summary: Amazon Web Services Untagresource
      description: Remove one or more tags from a resource. For more information, see Tagging resources in the Bedrock User Guide.
      operationId: amazonWebServicesUntagResource
      tags:
      - Untag Resource
  /untagResource/{resourceArn}:
    POST:
      summary: Amazon Web Services Untagresource
      description: Removes the association between one or more provided tags and a notification rule.
      operationId: postUntagResourceByResourceArn
      tags:
      - Untag Resource
      x-operation-id-source: normalized
      x-operation-id-original: amazonWebServicesUntagResource
  /UntagResource:
    POST:
      summary: Amazon Web Services Untagresource
      description: Removes one or more tags from a signaling channel. In the request, specify only a tag key or keys; don't specify the value. If you specify a tag key that does not exist, it's ignored.
      operationId: postUntagResource
      tags:
      - Untag Resource
      x-operation-id-source: normalized
      x-operation-id-original: amazonWebServicesUntagResource
  /untagresource:
    POST:
      summary: Amazon Web Services Untagresource
      description: Removes the specified tag key and value pairs from the specified resource share or managed permission.
      operationId: postUntagresource
      tags:
      - Untag Resource
      x-operation-id-source: normalized
      x-operation-id-original: amazonWebServicesUntagResource
