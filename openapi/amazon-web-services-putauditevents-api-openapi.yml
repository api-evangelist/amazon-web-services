openapi: 3.2.0
info:
  title: Amazon Web Services cloudtrail-data Put Audit Events API
  description: The CloudTrail Data Service lets you ingest events into CloudTrail from any source in your hybrid environments, such as in-house or SaaS applications hosted on-premises or in the cloud, virtual machines, or containers.
tags:
- name: PutAuditEvents
paths:
  /PutAuditEvents:
    POST:
      summary: Amazon Web Services Putauditevents
      description: Ingests your application events into CloudTrail Lake. A required parameter, auditEvents, accepts the JSON records (also called payload) of events that you want CloudTrail to ingest. You can add up to 100 of these events (or up to 1 MB) per PutAuditEvents request.
      operationId: amazonWebServicesPutAuditEvents
      tags:
      - PutAuditEvents
