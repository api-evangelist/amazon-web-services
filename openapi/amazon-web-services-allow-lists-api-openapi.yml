openapi: 3.2.0
info:
  title: Amazon Web Services macie2 Allow Lists API
  description: Amazon Macie is a fully managed data security and data privacy service that uses machine learning and pattern matching to help you discover and protect your sensitive data in AWS.
tags:
- name: Allow Lists
paths:
  /allow-lists:
    GET:
      summary: Amazon Web Services Listallowlists
      description: Retrieves a subset of information about all the allow lists for an account.
      operationId: amazonWebServicesListAllowLists
      tags:
      - Allow Lists
  /allow-lists/{id}:
    PUT:
      summary: Amazon Web Services Updateallowlist
      description: Updates the settings for an allow list.
      operationId: amazonWebServicesUpdateAllowList
      tags:
      - Allow Lists
