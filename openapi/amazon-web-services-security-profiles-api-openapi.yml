openapi: 3.2.0
info:
  title: Amazon Web Services Security Profiles API
  version: '1.0'
  description: 'Operations tagged Security Profiles across 2 of this provider''s published API definitions: connect-openapi-original.yml, iot-openapi-original.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Security Profiles
paths:
  /security-profiles/{InstanceId}:
    PUT:
      summary: Amazon Web Services Createsecurityprofile
      description: Creates a security profile.
      operationId: amazonWebServicesCreateSecurityProfile
      tags:
      - Security Profiles
  /security-profiles/{InstanceId}/{SecurityProfileId}:
    POST:
      summary: Amazon Web Services Updatesecurityprofile
      description: Updates a security profile.
      operationId: amazonWebServicesUpdateSecurityProfile
      tags:
      - Security Profiles
  /security-profiles/{securityProfileName}/targets:
    GET:
      summary: Amazon Web Services Listtargetsforsecurityprofile
      description: Lists the targets (thing groups) associated with a given Device Defender security profile. Requires permission to access the ListTargetsForSecurityProfile action.
      operationId: amazonWebServicesListTargetsForSecurityProfile
      tags:
      - Security Profiles
  /security-profiles/{securityProfileName}:
    PATCH:
      summary: Amazon Web Services Updatesecurityprofile
      description: Updates a Device Defender security profile. Requires permission to access the UpdateSecurityProfile action.
      operationId: amazonWebServicesUpdateSecurityProfile
      tags:
      - Security Profiles
  /security-profiles:
    GET:
      summary: Amazon Web Services Listsecurityprofiles
      description: Lists the Device Defender security profiles you've created. You can filter security profiles by dimension or custom metric. Requires permission to access the ListSecurityProfiles action. dimensionName and metricName cannot be used in the same request.
      operationId: amazonWebServicesListSecurityProfiles
      tags:
      - Security Profiles
x-refined-from:
- connect-openapi-original.yml
- iot-openapi-original.yml
