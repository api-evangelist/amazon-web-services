openapi: 3.2.0
info:
  title: Amazon Web Services iot Security Profiles for Target API
  description: 'IoT

    IoT provides secure, bi-directional communication between Internet-connected devices (such as sensors, actuators, embedded devices, or smart appliances) and the Amazon Web Services cloud.'
tags:
- name: Security Profiles for Target
paths:
  /security-profiles-for-target:
    GET:
      summary: Amazon Web Services Listsecurityprofilesfortarget
      description: Lists the Device Defender security profiles attached to a target (thing group). Requires permission to access the ListSecurityProfilesForTarget action.
      operationId: amazonWebServicesListSecurityProfilesForTarget
      tags:
      - Security Profiles for Target
