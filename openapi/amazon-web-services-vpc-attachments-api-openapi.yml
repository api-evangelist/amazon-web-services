openapi: 3.2.0
info:
  title: Amazon Web Services networkmanager Vpc Attachments API
  description: Amazon Web Services enables you to centrally manage your Amazon Web Services Cloud WAN core network and your Transit Gateway network across Amazon Web Services accounts, Regions, and on-premises locations.
tags:
- name: VPC Attachments
paths:
  /vpc-attachments:
    POST:
      summary: Amazon Web Services Createvpcattachment
      description: Creates a VPC attachment on an edge location of a core network.
      operationId: amazonWebServicesCreateVpcAttachment
      tags:
      - VPC Attachments
  /vpc-attachments/{attachmentId}:
    PATCH:
      summary: Amazon Web Services Updatevpcattachment
      description: Updates a VPC attachment.
      operationId: amazonWebServicesUpdateVpcAttachment
      tags:
      - VPC Attachments
