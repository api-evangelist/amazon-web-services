openapi: 3.2.0
info:
  title: Amazon Web Services entityresolution Idmappingworkflows API
  description: Welcome to the Entity Resolution API Reference.
tags:
- name: Idmappingworkflows
paths:
  /idmappingworkflows:
    GET:
      summary: Amazon Web Services Listidmappingworkflows
      description: Returns a list of all the IdMappingWorkflows that have been created for an Amazon Web Services account.
      operationId: amazonWebServicesListIdMappingWorkflows
      tags:
      - Idmappingworkflows
  /idmappingworkflows/{workflowName}:
    PUT:
      summary: Amazon Web Services Updateidmappingworkflow
      description: Updates an existing IdMappingWorkflow. This method is identical to CreateIdMappingWorkflow, except it uses an HTTP PUT request instead of a POST request, and the IdMappingWorkflow must already exist for the method to succeed.
      operationId: amazonWebServicesUpdateIdMappingWorkflow
      tags:
      - Idmappingworkflows
  /idmappingworkflows/{workflowName}/jobs/{jobId}:
    GET:
      summary: Amazon Web Services Getidmappingjob
      description: Gets the status, metrics, and errors (if there are any) that are associated with a job.
      operationId: amazonWebServicesGetIdMappingJob
      tags:
      - Idmappingworkflows
  /idmappingworkflows/{workflowName}/jobs:
    POST:
      summary: Amazon Web Services Startidmappingjob
      description: Starts the IdMappingJob of a workflow. The workflow must have previously been created using the CreateIdMappingWorkflow endpoint.
      operationId: amazonWebServicesStartIdMappingJob
      tags:
      - Idmappingworkflows
