openapi: 3.2.0
info:
  title: Amazon Web Services macie2 Classification Scopes API
  description: Amazon Macie is a fully managed data security and data privacy service that uses machine learning and pattern matching to help you discover and protect your sensitive data in AWS.
tags:
- name: Classification Scopes
paths:
  /classification-scopes/{id}:
    PATCH:
      summary: Amazon Web Services Updateclassificationscope
      description: Updates the classification scope settings for an account.
      operationId: amazonWebServicesUpdateClassificationScope
      tags:
      - Classification Scopes
  /classification-scopes:
    GET:
      summary: Amazon Web Services Listclassificationscopes
      description: Retrieves a subset of information about the classification scope for an account.
      operationId: amazonWebServicesListClassificationScopes
      tags:
      - Classification Scopes
