openapi: 3.2.0
info:
  title: Amazon Web Services appconfig Extensions API
  description: Use AppConfig, a capability of Amazon Web Services Systems Manager, to create, manage, and quickly deploy application configurations.
tags:
- name: Extensions
paths:
  /extensions:
    GET:
      summary: Amazon Web Services Listextensions
      description: Lists all custom and Amazon Web Services authored AppConfig extensions in the account. For more information about extensions, see Working with AppConfig extensions in the AppConfig User Guide.
      operationId: amazonWebServicesListExtensions
      tags:
      - Extensions
  /extensions/{ExtensionIdentifier}:
    PATCH:
      summary: Amazon Web Services Updateextension
      description: Updates an AppConfig extension. For more information about extensions, see Working with AppConfig extensions in the AppConfig User Guide.
      operationId: amazonWebServicesUpdateExtension
      tags:
      - Extensions
