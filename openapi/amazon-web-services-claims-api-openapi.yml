openapi: 3.2.0
info:
  title: Amazon Web Services iot1click-devices Claims API
  description: 'Describes all of the AWS IoT 1-Click device-related API operations for the service.

    Also provides sample requests, responses, and errors for the supported web services

    protocols.'
tags:
- name: Claims
paths:
  /claims/{claimCode}:
    PUT:
      summary: Amazon Web Services Claimdevicesbyclaimcode
      description: 'Adds device(s) to your account (i.e., claim one or more devices) if and only if you

        received a claim code with the device(s).'
      operationId: amazonWebServicesClaimDevicesByClaimCode
      tags:
      - Claims
