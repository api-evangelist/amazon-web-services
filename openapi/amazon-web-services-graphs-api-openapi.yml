openapi: 3.2.0
info:
  title: Amazon Web Services Graphs API
  version: '1.0'
  description: 'Operations tagged Graphs across 2 of this provider''s published API definitions: detective-openapi-original.yml, neptune-graph-openapi-original.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Graphs
paths:
  /graphs/list:
    POST:
      summary: Amazon Web Services Listgraphs
      description: Returns the list of behavior graphs that the calling account is an administrator account of. This operation can only be called by an administrator account. Because an account can currently only be the administrator of one behavior graph within a Region, the results always contain a single behavior graph.
      operationId: amazonWebServicesListGraphs
      tags:
      - Graphs
  /graphs:
    GET:
      summary: Amazon Web Services Listgraphs
      description: Lists available Neptune Analytics graphs.
      operationId: amazonWebServicesListGraphs
      tags:
      - Graphs
  /graphs/{graphIdentifier}/endpoints/:
    GET:
      summary: Amazon Web Services Listprivategraphendpoints
      description: Lists private endpoints for a specified Neptune Analytics graph.
      operationId: amazonWebServicesListPrivateGraphEndpoints
      tags:
      - Graphs
  /graphs/{graphIdentifier}:
    PATCH:
      summary: Amazon Web Services Updategraph
      description: Updates the configuration of a specified Neptune Analytics graph
      operationId: amazonWebServicesUpdateGraph
      tags:
      - Graphs
  /graphs/{graphIdentifier}/endpoints/{vpcId}:
    GET:
      summary: Amazon Web Services Getprivategraphendpoint
      description: Retrieves information about a specified private endpoint.
      operationId: amazonWebServicesGetPrivateGraphEndpoint
      tags:
      - Graphs
x-refined-from:
- detective-openapi-original.yml
- neptune-graph-openapi-original.yml
