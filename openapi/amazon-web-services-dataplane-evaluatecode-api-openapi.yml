openapi: 3.2.0
info:
  title: Amazon Web Services appsync Dataplane Evaluatecode API
  description: AppSync provides API actions for creating and interacting with data sources using GraphQL from your application.
tags:
- name: Dataplane Evaluatecode
paths:
  /v1/dataplane-evaluatecode:
    POST:
      summary: Amazon Web Services Evaluatecode
      description: Evaluates the given code and returns the response. The code definition requirements depend on the specified runtime. For APPSYNC_JS runtimes, the code defines the request and response functions. The request function takes the incoming request after a GraphQL operation is parsed and converts it into a request configuration for the selected data source operation. The response function interprets responses from the data source and maps it to the shape of the GraphQL field output type.
      operationId: amazonWebServicesEvaluateCode
      tags:
      - Dataplane Evaluatecode
