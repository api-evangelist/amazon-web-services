openapi: 3.2.0
info:
  title: Amazon Web Services auditmanager Assessment Reports API
  description: Welcome to the Audit Manager API reference.
tags:
- name: assessmentReports
paths:
  /assessmentReports:
    GET:
      summary: Amazon Web Services Listassessmentreports
      description: Returns a list of assessment reports created in Audit Manager.
      operationId: amazonWebServicesListAssessmentReports
      tags:
      - assessmentReports
  /assessmentReports/integrity:
    POST:
      summary: Amazon Web Services Validateassessmentreportintegrity
      description: Validates the integrity of an assessment report in Audit Manager.
      operationId: amazonWebServicesValidateAssessmentReportIntegrity
      tags:
      - assessmentReports
