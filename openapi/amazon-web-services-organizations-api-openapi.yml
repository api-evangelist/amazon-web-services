openapi: 3.2.0
info:
  title: Amazon Web Services Organizations API
  version: '1.0'
  description: 'Operations tagged Organizations across 2 of this provider''s published API definitions: networkmanager-openapi-original.yml, workdocs-openapi-original.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Organizations
paths:
  /organizations/service-access:
    POST:
      summary: Amazon Web Services Startorganizationserviceaccessupdate
      description: Enables the Network Manager service for an Amazon Web Services Organization. This can only be called by a management account within the organization.
      operationId: amazonWebServicesStartOrganizationServiceAccessUpdate
      tags:
      - Organizations
  /api/v1/organizations/{OrganizationId}/subscriptions:
    GET:
      summary: Amazon Web Services Describenotificationsubscriptions
      description: Lists the specified notification subscriptions.
      operationId: amazonWebServicesDescribeNotificationSubscriptions
      tags:
      - Organizations
  /api/v1/organizations/{OrganizationId}/subscriptions/{SubscriptionId}:
    DELETE:
      summary: Amazon Web Services Deletenotificationsubscription
      description: Deletes the specified subscription from the specified organization.
      operationId: amazonWebServicesDeleteNotificationSubscription
      tags:
      - Organizations
