openapi: 3.2.0
info:
  title: Amazon Web Services braket Job API
  description: 'The Amazon Braket API Reference provides information about the operations and structures supported in Amazon Braket.


    Additional Resources:


    Amazon Braket Developer Guide'
tags:
- name: Job
paths:
  /job/{jobArn}/cancel:
    PUT:
      summary: Amazon Web Services Canceljob
      description: Cancels an Amazon Braket job.
      operationId: amazonWebServicesCancelJob
      tags:
      - Job
  /job:
    POST:
      summary: Amazon Web Services Createjob
      description: Creates an Amazon Braket job.
      operationId: amazonWebServicesCreateJob
      tags:
      - Job
  /job/{jobArn}:
    GET:
      summary: Amazon Web Services Getjob
      description: Retrieves the specified Amazon Braket job.
      operationId: amazonWebServicesGetJob
      tags:
      - Job
