openapi: 3.2.0
info:
  title: Amazon Web Services AWS S3 Bucket Policy API
  description: 'The API for Amazon Simple Storage Service (Amazon S3) provides an object

    storage solution with top-notch scalability, data availability, security,

    and performance. It caters to customers of varying sizes and industries,

    offering the ability to store and secure any volume of data for a wide

    range of purposes, including data lakes, cloud-native applications, and

    mobile apps.'
tags:
- name: Bucket Policy
paths:
  /{Bucket}?policy:
    PUT:
      summary: Amazon Web Services Put Bucket Policy
      description: Applies an Amazon S3 bucket policy to an Amazon S3 bucket Directory buckets - For directory buckets, you must make requests for this API operation to the Regional endpoint.
      tags:
      - Bucket Policy
      operationId: putBucketPolicy
