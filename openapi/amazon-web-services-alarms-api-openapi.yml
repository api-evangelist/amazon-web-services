openapi: 3.2.0
info:
  title: Amazon Web Services iotevents-data Alarms API
  description: 'IoT Events monitors your equipment or device fleets for failures or changes in operation, and triggers actions when such events occur. You can use IoT Events Data API commands to send inputs to detectors, list detectors, and view or update a detector''s status.


    For more information, see What is IoT Events? in the IoT Events Developer Guide.'
tags:
- name: Alarms
paths:
  /alarms/acknowledge:
    POST:
      summary: Amazon Web Services Batchacknowledgealarm
      description: Acknowledges one or more alarms. The alarms change to the ACKNOWLEDGED state after you acknowledge them.
      operationId: amazonWebServicesBatchAcknowledgeAlarm
      tags:
      - Alarms
  /alarms/disable:
    POST:
      summary: Amazon Web Services Batchdisablealarm
      description: Disables one or more alarms. The alarms change to the DISABLED state after you disable them.
      operationId: amazonWebServicesBatchDisableAlarm
      tags:
      - Alarms
  /alarms/enable:
    POST:
      summary: Amazon Web Services Batchenablealarm
      description: Enables one or more alarms. The alarms change to the NORMAL state after you enable them.
      operationId: amazonWebServicesBatchEnableAlarm
      tags:
      - Alarms
  /alarms/reset:
    POST:
      summary: Amazon Web Services Batchresetalarm
      description: Resets one or more alarms. The alarms return to the NORMAL state after you reset them.
      operationId: amazonWebServicesBatchResetAlarm
      tags:
      - Alarms
  /alarms/snooze:
    POST:
      summary: Amazon Web Services Batchsnoozealarm
      description: Changes one or more alarms to the snooze mode. The alarms change to the SNOOZE_DISABLED state after you set them to the snooze mode.
      operationId: amazonWebServicesBatchSnoozeAlarm
      tags:
      - Alarms
  /alarms/{alarmModelName}/keyValues/:
    GET:
      summary: Amazon Web Services Describealarm
      description: Retrieves information about an alarm.
      operationId: amazonWebServicesDescribeAlarm
      tags:
      - Alarms
  /alarms/{alarmModelName}:
    GET:
      summary: Amazon Web Services Listalarms
      description: Lists one or more alarms. The operation returns only the metadata associated with each alarm.
      operationId: amazonWebServicesListAlarms
      tags:
      - Alarms
