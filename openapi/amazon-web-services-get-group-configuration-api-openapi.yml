openapi: 3.2.0
info:
  title: Amazon Web Services resource-groups Get Group Configuration…
  description: Resource Groups lets you organize Amazon Web Services resources such as Amazon Elastic Compute Cloud instances, Amazon Relational Database Service databases, and Amazon Simple Storage Service buckets into groups using criteria that you define as tags.
tags:
- name: Get Group Configuration
paths:
  /get-group-configuration:
    POST:
      summary: Amazon Web Services Getgroupconfiguration
      description: 'Retrieves the service configuration associated with the specified resource group. For details about the service configuration syntax, see Service configurations for Resource Groups. Minimum permissions To run this command, you must have the following permissions: resource-groups:GetGroupConfiguration'
      operationId: amazonWebServicesGetGroupConfiguration
      tags:
      - Get Group Configuration
