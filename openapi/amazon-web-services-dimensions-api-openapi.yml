openapi: 3.2.0
info:
  title: Amazon Web Services iot Dimensions API
  description: 'IoT

    IoT provides secure, bi-directional communication between Internet-connected devices (such as sensors, actuators, embedded devices, or smart appliances) and the Amazon Web Services cloud.'
tags:
- name: Dimensions
paths:
  /dimensions/{name}:
    PATCH:
      summary: Amazon Web Services Updatedimension
      description: Updates the definition for a dimension. You cannot change the type of a dimension after it is created (you can delete it and recreate it). Requires permission to access the UpdateDimension action.
      operationId: amazonWebServicesUpdateDimension
      tags:
      - Dimensions
  /dimensions:
    GET:
      summary: Amazon Web Services Listdimensions
      description: List the set of dimensions that are defined for your Amazon Web Services accounts. Requires permission to access the ListDimensions action.
      operationId: amazonWebServicesListDimensions
      tags:
      - Dimensions
