info:
  title: Amazon Web Services APIS API
  version: '1.0'
  description: 'Operations tagged Apis across 2 of this provider''s published API definitions: apigatewayv2-openapi-original.yml, appsync-openapi-original.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: APIs
paths:
  /v2/apis:
    PUT:
      summary: Amazon Web Services Importapi
      description: Imports an API.
      operationId: amazonWebServicesImportApi
      tags:
      - APIs
  /v2/apis/{apiId}:
    PATCH:
      summary: Amazon Web Services Updateapi
      description: Updates an Api resource.
      operationId: amazonWebServicesUpdateApi
      tags:
      - APIs
  /v1/apis:
    GET:
      summary: Amazon Web Services Listgraphqlapis
      description: Lists your GraphQL APIs.
      operationId: amazonWebServicesListGraphqlApis
      tags:
      - APIs
  /v1/apis/{apiId}:
    POST:
      summary: Amazon Web Services Updategraphqlapi
      description: Updates a GraphqlApi object.
      operationId: amazonWebServicesUpdateGraphqlApi
      tags:
      - APIs
