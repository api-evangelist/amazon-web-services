openapi: 3.2.0
info:
  title: Amazon Web Services workspaces-web Network Settings API
  description: WorkSpaces Web is a low cost, fully managed WorkSpace built specifically to facilitate secure, web-based workloads.
tags:
- name: Network Settings
paths:
  /networkSettings:
    GET:
      summary: Amazon Web Services Listnetworksettings
      description: Retrieves a list of network settings.
      operationId: amazonWebServicesListNetworkSettings
      tags:
      - Network Settings
  /networkSettings/{networkSettingsArn+}:
    PATCH:
      summary: Amazon Web Services Updatenetworksettings
      description: Updates network settings.
      operationId: amazonWebServicesUpdateNetworkSettings
      tags:
      - Network Settings
