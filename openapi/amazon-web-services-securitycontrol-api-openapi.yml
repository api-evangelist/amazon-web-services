openapi: 3.2.0
info:
  title: Amazon Web Services securityhub Security Control API
  description: Security Hub provides you with a comprehensive view of your security state in Amazon Web Services and helps you assess your Amazon Web Services environment against security industry standards and best practices.
tags:
- name: securityControl
paths:
  /securityControl/definition:
    GET:
      summary: Amazon Web Services Getsecuritycontroldefinition
      description: Retrieves the definition of a security control. The definition includes the control title, description, Region availability, parameter definitions, and other details.
      operationId: amazonWebServicesGetSecurityControlDefinition
      tags:
      - securityControl
  /securityControl/update:
    PATCH:
      summary: Amazon Web Services Updatesecuritycontrol
      description: Updates the properties of a security control.
      operationId: amazonWebServicesUpdateSecurityControl
      tags:
      - securityControl
