openapi: 3.2.0
info:
  title: Amazon Web Services iotdeviceadvisor Suite Definitions API
  description: Amazon Web Services IoT Core Device Advisor is a cloud-based, fully managed test capability for validating IoT devices during device software development.
tags:
- name: suiteDefinitions
paths:
  /suiteDefinitions:
    GET:
      summary: Amazon Web Services Listsuitedefinitions
      description: Lists the Device Advisor test suites you have created. Requires permission to access the ListSuiteDefinitions action.
      operationId: amazonWebServicesListSuiteDefinitions
      tags:
      - suiteDefinitions
  /suiteDefinitions/{suiteDefinitionId}:
    PATCH:
      summary: Amazon Web Services Updatesuitedefinition
      description: Updates a Device Advisor test suite. Requires permission to access the UpdateSuiteDefinition action.
      operationId: amazonWebServicesUpdateSuiteDefinition
      tags:
      - suiteDefinitions
  /suiteDefinitions/{suiteDefinitionId}/suiteRuns/{suiteRunId}:
    GET:
      summary: Amazon Web Services Getsuiterun
      description: Gets information about a Device Advisor test suite run. Requires permission to access the GetSuiteRun action.
      operationId: amazonWebServicesGetSuiteRun
      tags:
      - suiteDefinitions
  /suiteDefinitions/{suiteDefinitionId}/suiteRuns/{suiteRunId}/report:
    GET:
      summary: Amazon Web Services Getsuiterunreport
      description: Gets a report download link for a successful Device Advisor qualifying test suite run. Requires permission to access the GetSuiteRunReport action.
      operationId: amazonWebServicesGetSuiteRunReport
      tags:
      - suiteDefinitions
  /suiteDefinitions/{suiteDefinitionId}/suiteRuns:
    POST:
      summary: Amazon Web Services Startsuiterun
      description: Starts a Device Advisor test suite run. Requires permission to access the StartSuiteRun action.
      operationId: amazonWebServicesStartSuiteRun
      tags:
      - suiteDefinitions
  /suiteDefinitions/{suiteDefinitionId}/suiteRuns/{suiteRunId}/stop:
    POST:
      summary: Amazon Web Services Stopsuiterun
      description: Stops a Device Advisor test suite run that is currently running. Requires permission to access the StopSuiteRun action.
      operationId: amazonWebServicesStopSuiteRun
      tags:
      - suiteDefinitions
