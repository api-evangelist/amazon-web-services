openapi: 3.2.0
info:
  title: Amazon Web Services rds-data Execute API
  description: 'RDS Data API

    Amazon RDS provides an HTTP endpoint to run SQL statements on an Amazon Aurora DB cluster. To run these statements, you use the RDS Data API (Data API).


    Data API is available with the following types of Aurora databases:


    Aurora PostgreSQL - Serverless v2, Serverless v1, and provisioned


    Aurora MySQL - Serverless v1 only


    For more information about the Data API, see Using RDS Data API in the Amazon Aurora User Guide.'
tags:
- name: Execute
paths:
  /Execute:
    POST:
      summary: Amazon Web Services Executestatement
      description: Runs a SQL statement against a database. If a call isn't part of a transaction because it doesn't include the transactionID parameter, changes that result from the call are committed automatically. If the binary response data from the database is more than 1 MB, the call is terminated.
      operationId: amazonWebServicesExecuteStatement
      tags:
      - Execute
