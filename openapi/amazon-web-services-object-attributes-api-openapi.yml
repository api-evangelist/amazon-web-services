openapi: 3.2.0
info:
  title: Amazon Web Services AWS S3 Object Attributes API
  description: 'The API for Amazon Simple Storage Service (Amazon S3) provides an object

    storage solution with top-notch scalability, data availability, security,

    and performance. It caters to customers of varying sizes and industries,

    offering the ability to store and secure any volume of data for a wide

    range of purposes, including data lakes, cloud-native applications, and

    mobile apps.'
tags:
- name: Object Attributes
paths:
  /{Bucket}/{Key+}?attributes:
    GET:
      summary: Amazon Web Services Get Object Attributes
      description: Retrieves all the metadata from an object without returning the object itself This operation is useful if you're interested only in an object's metadata.
      tags:
      - Object Attributes
      operationId: getObjectAttributes
