openapi: 3.2.0
info:
  title: Amazon Web Services ivs List Channels API
  description: 'Introduction


    The Amazon Interactive Video Service (IVS) API is REST compatible, using a standard HTTP API and an Amazon Web Services EventBridge event stream for responses.'
tags:
- name: ListChannels
paths:
  /ListChannels:
    POST:
      summary: Amazon Web Services Listchannels
      description: Gets summary information about all channels in your account, in the Amazon Web Services region where the API request is processed. This list can be filtered to match a specified name or recording-configuration ARN. Filters are mutually exclusive and cannot be used together. If you try to use both filters, you will get an error (409 ConflictException).
      operationId: amazonWebServicesListChannels
      tags:
      - ListChannels
