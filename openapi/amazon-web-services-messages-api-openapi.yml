info:
  title: Amazon Web Services Messages API
  version: '1.0'
  description: 'Operations tagged Messages across 2 of this provider''s published API definitions: iotanalytics-openapi-original.yml, workmailmessageflow-openapi-original.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Messages
paths:
  /messages/batch:
    POST:
      summary: Amazon Web Services Batchputmessage
      description: Sends messages to a channel.
      operationId: amazonWebServicesBatchPutMessage
      tags:
      - Messages
  /messages/{messageId}:
    POST:
      summary: Amazon Web Services Putrawmessagecontent
      description: Updates the raw content of an in-transit email message, in MIME format. This example describes how to update in-transit email message. For more information and examples for using this API, see Updating message content with AWS Lambda. Updates to an in-transit message only appear when you call PutRawMessageContent from an AWS Lambda function configured with a synchronous Run Lambda rule. If you call PutRawMessageContent on a delivered or sent message, the message remains unchanged, even though GetRawMessageContent returns an updated message.
      operationId: amazonWebServicesPutRawMessageContent
      tags:
      - Messages
