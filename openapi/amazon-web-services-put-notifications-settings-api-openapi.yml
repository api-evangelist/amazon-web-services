openapi: 3.2.0
info:
  title: Amazon Web Services rolesanywhere Put Notifications…
  description: Identity and Access Management Roles Anywhere provides a secure way for your workloads such as servers, containers, and applications that run outside of Amazon Web Services to obtain temporary Amazon Web Services credentials.
tags:
- name: Put Notifications Settings
paths:
  /put-notifications-settings:
    PATCH:
      summary: Amazon Web Services Putnotificationsettings
      description: 'Attaches a list of notification settings to a trust anchor. A notification setting includes information such as event name, threshold, status of the notification setting, and the channel to notify. Required permissions: rolesanywhere:PutNotificationSettings.'
      operationId: amazonWebServicesPutNotificationSettings
      tags:
      - Put Notifications Settings
