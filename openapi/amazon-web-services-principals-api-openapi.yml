openapi: 3.2.0
info:
  title: Amazon Web Services iot Principals API
  description: 'IoT

    IoT provides secure, bi-directional communication between Internet-connected devices (such as sensors, actuators, embedded devices, or smart appliances) and the Amazon Web Services cloud.'
tags:
- name: Principals
paths:
  /principals/things:
    GET:
      summary: Amazon Web Services Listprincipalthings
      description: Lists the things associated with the specified principal. A principal can be X.509 certificates, IAM users, groups, and roles, Amazon Cognito identities or federated identities. Requires permission to access the ListPrincipalThings action.
      operationId: amazonWebServicesListPrincipalThings
      tags:
      - Principals
