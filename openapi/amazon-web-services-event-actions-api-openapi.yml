openapi: 3.2.0
info:
  title: Amazon Web Services dataexchange Event Actions API
  description: AWS Data Exchange is a service that makes it easy for AWS customers to exchange data in the cloud.
tags:
- name: Event Actions
paths:
  /v1/event-actions:
    GET:
      summary: Amazon Web Services Listeventactions
      description: This operation lists your event actions.
      operationId: amazonWebServicesListEventActions
      tags:
      - Event Actions
  /v1/event-actions/{EventActionId}:
    PATCH:
      summary: Amazon Web Services Updateeventaction
      description: This operation updates the event action.
      operationId: amazonWebServicesUpdateEventAction
      tags:
      - Event Actions
