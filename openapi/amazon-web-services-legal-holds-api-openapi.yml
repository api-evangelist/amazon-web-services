openapi: 3.2.0
info:
  title: Amazon Web Services backup Legal Holds API
  description: 'Backup

    Backup is a unified backup service designed to protect Amazon Web Services services and their associated data. Backup simplifies the creation, migration, restoration, and deletion of backups, while also providing reporting and auditing.'
tags:
- name: Legal Holds
paths:
  /legal-holds/{legalHoldId}:
    DELETE:
      summary: Amazon Web Services Cancellegalhold
      description: This action removes the specified legal hold on a recovery point. This action can only be performed by a user with sufficient permissions.
      operationId: amazonWebServicesCancelLegalHold
      tags:
      - Legal Holds
  /legal-holds/:
    GET:
      summary: Amazon Web Services Listlegalholds
      description: This action returns metadata about active and previous legal holds.
      operationId: amazonWebServicesListLegalHolds
      tags:
      - Legal Holds
  /legal-holds/{legalHoldId}/:
    GET:
      summary: Amazon Web Services Getlegalhold
      description: This action returns details for a specified legal hold. The details are the body of a legal hold in JSON format, in addition to metadata.
      operationId: amazonWebServicesGetLegalHold
      tags:
      - Legal Holds
  /legal-holds/{legalHoldId}/recovery-points:
    GET:
      summary: Amazon Web Services Listrecoverypointsbylegalhold
      description: This action returns recovery point ARNs (Amazon Resource Names) of the specified legal hold.
      operationId: amazonWebServicesListRecoveryPointsByLegalHold
      tags:
      - Legal Holds
