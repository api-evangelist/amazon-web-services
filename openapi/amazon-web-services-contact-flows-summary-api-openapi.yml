openapi: 3.2.0
info:
  title: Amazon Web Services connect Contact Flows Summary API
  description: Amazon Connect is a cloud-based contact center solution that you use to set up and manage a customer contact center and provide reliable customer engagement at any scale.
tags:
- name: Contact Flows Summary
paths:
  /contact-flows-summary/{InstanceId}:
    GET:
      summary: Amazon Web Services Listcontactflows
      description: Provides information about the flows for the specified Amazon Connect instance. You can also create and update flows using the Amazon Connect Flow language. For more information about flows, see Flows in the Amazon Connect Administrator Guide.
      operationId: amazonWebServicesListContactFlows
      tags:
      - Contact Flows Summary
