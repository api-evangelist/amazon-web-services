openapi: 3.2.0
info:
  title: Amazon Web Services connect Traffic Distribution Group API
  description: Amazon Connect is a cloud-based contact center solution that you use to set up and manage a customer contact center and provide reliable customer engagement at any scale.
tags:
- name: Traffic Distribution Group
paths:
  /traffic-distribution-group/{TrafficDistributionGroupId}/user:
    GET:
      summary: Amazon Web Services Listtrafficdistributiongroupusers
      description: Lists traffic distribution group users.
      operationId: amazonWebServicesListTrafficDistributionGroupUsers
      tags:
      - Traffic Distribution Group
  /traffic-distribution-group:
    PUT:
      summary: Amazon Web Services Createtrafficdistributiongroup
      description: Creates a traffic distribution group given an Amazon Connect instance that has been replicated. The SignInConfig distribution is available only on a default TrafficDistributionGroup (see the IsDefault parameter in the TrafficDistributionGroup data type). If you call UpdateTrafficDistribution with a modified SignInConfig and a non-default TrafficDistributionGroup, an InvalidRequestException is returned. For more information about creating traffic distribution groups, see Set up traffic distribution groups in the Amazon Connect Administrator Guide.
      operationId: amazonWebServicesCreateTrafficDistributionGroup
      tags:
      - Traffic Distribution Group
  /traffic-distribution-group/{TrafficDistributionGroupId}:
    GET:
      summary: Amazon Web Services Describetrafficdistributiongroup
      description: Gets details and status of a traffic distribution group.
      operationId: amazonWebServicesDescribeTrafficDistributionGroup
      tags:
      - Traffic Distribution Group
