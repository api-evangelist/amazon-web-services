info:
  title: Amazon Web Services App Instances API
  version: '1.0'
  description: 'Operations tagged App Instances across 3 of this provider''s published API definitions: chime-openapi-original.yml, chime-sdk-identity-openapi-original.yml, chime-sdk-messaging-openapi-original.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: App Instances
paths:
  /app-instances:
    GET:
      summary: Amazon Web Services Listappinstances
      description: Lists all Amazon Chime AppInstances created under a single AWS account. This API is is no longer supported and will not be updated. We recommend using the latest version, ListAppInstances, in the Amazon Chime SDK. Using the latest version requires migrating to a dedicated namespace. For more information, refer to Migrating from the Amazon Chime namespace in the Amazon Chime SDK Developer Guide.
      operationId: amazonWebServicesListAppInstances
      tags:
      - App Instances
  /app-instances/{appInstanceArn}/admins:
    GET:
      summary: Amazon Web Services Listappinstanceadmins
      description: Returns a list of the administrators in the AppInstance. This API is is no longer supported and will not be updated. We recommend using the latest version, ListAppInstanceAdmins, in the Amazon Chime SDK. Using the latest version requires migrating to a dedicated namespace. For more information, refer to Migrating from the Amazon Chime namespace in the Amazon Chime SDK Developer Guide.
      operationId: amazonWebServicesListAppInstanceAdmins
      tags:
      - App Instances
  /app-instances/{appInstanceArn}:
    PUT:
      summary: Amazon Web Services Updateappinstance
      description: Updates AppInstance metadata. This API is is no longer supported and will not be updated. We recommend using the latest version, UpdateAppInstance, in the Amazon Chime SDK. Using the latest version requires migrating to a dedicated namespace. For more information, refer to Migrating from the Amazon Chime namespace in the Amazon Chime SDK Developer Guide.
      operationId: amazonWebServicesUpdateAppInstance
      tags:
      - App Instances
  /app-instances/{appInstanceArn}/admins/{appInstanceAdminArn}:
    GET:
      summary: Amazon Web Services Describeappinstanceadmin
      description: Returns the full details of an AppInstanceAdmin. This API is is no longer supported and will not be updated. We recommend using the latest version, DescribeAppInstanceAdmin, in the Amazon Chime SDK. Using the latest version requires migrating to a dedicated namespace. For more information, refer to Migrating from the Amazon Chime namespace in the Amazon Chime SDK Developer Guide.
      operationId: amazonWebServicesDescribeAppInstanceAdmin
      tags:
      - App Instances
  /app-instances/{appInstanceArn}/streaming-configurations:
    PUT:
      summary: Amazon Web Services Putappinstancestreamingconfigurations
      description: The data streaming configurations of an AppInstance. This API is is no longer supported and will not be updated. We recommend using the latest version, PutMessagingStreamingConfigurations, in the Amazon Chime SDK. Using the latest version requires migrating to a dedicated namespace. For more information, refer to Migrating from the Amazon Chime namespace in the Amazon Chime SDK Developer Guide.
      operationId: amazonWebServicesPutAppInstanceStreamingConfigurations
      tags:
      - App Instances
  /app-instances/{appInstanceArn}/retention-settings:
    PUT:
      summary: Amazon Web Services Putappinstanceretentionsettings
      description: Sets the amount of time in days that a given AppInstance retains data. This API is is no longer supported and will not be updated. We recommend using the latest version, PutAppInstanceRetentionSettings, in the Amazon Chime SDK. Using the latest version requires migrating to a dedicated namespace. For more information, refer to Migrating from the Amazon Chime namespace in the Amazon Chime SDK Developer Guide.
      operationId: amazonWebServicesPutAppInstanceRetentionSettings
      tags:
      - App Instances
