paths:
  /tagResource:
    POST:
      summary: Amazon Web Services Tagresource
      description: Associate tags with a resource. For more information, see Tagging resources in the Bedrock User Guide.
      operationId: amazonWebServicesTagResource
      tags:
      - Tag Resource
  /TagResource:
    POST:
      summary: Amazon Web Services Tagresource
      description: Adds one or more tags to a signaling channel. A tag is a key-value pair (the value is optional) that you can define and assign to Amazon Web Services resources. If you specify a tag that already exists, the tag value is replaced with the value that you specify in the request. For more information, see Using Cost Allocation Tags in the Billing and Cost Management and Cost Management User Guide.
      operationId: amazonWebServicesTagResource
      tags:
      - Tag Resource
  /tagresource:
    POST:
      summary: Amazon Web Services Tagresource
      description: Adds the specified tag keys and values to a resource share or managed permission. If you choose a resource share, the tags are attached to only the resource share, not to the resources that are in the resource share. The tags on a managed permission are the same for all versions of the managed permission.
      operationId: amazonWebServicesTagResource
      tags:
      - Tag Resource
