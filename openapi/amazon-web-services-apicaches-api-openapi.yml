openapi: 3.2.0
info:
  title: Amazon Web Services appsync API Caches API
  description: AppSync provides API actions for creating and interacting with data sources using GraphQL from your application.
tags:
- name: ApiCaches
paths:
  /v1/apis/{apiId}/ApiCaches:
    GET:
      summary: Amazon Web Services Getapicache
      description: Retrieves an ApiCache object.
      operationId: amazonWebServicesGetApiCache
      tags:
      - ApiCaches
  /v1/apis/{apiId}/ApiCaches/update:
    POST:
      summary: Amazon Web Services Updateapicache
      description: Updates the cache for the GraphQL API.
      operationId: amazonWebServicesUpdateApiCache
      tags:
      - ApiCaches
