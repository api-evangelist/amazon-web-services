openapi: 3.2.0
info:
  title: Amazon Web Services macie2 Findingsfilters API
  description: Amazon Macie is a fully managed data security and data privacy service that uses machine learning and pattern matching to help you discover and protect your sensitive data in AWS.
tags:
- name: Findingsfilters
paths:
  /findingsfilters:
    GET:
      summary: Amazon Web Services Listfindingsfilters
      description: Retrieves a subset of information about all the findings filters for an account.
      operationId: amazonWebServicesListFindingsFilters
      tags:
      - Findingsfilters
  /findingsfilters/{id}:
    PATCH:
      summary: Amazon Web Services Updatefindingsfilter
      description: Updates the criteria and other settings for a findings filter.
      operationId: amazonWebServicesUpdateFindingsFilter
      tags:
      - Findingsfilters
