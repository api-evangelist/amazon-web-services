openapi: 3.2.0
info:
  title: Amazon Web Services connect Routing Profiles Summary API
  description: Amazon Connect is a cloud-based contact center solution that you use to set up and manage a customer contact center and provide reliable customer engagement at any scale.
tags:
- name: Routing Profiles Summary
paths:
  /routing-profiles-summary/{InstanceId}:
    GET:
      summary: Amazon Web Services Listroutingprofiles
      description: Provides summary information about the routing profiles for the specified Amazon Connect instance. For more information about routing profiles, see Routing Profiles and Create a Routing Profile in the Amazon Connect Administrator Guide.
      operationId: amazonWebServicesListRoutingProfiles
      tags:
      - Routing Profiles Summary
