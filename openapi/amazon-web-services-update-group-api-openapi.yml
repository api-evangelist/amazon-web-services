openapi: 3.2.0
info:
  title: Amazon Web Services resource-groups Update Group API
  description: Resource Groups lets you organize Amazon Web Services resources such as Amazon Elastic Compute Cloud instances, Amazon Relational Database Service databases, and Amazon Simple Storage Service buckets into groups using criteria that you define as tags.
tags:
- name: Update Group
paths:
  /update-group:
    POST:
      summary: Amazon Web Services Updategroup
      description: 'Updates the description for an existing group. You cannot update the name of a resource group. Minimum permissions To run this command, you must have the following permissions: resource-groups:UpdateGroup'
      operationId: amazonWebServicesUpdateGroup
      tags:
      - Update Group
  /UpdateGroup:
    POST:
      summary: Amazon Web Services Updategroup
      description: Updates a group resource.
      operationId: amazonWebServicesUpdateGroup
      tags:
      - Update Group
