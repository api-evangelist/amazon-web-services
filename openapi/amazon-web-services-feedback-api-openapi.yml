openapi: 3.2.0
info:
  title: Amazon Web Services Feedback API
  version: '1.0'
  description: 'Operations tagged Feedback across 2 of this provider''s published API definitions: codeguru-reviewer-openapi-original.yml, devops-guru-openapi-original.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Feedback
paths:
  /feedback/{CodeReviewArn}:
    GET:
      summary: Amazon Web Services Describerecommendationfeedback
      description: Describes the customer feedback for a CodeGuru Reviewer recommendation.
      operationId: amazonWebServicesDescribeRecommendationFeedback
      tags:
      - Feedback
  /feedback/{CodeReviewArn}/RecommendationFeedback:
    GET:
      summary: Amazon Web Services Listrecommendationfeedback
      description: Returns a list of RecommendationFeedbackSummary objects that contain customer recommendation feedback for all CodeGuru Reviewer users.
      operationId: amazonWebServicesListRecommendationFeedback
      tags:
      - Feedback
  /feedback:
    PUT:
      summary: Amazon Web Services Putrecommendationfeedback
      description: Stores customer feedback for a CodeGuru Reviewer recommendation. When this API is called again with different reactions the previous feedback is overwritten.
      operationId: amazonWebServicesPutRecommendationFeedback
      tags:
      - Feedback
x-refined-from:
- codeguru-reviewer-openapi-original.yml
- devops-guru-openapi-original.yml
