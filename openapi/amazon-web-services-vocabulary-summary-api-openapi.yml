openapi: 3.2.0
info:
  title: Amazon Web Services connect Vocabulary Summary API
  description: Amazon Connect is a cloud-based contact center solution that you use to set up and manage a customer contact center and provide reliable customer engagement at any scale.
tags:
- name: Vocabulary Summary
paths:
  /vocabulary-summary/{InstanceId}:
    POST:
      summary: Amazon Web Services Searchvocabularies
      description: Searches for vocabularies within a specific Amazon Connect instance using State, NameStartsWith, and LanguageCode.
      operationId: amazonWebServicesSearchVocabularies
      tags:
      - Vocabulary Summary
