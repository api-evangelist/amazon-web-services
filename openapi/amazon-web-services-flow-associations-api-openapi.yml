openapi: 3.2.0
info:
  title: Amazon Web Services connect Flow Associations API
  description: Amazon Connect is a cloud-based contact center solution that you use to set up and manage a customer contact center and provide reliable customer engagement at any scale.
tags:
- name: Flow Associations
paths:
  /flow-associations/{InstanceId}:
    PUT:
      summary: Amazon Web Services Associateflow
      description: Associates a connect resource to a flow.
      operationId: amazonWebServicesAssociateFlow
      tags:
      - Flow Associations
  /flow-associations/{InstanceId}/{ResourceId}/{ResourceType}:
    GET:
      summary: Amazon Web Services Getflowassociation
      description: Retrieves the flow associated for a given resource.
      operationId: amazonWebServicesGetFlowAssociation
      tags:
      - Flow Associations
