openapi: 3.2.0
info:
  title: Amazon Web Services mediatailor Prefetch Schedule API
  description: Use the AWS Elemental MediaTailor SDKs and CLI to configure scalable ad insertion and linear channels.
tags:
- name: Prefetch Schedule
paths:
  /prefetchSchedule/{PlaybackConfigurationName}/{Name}:
    GET:
      summary: Amazon Web Services Getprefetchschedule
      description: Retrieves a prefetch schedule for a playback configuration. A prefetch schedule allows you to tell MediaTailor to fetch and prepare certain ads before an ad break happens. For more information about ad prefetching, see Using ad prefetching in the MediaTailor User Guide.
      operationId: amazonWebServicesGetPrefetchSchedule
      tags:
      - Prefetch Schedule
  /prefetchSchedule/{PlaybackConfigurationName}:
    POST:
      summary: Amazon Web Services Listprefetchschedules
      description: Lists the prefetch schedules for a playback configuration.
      operationId: amazonWebServicesListPrefetchSchedules
      tags:
      - Prefetch Schedule
