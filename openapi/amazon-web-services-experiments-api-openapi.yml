openapi: 3.2.0
info:
  title: Amazon Web Services fis Experiments API
  description: Fault Injection Simulator is a managed service that enables you to perform fault injection experiments on your Amazon Web Services workloads. For more information, see the Fault Injection Simulator User Guide.
tags:
- name: Experiments
paths:
  /experiments/{id}:
    DELETE:
      summary: Amazon Web Services Stopexperiment
      description: Stops the specified experiment.
      operationId: amazonWebServicesStopExperiment
      tags:
      - Experiments
  /experiments/{id}/targetAccountConfigurations/{accountId}:
    GET:
      summary: Amazon Web Services Getexperimenttargetaccountconfiguration
      description: Gets information about the specified target account configuration of the experiment.
      operationId: amazonWebServicesGetExperimentTargetAccountConfiguration
      tags:
      - Experiments
  /experiments/{id}/resolvedTargets:
    GET:
      summary: Amazon Web Services Listexperimentresolvedtargets
      description: Lists the resolved targets information of the specified experiment.
      operationId: amazonWebServicesListExperimentResolvedTargets
      tags:
      - Experiments
  /experiments/{id}/targetAccountConfigurations:
    GET:
      summary: Amazon Web Services Listexperimenttargetaccountconfigurations
      description: Lists the target account configurations of the specified experiment.
      operationId: amazonWebServicesListExperimentTargetAccountConfigurations
      tags:
      - Experiments
  /experiments:
    POST:
      summary: Amazon Web Services Startexperiment
      description: Starts running an experiment from the specified experiment template.
      operationId: amazonWebServicesStartExperiment
      tags:
      - Experiments
