openapi: 3.2.0
info:
  title: Amazon Web Services ssm-incidents List Incident Findings API
  description: Systems Manager Incident Manager is an incident management console designed to help users mitigate and recover from incidents affecting their Amazon Web Services-hosted applications.
tags:
- name: listIncidentFindings
paths:
  /listIncidentFindings:
    POST:
      summary: Amazon Web Services Listincidentfindings
      description: Retrieves a list of the IDs of findings, plus their last modified times, that have been identified for a specified incident. A finding represents a recent application environment change made by an CloudFormation stack creation or update or an CodeDeploy deployment that can be investigated as a potential cause of the incident.
      operationId: amazonWebServicesListIncidentFindings
      tags:
      - listIncidentFindings
