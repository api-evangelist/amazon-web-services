openapi: 3.2.0
info:
  title: Amazon Web Services connect Vocabulary API
  description: Amazon Connect is a cloud-based contact center solution that you use to set up and manage a customer contact center and provide reliable customer engagement at any scale.
tags:
- name: Vocabulary
paths:
  /vocabulary/{InstanceId}:
    POST:
      summary: Amazon Web Services Createvocabulary
      description: Creates a custom vocabulary associated with your Amazon Connect instance. You can set a custom vocabulary to be your default vocabulary for a given language. Contact Lens for Amazon Connect uses the default vocabulary in post-call and real-time contact analysis sessions for that language.
      operationId: amazonWebServicesCreateVocabulary
      tags:
      - Vocabulary
  /vocabulary/{InstanceId}/{VocabularyId}:
    GET:
      summary: Amazon Web Services Describevocabulary
      description: Describes the specified vocabulary.
      operationId: amazonWebServicesDescribeVocabulary
      tags:
      - Vocabulary
