openapi: 3.2.0
info:
  title: Amazon Web Services lakeformation Extend Transaction API
  description: 'Lake Formation

    Defines the public endpoint for the Lake Formation service.'
tags:
- name: ExtendTransaction
paths:
  /ExtendTransaction:
    POST:
      summary: Amazon Web Services Extendtransaction
      description: Indicates to the service that the specified transaction is still active and should not be treated as idle and aborted. Write transactions that remain idle for a long period are automatically aborted unless explicitly extended.
      operationId: amazonWebServicesExtendTransaction
      tags:
      - ExtendTransaction
