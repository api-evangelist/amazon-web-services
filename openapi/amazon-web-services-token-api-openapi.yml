openapi: 3.2.0
info:
  title: Amazon Web Services sso-oidc Token API
  description: IAM Identity Center OpenID Connect (OIDC) is a web service that enables a client (such as CLI or a native application) to register with IAM Identity Center.
tags:
- name: Token
paths:
  /token:
    POST:
      summary: Amazon Web Services Createtoken
      description: Creates and returns access and refresh tokens for clients that are authenticated using client secrets. The access token can be used to fetch short-term credentials for the assigned AWS accounts or to access application APIs using bearer authentication.
      operationId: amazonWebServicesCreateToken
      tags:
      - Token
