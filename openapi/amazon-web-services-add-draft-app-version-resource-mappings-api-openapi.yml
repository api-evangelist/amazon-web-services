openapi: 3.2.0
info:
  title: Amazon Web Services resiliencehub Add Draft App Version…
  description: Resilience Hub helps you proactively prepare and protect your Amazon Web Services applications from disruptions. It offers continual resiliency assessment and validation that integrates into your software development lifecycle. This enables you to uncover resiliency weaknesses, ensure recovery time objective (RTO) and recovery point objective (RPO) targets for your applications are met, and resolve issues before they are released into production.
tags:
- name: Add Draft App Version Resource Mappings
paths:
  /add-draft-app-version-resource-mappings:
    POST:
      summary: Amazon Web Services Adddraftappversionresourcemappings
      description: 'Adds the source of resource-maps to the draft version of an application. During assessment, Resilience Hub will use these resource-maps to resolve the latest physical ID for each resource in the application template. For more information about different types of resources suported by Resilience Hub and how to add them in your application, see Step 2: How is your application managed? in the Resilience Hub User Guide.'
      operationId: amazonWebServicesAddDraftAppVersionResourceMappings
      tags:
      - Add Draft App Version Resource Mappings
