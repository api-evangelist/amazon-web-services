openapi: 3.2.0
info:
  title: Amazon Web Services iot Effective Policies API
  description: 'IoT

    IoT provides secure, bi-directional communication between Internet-connected devices (such as sensors, actuators, embedded devices, or smart appliances) and the Amazon Web Services cloud.'
tags:
- name: Effective Policies
paths:
  /effective-policies:
    POST:
      summary: Amazon Web Services Geteffectivepolicies
      description: Gets a list of the policies that have an effect on the authorization behavior of the specified device when it connects to the IoT device gateway. Requires permission to access the GetEffectivePolicies action.
      operationId: amazonWebServicesGetEffectivePolicies
      tags:
      - Effective Policies
