openapi: 3.2.0
info:
  title: Amazon Web Services securityhub Products API
  description: Security Hub provides you with a comprehensive view of your security state in Amazon Web Services and helps you assess your Amazon Web Services environment against security industry standards and best practices.
tags:
- name: Products
paths:
  /products:
    GET:
      summary: Amazon Web Services Describeproducts
      description: Returns information about product integrations in Security Hub. You can optionally provide an integration ARN. If you provide an integration ARN, then the results only include that integration. If you do not provide an integration ARN, then the results include all of the available product integrations.
      operationId: amazonWebServicesDescribeProducts
      tags:
      - Products
