info:
  title: Amazon Web Services managedblockchain-query List…
  description: Amazon Managed Blockchain (AMB) Query provides you with convenient access to multi-blockchain network data, which makes it easier for you to extract contextual data related to blockchain activity.
tags:
- name: List Transactions
paths:
  /list-transactions:
    POST:
      summary: Amazon Web Services Listtransactions
      description: Lists all of the transactions on a given wallet address or to a specific contract.
      operationId: amazonWebServicesListTransactions
      tags:
      - List Transactions
  /ListTransactions:
    POST:
      summary: Amazon Web Services Listtransactions
      description: Returns metadata about transactions and their status. To prevent the response from growing indefinitely, only uncommitted transactions and those available for time-travel queries are returned. This operation can help you identify uncommitted transactions or to get information about transactions.
      operationId: amazonWebServicesListTransactions
      tags:
      - List Transactions
