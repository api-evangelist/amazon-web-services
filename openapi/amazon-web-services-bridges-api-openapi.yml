openapi: 3.2.0
info:
  title: Amazon Web Services mediaconnect Bridges API
  description: API for AWS Elemental MediaConnect
tags:
- name: Bridges
paths:
  /v1/bridges/{bridgeArn}/outputs:
    POST:
      summary: Amazon Web Services Addbridgeoutputs
      description: Adds outputs to an existing bridge.
      operationId: amazonWebServicesAddBridgeOutputs
      tags:
      - Bridges
  /v1/bridges/{bridgeArn}/sources:
    POST:
      summary: Amazon Web Services Addbridgesources
      description: Adds sources to an existing bridge.
      operationId: amazonWebServicesAddBridgeSources
      tags:
      - Bridges
  /v1/bridges:
    GET:
      summary: Amazon Web Services Listbridges
      description: Displays a list of bridges that are associated with this account and an optionally specified Arn. This request returns a paginated result.
      operationId: amazonWebServicesListBridges
      tags:
      - Bridges
  /v1/bridges/{bridgeArn}:
    PUT:
      summary: Amazon Web Services Updatebridge
      description: Updates the bridge
      operationId: amazonWebServicesUpdateBridge
      tags:
      - Bridges
  /v1/bridges/{bridgeArn}/outputs/{outputName}:
    PUT:
      summary: Amazon Web Services Updatebridgeoutput
      description: Updates an existing bridge output.
      operationId: amazonWebServicesUpdateBridgeOutput
      tags:
      - Bridges
  /v1/bridges/{bridgeArn}/sources/{sourceName}:
    PUT:
      summary: Amazon Web Services Updatebridgesource
      description: Updates an existing bridge source.
      operationId: amazonWebServicesUpdateBridgeSource
      tags:
      - Bridges
  /v1/bridges/{bridgeArn}/state:
    PUT:
      summary: Amazon Web Services Updatebridgestate
      description: Updates the bridge state
      operationId: amazonWebServicesUpdateBridgeState
      tags:
      - Bridges
