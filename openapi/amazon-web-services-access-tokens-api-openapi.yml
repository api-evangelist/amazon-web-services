openapi: 3.2.0
info:
  title: Amazon Web Services codecatalyst Access Tokens API
  description: Welcome to the Amazon CodeCatalyst API reference.
tags:
- name: Access Tokens
paths:
  /v1/accessTokens:
    POST:
      summary: Amazon Web Services Listaccesstokens
      description: Lists all personal access tokens (PATs) associated with the user who calls the API. You can only list PATs associated with your Amazon Web Services Builder ID.
      operationId: amazonWebServicesListAccessTokens
      tags:
      - Access Tokens
  /v1/accessTokens/{id}:
    DELETE:
      summary: Amazon Web Services Deleteaccesstoken
      description: Deletes a specified personal access token (PAT). A personal access token can only be deleted by the user who created it.
      operationId: amazonWebServicesDeleteAccessToken
      tags:
      - Access Tokens
