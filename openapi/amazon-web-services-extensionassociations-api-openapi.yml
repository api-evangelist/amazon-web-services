openapi: 3.2.0
info:
  title: Amazon Web Services appconfig Extensionassociations API
  description: Use AppConfig, a capability of Amazon Web Services Systems Manager, to create, manage, and quickly deploy application configurations.
tags:
- name: Extensionassociations
paths:
  /extensionassociations:
    GET:
      summary: Amazon Web Services Listextensionassociations
      description: Lists all AppConfig extension associations in the account. For more information about extensions and associations, see Working with AppConfig extensions in the AppConfig User Guide.
      operationId: amazonWebServicesListExtensionAssociations
      tags:
      - Extensionassociations
  /extensionassociations/{ExtensionAssociationId}:
    PATCH:
      summary: Amazon Web Services Updateextensionassociation
      description: Updates an association. For more information about extensions and associations, see Working with AppConfig extensions in the AppConfig User Guide.
      operationId: amazonWebServicesUpdateExtensionAssociation
      tags:
      - Extensionassociations
