openapi: 3.2.0
info:
  title: Amazon Web Services finspace Environment API
  description: The FinSpace management service provides the APIs for managing FinSpace environments.
tags:
- name: Environment
paths:
  /environment:
    GET:
      summary: Amazon Web Services Listenvironments
      description: A list of all of your FinSpace environments.
      operationId: amazonWebServicesListEnvironments
      tags:
      - Environment
  /environment/{environmentId}:
    PUT:
      summary: Amazon Web Services Updateenvironment
      description: Update your FinSpace environment.
      operationId: amazonWebServicesUpdateEnvironment
      tags:
      - Environment
