openapi: 3.2.0
info:
  title: Amazon Web Services dataexchange Data Sets API
  description: AWS Data Exchange is a service that makes it easy for AWS customers to exchange data in the cloud.
tags:
- name: Datasets
paths:
  /v1/data-sets:
    GET:
      summary: Amazon Web Services Listdatasets
      description: This operation lists your data sets. When listing by origin OWNED, results are sorted by CreatedAt in descending order. When listing by origin ENTITLED, there is no order and the maxResults parameter is ignored.
      operationId: amazonWebServicesListDataSets
      tags:
      - Datasets
  /v1/data-sets/{DataSetId}/revisions:
    GET:
      summary: Amazon Web Services Listdatasetrevisions
      description: This operation lists a data set's revisions sorted by CreatedAt in descending order.
      operationId: amazonWebServicesListDataSetRevisions
      tags:
      - Datasets
  /v1/data-sets/{DataSetId}/revisions/{RevisionId}/assets/{AssetId}:
    PATCH:
      summary: Amazon Web Services Updateasset
      description: This operation updates an asset.
      operationId: amazonWebServicesUpdateAsset
      tags:
      - Datasets
  /v1/data-sets/{DataSetId}:
    PATCH:
      summary: Amazon Web Services Updatedataset
      description: This operation updates a data set.
      operationId: amazonWebServicesUpdateDataSet
      tags:
      - Datasets
  /v1/data-sets/{DataSetId}/revisions/{RevisionId}:
    PATCH:
      summary: Amazon Web Services Updaterevision
      description: This operation updates a revision.
      operationId: amazonWebServicesUpdateRevision
      tags:
      - Datasets
  /v1/data-sets/{DataSetId}/revisions/{RevisionId}/assets:
    GET:
      summary: Amazon Web Services Listrevisionassets
      description: This operation lists a revision's assets sorted alphabetically in descending order.
      operationId: amazonWebServicesListRevisionAssets
      tags:
      - Datasets
  /v1/data-sets/{DataSetId}/revisions/{RevisionId}/revoke:
    POST:
      summary: Amazon Web Services Revokerevision
      description: This operation revokes subscribers' access to a revision.
      operationId: amazonWebServicesRevokeRevision
      tags:
      - Datasets
  /v1/data-sets/{DataSetId}/notification:
    POST:
      summary: Amazon Web Services Senddatasetnotification
      description: The type of event associated with the data set.
      operationId: amazonWebServicesSendDataSetNotification
      tags:
      - Datasets
  /datasets:
    GET:
      summary: Amazon Web Services Listdatasets
      description: Lists all of the DataBrew datasets.
      operationId: amazonWebServicesListDatasets
      tags:
      - Datasets
  /datasets/{name}:
    PUT:
      summary: Amazon Web Services Updatedataset
      description: Modifies the definition of an existing DataBrew dataset.
      operationId: amazonWebServicesUpdateDataset
      tags:
      - Datasets
  /datasets/{datasetId}/changesetsv2:
    GET:
      summary: Amazon Web Services Listchangesets
      description: Lists the FinSpace Changesets for a Dataset.
      operationId: amazonWebServicesListChangesets
      tags:
      - Datasets
  /datasets/{datasetId}/dataviewsv2:
    GET:
      summary: Amazon Web Services Listdataviews
      description: Lists all available Dataviews for a Dataset.
      operationId: amazonWebServicesListDataViews
      tags:
      - Datasets
  /datasets/{datasetId}/changesetsv2/{changesetId}:
    PUT:
      summary: Amazon Web Services Updatechangeset
      description: Updates a FinSpace Changeset.
      operationId: amazonWebServicesUpdateChangeset
      tags:
      - Datasets
  /datasets/{datasetId}/dataviewsv2/{dataviewId}:
    GET:
      summary: Amazon Web Services Getdataview
      description: Gets information about a Dataview.
      operationId: amazonWebServicesGetDataView
      tags:
      - Datasets
  /datasets/{datasetId}/dataviewsv2/{dataviewId}/external-access-details:
    POST:
      summary: Amazon Web Services Getexternaldataviewaccessdetails
      description: 'Returns the credentials to access the external Dataview from an S3 location. To call this API: You must retrieve the programmatic credentials. You must be a member of a FinSpace user group, where the dataset that you want to access has Read Dataset Data permissions.'
      operationId: amazonWebServicesGetExternalDataViewAccessDetails
      tags:
      - Datasets
  /datasets/{datasetName}/content:
    GET:
      summary: Amazon Web Services Getdatasetcontent
      description: Retrieves the contents of a dataset as presigned URIs.
      operationId: amazonWebServicesGetDatasetContent
      tags:
      - Datasets
  /datasets/{datasetName}:
    PUT:
      summary: Amazon Web Services Updatedataset
      description: Updates the settings of a dataset.
      operationId: amazonWebServicesUpdateDataset
      tags:
      - Datasets
  /datasets/{datasetName}/contents:
    GET:
      summary: Amazon Web Services Listdatasetcontents
      description: Lists information about dataset contents that have been created.
      operationId: amazonWebServicesListDatasetContents
      tags:
      - Datasets
