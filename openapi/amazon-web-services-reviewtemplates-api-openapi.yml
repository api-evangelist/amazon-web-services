openapi: 3.2.0
info:
  title: Amazon Web Services wellarchitected Review Templates API
  description: 'Well-Architected Tool

    This is the Well-Architected Tool API Reference. The WA Tool API provides programmatic access to the Well-Architected Tool in the Amazon Web Services Management Console. For information about the Well-Architected Tool, see the Well-Architected Tool User Guide.'
tags:
- name: reviewTemplates
paths:
  /reviewTemplates:
    GET:
      summary: Amazon Web Services Listreviewtemplates
      description: List review templates.
      operationId: amazonWebServicesListReviewTemplates
      tags:
      - reviewTemplates
  /reviewTemplates/{TemplateArn}:
    PATCH:
      summary: Amazon Web Services Updatereviewtemplate
      description: Update a review template.
      operationId: amazonWebServicesUpdateReviewTemplate
      tags:
      - reviewTemplates
  /reviewTemplates/{TemplateArn}/lensReviews/{LensAlias}/answers/{QuestionId}:
    PATCH:
      summary: Amazon Web Services Updatereviewtemplateanswer
      description: Update a review template answer.
      operationId: amazonWebServicesUpdateReviewTemplateAnswer
      tags:
      - reviewTemplates
  /reviewTemplates/{TemplateArn}/lensReviews/{LensAlias}:
    PATCH:
      summary: Amazon Web Services Updatereviewtemplatelensreview
      description: Update a lens review associated with a review template.
      operationId: amazonWebServicesUpdateReviewTemplateLensReview
      tags:
      - reviewTemplates
  /reviewTemplates/{TemplateArn}/lensReviews/{LensAlias}/answers:
    GET:
      summary: Amazon Web Services Listreviewtemplateanswers
      description: List the answers of a review template.
      operationId: amazonWebServicesListReviewTemplateAnswers
      tags:
      - reviewTemplates
  /reviewTemplates/{TemplateArn}/lensReviews/{LensAlias}/upgrade:
    PUT:
      summary: Amazon Web Services Upgradereviewtemplatelensreview
      description: Upgrade the lens review of a review template.
      operationId: amazonWebServicesUpgradeReviewTemplateLensReview
      tags:
      - reviewTemplates
