openapi: 3.2.0
info:
  title: Amazon Web Services devops-guru Event Sources API
  description: Amazon DevOps Guru is a fully managed service that helps you identify anomalous behavior in business critical operational applications.
tags:
- name: Event Sources
paths:
  /event-sources:
    PUT:
      summary: Amazon Web Services Updateeventsourcesconfig
      description: Enables or disables integration with a service that can be integrated with DevOps Guru. The one service that can be integrated with DevOps Guru is Amazon CodeGuru Profiler, which can produce proactive recommendations which can be stored and viewed in DevOps Guru.
      operationId: amazonWebServicesUpdateEventSourcesConfig
      tags:
      - Event Sources
