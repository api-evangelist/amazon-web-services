openapi: 3.2.0
info:
  title: Amazon Web Services Destinations API
  version: '1.0'
  description: 'Operations tagged Destinations across 2 of this provider''s published API definitions: iot-openapi-original.yml, iotwireless-openapi-original.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Destinations
paths:
  /destinations:
    PATCH:
      summary: Amazon Web Services Updatetopicruledestination
      description: Updates a topic rule destination. You use this to change the status, endpoint URL, or confirmation URL of the destination. Requires permission to access the UpdateTopicRuleDestination action.
      operationId: amazonWebServicesUpdateTopicRuleDestination
      tags:
      - Destinations
    GET:
      summary: Amazon Web Services Listdestinations
      description: Lists the destinations registered to your AWS account.
      operationId: amazonWebServicesListDestinations
      tags:
      - Destinations
  /destinations/{arn+}:
    GET:
      summary: Amazon Web Services Gettopicruledestination
      description: Gets information about a topic rule destination. Requires permission to access the GetTopicRuleDestination action.
      operationId: amazonWebServicesGetTopicRuleDestination
      tags:
      - Destinations
  /destinations/{Name}:
    PATCH:
      summary: Amazon Web Services Updatedestination
      description: Updates properties of a destination.
      operationId: amazonWebServicesUpdateDestination
      tags:
      - Destinations
x-refined-from:
- iot-openapi-original.yml
- iotwireless-openapi-original.yml
