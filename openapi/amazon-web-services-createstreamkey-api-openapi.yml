openapi: 3.2.0
info:
  title: Amazon Web Services ivs Create Stream Key API
  description: 'Introduction


    The Amazon Interactive Video Service (IVS) API is REST compatible, using a standard HTTP API and an Amazon Web Services EventBridge event stream for responses.'
tags:
- name: CreateStreamKey
paths:
  /CreateStreamKey:
    POST:
      summary: Amazon Web Services Createstreamkey
      description: Creates a stream key, used to initiate a stream, for the specified channel ARN. Note that CreateChannel creates a stream key. If you subsequently use CreateStreamKey on the same channel, it will fail because a stream key already exists and there is a limit of 1 stream key per channel. To reset the stream key on a channel, use DeleteStreamKey and then CreateStreamKey.
      operationId: amazonWebServicesCreateStreamKey
      tags:
      - CreateStreamKey
