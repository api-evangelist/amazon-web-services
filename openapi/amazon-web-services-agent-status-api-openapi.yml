openapi: 3.2.0
info:
  title: Amazon Web Services connect Agent Status API
  description: Amazon Connect is a cloud-based contact center solution that you use to set up and manage a customer contact center and provide reliable customer engagement at any scale.
tags:
- name: Agent Status
paths:
  /agent-status/{InstanceId}:
    GET:
      summary: Amazon Web Services Listagentstatuses
      description: This API is in preview release for Amazon Connect and is subject to change. Lists agent statuses.
      operationId: amazonWebServicesListAgentStatuses
      tags:
      - Agent Status
  /agent-status/{InstanceId}/{AgentStatusId}:
    POST:
      summary: Amazon Web Services Updateagentstatus
      description: This API is in preview release for Amazon Connect and is subject to change. Updates agent status.
      operationId: amazonWebServicesUpdateAgentStatus
      tags:
      - Agent Status
