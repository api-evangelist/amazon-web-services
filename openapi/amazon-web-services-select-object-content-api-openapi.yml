openapi: 3.2.0
info:
  title: Amazon Web Services AWS S3 Select Object Content. API
  description: 'The API for Amazon Simple Storage Service (Amazon S3) provides an object

    storage solution with top-notch scalability, data availability, security,

    and performance. It caters to customers of varying sizes and industries,

    offering the ability to store and secure any volume of data for a wide

    range of purposes, including data lakes, cloud-native applications, and

    mobile apps.'
tags:
- name: Select Object Content.
paths:
  /{Bucket}/{Key+}?select&select-type=2:
    POST:
      summary: Amazon Web Services Select Object Content
      description: This operation is not supported by directory buckets This action filters the contents of an Amazon S3 object based on a simple structured query language (SQL) statement
      tags:
      - Select Object Content.
      operationId: selectObjectContent
