openapi: 3.2.0
info:
  title: Amazon Web Services macie2 Custom Data Identifiers API
  description: Amazon Macie is a fully managed data security and data privacy service that uses machine learning and pattern matching to help you discover and protect your sensitive data in AWS.
tags:
- name: Custom Data Identifiers
paths:
  /custom-data-identifiers/get:
    POST:
      summary: Amazon Web Services Batchgetcustomdataidentifiers
      description: Retrieves information about one or more custom data identifiers.
      operationId: amazonWebServicesBatchGetCustomDataIdentifiers
      tags:
      - Custom Data Identifiers
  /custom-data-identifiers:
    POST:
      summary: Amazon Web Services Createcustomdataidentifier
      description: Creates and defines the criteria and other settings for a custom data identifier.
      operationId: amazonWebServicesCreateCustomDataIdentifier
      tags:
      - Custom Data Identifiers
  /custom-data-identifiers/{id}:
    GET:
      summary: Amazon Web Services Getcustomdataidentifier
      description: Retrieves the criteria and other settings for a custom data identifier.
      operationId: amazonWebServicesGetCustomDataIdentifier
      tags:
      - Custom Data Identifiers
  /custom-data-identifiers/list:
    POST:
      summary: Amazon Web Services Listcustomdataidentifiers
      description: Retrieves a subset of information about all the custom data identifiers for an account.
      operationId: amazonWebServicesListCustomDataIdentifiers
      tags:
      - Custom Data Identifiers
  /custom-data-identifiers/test:
    POST:
      summary: Amazon Web Services Testcustomdataidentifier
      description: Tests a custom data identifier.
      operationId: amazonWebServicesTestCustomDataIdentifier
      tags:
      - Custom Data Identifiers
