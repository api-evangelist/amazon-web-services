openapi: 3.2.0
info:
  title: Amazon Web Services route53-recovery-readiness…
  description: Recovery readiness
tags:
- name: Recoverygroups
paths:
  /recoverygroups:
    GET:
      summary: Amazon Web Services Listrecoverygroups
      description: Lists the recovery groups in an account.
      operationId: amazonWebServicesListRecoveryGroups
      tags:
      - Recoverygroups
  /recoverygroups/{recoveryGroupName}:
    PUT:
      summary: Amazon Web Services Updaterecoverygroup
      description: Updates a recovery group.
      operationId: amazonWebServicesUpdateRecoveryGroup
      tags:
      - Recoverygroups
  /recoverygroups/{recoveryGroupName}/architectureRecommendations:
    GET:
      summary: Amazon Web Services Getarchitecturerecommendations
      description: Gets recommendations about architecture designs for improving resiliency for an application, based on a recovery group.
      operationId: amazonWebServicesGetArchitectureRecommendations
      tags:
      - Recoverygroups
