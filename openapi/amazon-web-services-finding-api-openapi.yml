openapi: 3.2.0
info:
  title: Amazon Web Services accessanalyzer Finding API
  description: Identity and Access Management Access Analyzer helps you to set, verify, and refine your IAM policies by providing a suite of capabilities.
tags:
- name: Finding
paths:
  /finding/{id}:
    GET:
      summary: Amazon Web Services Getfinding
      description: Retrieves information about the specified finding.
      operationId: amazonWebServicesGetFinding
      tags:
      - Finding
  /finding:
    PUT:
      summary: Amazon Web Services Updatefindings
      description: Updates the status for the specified findings.
      operationId: amazonWebServicesUpdateFindings
      tags:
      - Finding
