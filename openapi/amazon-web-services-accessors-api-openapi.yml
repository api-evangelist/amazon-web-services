openapi: 3.2.0
info:
  title: Amazon Web Services managedblockchain Accessors API
  description: Amazon Managed Blockchain is a fully managed service for creating and managing blockchain networks using open-source frameworks.
tags:
- name: Accessors
paths:
  /accessors:
    GET:
      summary: Amazon Web Services Listaccessors
      description: Returns a list of the accessors and their properties. Accessor objects are containers that have the information required for token based access to your Ethereum nodes.
      operationId: amazonWebServicesListAccessors
      tags:
      - Accessors
  /accessors/{AccessorId}:
    GET:
      summary: Amazon Web Services Getaccessor
      description: Returns detailed information about an accessor. An accessor object is a container that has the information required for token based access to your Ethereum nodes.
      operationId: amazonWebServicesGetAccessor
      tags:
      - Accessors
