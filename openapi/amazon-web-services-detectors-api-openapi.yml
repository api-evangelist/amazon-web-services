openapi: 3.2.0
info:
  title: Amazon Web Services iotevents-data Detectors API
  description: 'IoT Events monitors your equipment or device fleets for failures or changes in operation, and triggers actions when such events occur. You can use IoT Events Data API commands to send inputs to detectors, list detectors, and view or update a detector''s status.


    For more information, see What is IoT Events? in the IoT Events Developer Guide.'
tags:
- name: Detectors
paths:
  /detectors/delete:
    POST:
      summary: Amazon Web Services Batchdeletedetector
      description: Deletes one or more detectors that were created. When a detector is deleted, its state will be cleared and the detector will be removed from the list of detectors. The deleted detector will no longer appear if referenced in the ListDetectors API call.
      operationId: amazonWebServicesBatchDeleteDetector
      tags:
      - Detectors
  /detectors:
    POST:
      summary: Amazon Web Services Batchupdatedetector
      description: Updates the state, variable values, and timer settings of one or more detectors (instances) of a specified detector model.
      operationId: amazonWebServicesBatchUpdateDetector
      tags:
      - Detectors
  /detectors/{detectorModelName}/keyValues/:
    GET:
      summary: Amazon Web Services Describedetector
      description: Returns information about the specified detector (instance).
      operationId: amazonWebServicesDescribeDetector
      tags:
      - Detectors
  /detectors/{detectorModelName}:
    GET:
      summary: Amazon Web Services Listdetectors
      description: Lists detectors (the instances of a detector model).
      operationId: amazonWebServicesListDetectors
      tags:
      - Detectors
