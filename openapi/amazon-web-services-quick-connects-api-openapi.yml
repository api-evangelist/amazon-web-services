openapi: 3.2.0
info:
  title: Amazon Web Services connect Quick Connects API
  description: Amazon Connect is a cloud-based contact center solution that you use to set up and manage a customer contact center and provide reliable customer engagement at any scale.
tags:
- name: Quick Connects
paths:
  /quick-connects/{InstanceId}:
    GET:
      summary: Amazon Web Services Listquickconnects
      description: Provides information about the quick connects for the specified Amazon Connect instance.
      operationId: amazonWebServicesListQuickConnects
      tags:
      - Quick Connects
  /quick-connects/{InstanceId}/{QuickConnectId}:
    GET:
      summary: Amazon Web Services Describequickconnect
      description: Describes the quick connect.
      operationId: amazonWebServicesDescribeQuickConnect
      tags:
      - Quick Connects
  /quick-connects/{InstanceId}/{QuickConnectId}/config:
    POST:
      summary: Amazon Web Services Updatequickconnectconfig
      description: Updates the configuration settings for the specified quick connect.
      operationId: amazonWebServicesUpdateQuickConnectConfig
      tags:
      - Quick Connects
  /quick-connects/{InstanceId}/{QuickConnectId}/name:
    POST:
      summary: Amazon Web Services Updatequickconnectname
      description: Updates the name and description of a quick connect. The request accepts the following data in JSON format. At least Name or Description must be provided.
      operationId: amazonWebServicesUpdateQuickConnectName
      tags:
      - Quick Connects
