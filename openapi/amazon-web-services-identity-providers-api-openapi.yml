openapi: 3.2.0
info:
  title: Amazon Web Services workspaces-web Identity Providers API
  description: WorkSpaces Web is a low cost, fully managed WorkSpace built specifically to facilitate secure, web-based workloads.
tags:
- name: Identity Providers
paths:
  /identityProviders:
    POST:
      summary: Amazon Web Services Createidentityprovider
      description: Creates an identity provider resource that is then associated with a web portal.
      operationId: amazonWebServicesCreateIdentityProvider
      tags:
      - Identity Providers
  /identityProviders/{identityProviderArn+}:
    PATCH:
      summary: Amazon Web Services Updateidentityprovider
      description: Updates the identity provider.
      operationId: amazonWebServicesUpdateIdentityProvider
      tags:
      - Identity Providers
