openapi: 3.2.0
info:
  title: Amazon Web Services AWS S3 Multipart Uploads API
  description: 'The API for Amazon Simple Storage Service (Amazon S3) provides an object

    storage solution with top-notch scalability, data availability, security,

    and performance. It caters to customers of varying sizes and industries,

    offering the ability to store and secure any volume of data for a wide

    range of purposes, including data lakes, cloud-native applications, and

    mobile apps.'
tags:
- name: Multipart Uploads
paths:
  /{Bucket}?uploads:
    GET:
      summary: Amazon Web Services List Multipart Uploads
      description: This operation lists in-progress multipart uploads in a bucket An in-progress multipart upload is a multipart upload that has been initiated by the CreateMultipartUpload request, but has not yet been completed or aborted.
      tags:
      - Multipart Uploads
      operationId: listMultipartUploads
