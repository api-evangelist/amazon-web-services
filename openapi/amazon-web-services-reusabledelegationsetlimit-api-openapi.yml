openapi: 3.2.0
info:
  title: Amazon Web Services route53 Reusabledelegationsetlimit API
  description: 'Amazon Route 53 is a highly available and scalable Domain Name System (DNS) web service.


    You can use Route 53 to:


    Register domain names.


    For more information, see How domain registration works.


    Route internet traffic to the resources for your domain


    For more information, see How internet traffic is routed to your website or web application.


    Check the health of your resources.


    For more information, see How Route 53 checks the health of your resources.'
tags:
- name: Reusabledelegationsetlimit
paths:
  /2013-04-01/reusabledelegationsetlimit/{Id}/{Type}:
    GET:
      summary: Amazon Web Services Getreusabledelegationsetlimit
      description: Gets the maximum number of hosted zones that you can associate with the specified reusable delegation set. For the default limit, see Limits in the Amazon Route 53 Developer Guide. To request a higher limit, open a case.
      operationId: amazonWebServicesGetReusableDelegationSetLimit
      tags:
      - Reusabledelegationsetlimit
