openapi: 3.2.0
info:
  title: Amazon Web Services AWS S3 Bucket Logging API
  description: 'The API for Amazon Simple Storage Service (Amazon S3) provides an object

    storage solution with top-notch scalability, data availability, security,

    and performance. It caters to customers of varying sizes and industries,

    offering the ability to store and secure any volume of data for a wide

    range of purposes, including data lakes, cloud-native applications, and

    mobile apps.'
tags:
- name: Bucket Logging
paths:
  /{Bucket}?logging:
    PUT:
      summary: Amazon Web Services Put Bucket Logging
      description: This operation is not supported by directory buckets Set the logging parameters for a bucket and to specify permissions for who can view and modify the logging parameters
      tags:
      - Bucket Logging
      operationId: putBucketLogging
