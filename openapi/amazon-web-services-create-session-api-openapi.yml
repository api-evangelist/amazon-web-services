openapi: 3.2.0
info:
  title: Amazon Web Services AWS S3 Create Session API
  description: 'The API for Amazon Simple Storage Service (Amazon S3) provides an object

    storage solution with top-notch scalability, data availability, security,

    and performance. It caters to customers of varying sizes and industries,

    offering the ability to store and secure any volume of data for a wide

    range of purposes, including data lakes, cloud-native applications, and

    mobile apps.'
tags:
- name: Create Session
paths:
  /{Bucket}?session:
    GET:
      summary: Amazon Web Services Create Session
      description: Creates a session that establishes temporary security credentials to support fast authentication and authorization for the Zonal endpoint APIs on directory buckets For more information about Zonal endpoint APIs that include the Availability Zone in the request endpoint, see .
      tags:
      - Create Session
      operationId: createSession
