openapi: 3.2.0
info:
  title: Amazon Web Services Backup Jobs API
  version: '1.0'
  description: 'Operations tagged Backup Jobs across 2 of this provider''s published API definitions: backup-openapi-original.yml, backupstorage-openapi-original.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Backup Jobs
paths:
  /backup-jobs/{backupJobId}:
    POST:
      summary: Amazon Web Services Stopbackupjob
      description: 'Attempts to cancel a job to create a one-time backup of a resource. This action is not supported for the following services: Amazon FSx for Windows File Server, Amazon FSx for Lustre, FSx for ONTAP , Amazon FSx for OpenZFS, Amazon DocumentDB (with MongoDB compatibility), Amazon RDS, Amazon Aurora, and Amazon Neptune.'
      operationId: amazonWebServicesStopBackupJob
      tags:
      - Backup Jobs
  /backup-jobs/:
    GET:
      summary: Amazon Web Services Listbackupjobs
      description: Returns a list of existing backup jobs for an authenticated account for the last 30 days. For a longer period of time, consider using these monitoring tools.
      operationId: amazonWebServicesListBackupJobs
      tags:
      - Backup Jobs
  /backup-jobs:
    PUT:
      summary: Amazon Web Services Startbackupjob
      description: Starts an on-demand backup job for the specified resource.
      operationId: amazonWebServicesStartBackupJob
      tags:
      - Backup Jobs
  /backup-jobs/{jobId}/object/{objectName}:
    PUT:
      summary: Amazon Web Services Startobject
      description: Start upload containing one or many chunks.
      operationId: amazonWebServicesStartObject
      tags:
      - Backup Jobs
  /backup-jobs/{jobId}/object/{uploadId}/complete:
    PUT:
      summary: Amazon Web Services Notifyobjectcomplete
      description: Complete upload
      operationId: amazonWebServicesNotifyObjectComplete
      tags:
      - Backup Jobs
  /backup-jobs/{jobId}/chunk/{uploadId}/{chunkIndex}:
    PUT:
      summary: Amazon Web Services Putchunk
      description: Upload chunk.
      operationId: amazonWebServicesPutChunk
      tags:
      - Backup Jobs
  /backup-jobs/{jobId}/object/{objectName}/put-object:
    PUT:
      summary: Amazon Web Services Putobject
      description: Upload object that can store object metadata String and data blob in single API call using inline chunk field.
      operationId: amazonWebServicesPutObject
      tags:
      - Backup Jobs
x-refined-from:
- backup-openapi-original.yml
- backupstorage-openapi-original.yml
