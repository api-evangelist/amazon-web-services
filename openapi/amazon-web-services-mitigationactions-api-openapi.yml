openapi: 3.2.0
info:
  title: Amazon Web Services iot Mitigationactions API
  description: 'IoT

    IoT provides secure, bi-directional communication between Internet-connected devices (such as sensors, actuators, embedded devices, or smart appliances) and the Amazon Web Services cloud.'
tags:
- name: Mitigationactions
paths:
  /mitigationactions/actions/{actionName}:
    PATCH:
      summary: Amazon Web Services Updatemitigationaction
      description: Updates the definition for the specified mitigation action. Requires permission to access the UpdateMitigationAction action.
      operationId: amazonWebServicesUpdateMitigationAction
      tags:
      - Mitigationactions
  /mitigationactions/actions:
    GET:
      summary: Amazon Web Services Listmitigationactions
      description: Gets a list of all mitigation actions that match the specified filter criteria. Requires permission to access the ListMitigationActions action.
      operationId: amazonWebServicesListMitigationActions
      tags:
      - Mitigationactions
