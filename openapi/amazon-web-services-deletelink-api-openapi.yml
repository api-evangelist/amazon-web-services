openapi: 3.2.0
info:
  title: Amazon Web Services oam Delete Link API
  description: Use Amazon CloudWatch Observability Access Manager to create and manage links between source accounts and monitoring accounts by using CloudWatch cross-account observability.
tags:
- name: DeleteLink
paths:
  /DeleteLink:
    POST:
      summary: Amazon Web Services Deletelink
      description: Deletes a link between a monitoring account sink and a source account. You must run this operation in the source account.
      operationId: amazonWebServicesDeleteLink
      tags:
      - DeleteLink
