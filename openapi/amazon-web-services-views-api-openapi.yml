openapi: 3.2.0
info:
  title: Amazon Web Services connect Views API
  description: Amazon Connect is a cloud-based contact center solution that you use to set up and manage a customer contact center and provide reliable customer engagement at any scale.
tags:
- name: Views
paths:
  /views/{InstanceId}:
    GET:
      summary: Amazon Web Services Listviews
      description: Returns views in the given instance. Results are sorted primarily by type, and secondarily by name.
      operationId: amazonWebServicesListViews
      tags:
      - Views
  /views/{InstanceId}/{ViewId}/versions:
    GET:
      summary: Amazon Web Services Listviewversions
      description: Returns all the available versions for the specified Amazon Connect instance and view identifier. Results will be sorted from highest to lowest.
      operationId: amazonWebServicesListViewVersions
      tags:
      - Views
  /views/{InstanceId}/{ViewId}:
    POST:
      summary: Amazon Web Services Updateviewcontent
      description: Updates the view content of the given view identifier in the specified Amazon Connect instance. It performs content validation if Status is set to SAVED and performs full content validation if Status is PUBLISHED. Note that the $SAVED alias' content will always be updated, but the $LATEST alias' content will only be updated if Status is PUBLISHED.
      operationId: amazonWebServicesUpdateViewContent
      tags:
      - Views
  /views/{InstanceId}/{ViewId}/versions/{ViewVersion}:
    DELETE:
      summary: Amazon Web Services Deleteviewversion
      description: Deletes the particular version specified in ViewVersion identifier.
      operationId: amazonWebServicesDeleteViewVersion
      tags:
      - Views
  /views/{InstanceId}/{ViewId}/metadata:
    POST:
      summary: Amazon Web Services Updateviewmetadata
      description: Updates the view metadata. Note that either Name or Description must be provided.
      operationId: amazonWebServicesUpdateViewMetadata
      tags:
      - Views
