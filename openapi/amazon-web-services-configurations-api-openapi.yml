openapi: 3.2.0
info:
  title: Amazon Web Services Configurations API
  version: '1.0'
  description: 'Operations tagged Configurations across 2 of this provider''s published API definitions: kafka-openapi-original.yml, mq-openapi-original.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Configurations
paths:
  /v1/configurations:
    GET:
      summary: Amazon Web Services Listconfigurations
      description: Returns a list of all the MSK configurations in this Region.
      operationId: amazonWebServicesListConfigurations
      tags:
      - Configurations
  /v1/configurations/{arn}:
    PUT:
      summary: Amazon Web Services Updateconfiguration
      description: Updates an existing MSK configuration. The configuration must be in the Active state.
      operationId: amazonWebServicesUpdateConfiguration
      tags:
      - Configurations
  /v1/configurations/{arn}/revisions/{revision}:
    GET:
      summary: Amazon Web Services Describeconfigurationrevision
      description: Returns a description of this revision of the configuration.
      operationId: amazonWebServicesDescribeConfigurationRevision
      tags:
      - Configurations
  /v1/configurations/{arn}/revisions:
    GET:
      summary: Amazon Web Services Listconfigurationrevisions
      description: Returns a list of all the revisions of an MSK configuration.
      operationId: amazonWebServicesListConfigurationRevisions
      tags:
      - Configurations
  /v1/configurations/{configuration-id}:
    PUT:
      summary: Amazon Web Services Updateconfiguration
      description: Updates the specified configuration.
      operationId: amazonWebServicesUpdateConfiguration
      tags:
      - Configurations
  /v1/configurations/{configuration-id}/revisions/{configuration-revision}:
    GET:
      summary: Amazon Web Services Describeconfigurationrevision
      description: Returns the specified configuration revision for the specified configuration.
      operationId: amazonWebServicesDescribeConfigurationRevision
      tags:
      - Configurations
  /v1/configurations/{configuration-id}/revisions:
    GET:
      summary: Amazon Web Services Listconfigurationrevisions
      description: Returns a list of all revisions for the specified configuration.
      operationId: amazonWebServicesListConfigurationRevisions
      tags:
      - Configurations
x-refined-from:
- kafka-openapi-original.yml
- mq-openapi-original.yml
