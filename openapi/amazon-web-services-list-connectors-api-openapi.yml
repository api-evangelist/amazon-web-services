openapi: 3.2.0
info:
  title: Amazon Web Services appflow List Connectors API
  description: Welcome to the Amazon AppFlow API reference.
tags:
- name: List Connectors
paths:
  /list-connectors:
    POST:
      summary: Amazon Web Services Listconnectors
      description: Returns the list of all registered custom connectors in your Amazon Web Services account. This API lists only custom connectors registered in this account, not the Amazon Web Services authored connectors.
      operationId: amazonWebServicesListConnectors
      tags:
      - List Connectors
  /ListConnectors:
    POST:
      summary: Amazon Web Services Listconnectors
      description: List Connectors.
      operationId: amazonWebServicesListConnectors
      tags:
      - List Connectors
