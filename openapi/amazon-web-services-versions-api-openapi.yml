openapi: 3.2.0
info:
  title: Amazon Web Services grafana Versions API
  description: Amazon Managed Grafana is a fully managed and secure data visualization service that you can use to instantly query, correlate, and visualize operational metrics, logs, and traces from multiple sources.
tags:
- name: Versions
paths:
  /versions:
    GET:
      summary: Amazon Web Services Listversions
      description: Lists available versions of Grafana. These are available when calling CreateWorkspace. Optionally, include a workspace to list the versions to which it can be upgraded.
      operationId: amazonWebServicesListVersions
      tags:
      - Versions
