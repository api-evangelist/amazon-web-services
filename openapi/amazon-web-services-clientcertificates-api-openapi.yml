openapi: 3.2.0
info:
  title: Amazon Web Services apigateway Clientcertificates API
  description: 'Amazon API Gateway

    Amazon API Gateway helps developers deliver robust, secure, and scalable mobile and web application back ends. API Gateway allows developers to securely connect mobile and web applications to APIs that run on Lambda, Amazon EC2, or other publicly addressable web services that are hosted outside of AWS.'
tags:
- name: Clientcertificates
paths:
  /clientcertificates/{clientcertificate_id}:
    PATCH:
      summary: Amazon Web Services Updateclientcertificate
      description: Changes information about an ClientCertificate resource.
      operationId: amazonWebServicesUpdateClientCertificate
      tags:
      - Clientcertificates
  /clientcertificates:
    GET:
      summary: Amazon Web Services Getclientcertificates
      description: Gets a collection of ClientCertificate resources.
      operationId: amazonWebServicesGetClientCertificates
      tags:
      - Clientcertificates
