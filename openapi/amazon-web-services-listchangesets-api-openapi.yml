openapi: 3.2.0
info:
  title: Amazon Web Services marketplace-catalog List Change Sets API
  description: 'Catalog API actions allow you to manage your entities through list, describe, and update capabilities. An entity can be a product or an offer on AWS Marketplace.


    You can automate your entity update process by integrating the AWS Marketplace Catalog API with your AWS Marketplace product build or deployment pipelines. You can also create your own applications on top of the Catalog API to manage your products on AWS Marketplace.'
tags:
- name: ListChangeSets
paths:
  /ListChangeSets:
    POST:
      summary: Amazon Web Services Listchangesets
      description: Returns the list of change sets owned by the account being used to make the call. You can filter this list by providing any combination of entityId, ChangeSetName, and status. If you provide more than one filter, the API operation applies a logical AND between the filters. You can describe a change during the 60-day request history retention period for API calls.
      operationId: amazonWebServicesListChangeSets
      tags:
      - ListChangeSets
