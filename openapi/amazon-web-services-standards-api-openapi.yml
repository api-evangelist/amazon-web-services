openapi: 3.2.0
info:
  title: Amazon Web Services securityhub Standards API
  description: Security Hub provides you with a comprehensive view of your security state in Amazon Web Services and helps you assess your Amazon Web Services environment against security industry standards and best practices.
tags:
- name: Standards
paths:
  /standards/deregister:
    POST:
      summary: Amazon Web Services Batchdisablestandards
      description: Disables the standards specified by the provided StandardsSubscriptionArns. For more information, see Security Standards section of the Security Hub User Guide.
      operationId: amazonWebServicesBatchDisableStandards
      tags:
      - Standards
  /standards/register:
    POST:
      summary: Amazon Web Services Batchenablestandards
      description: Enables the standards specified by the provided StandardsArn. To obtain the ARN for a standard, use the DescribeStandards operation. For more information, see the Security Standards section of the Security Hub User Guide.
      operationId: amazonWebServicesBatchEnableStandards
      tags:
      - Standards
  /standards:
    GET:
      summary: Amazon Web Services Describestandards
      description: Returns a list of the available standards in Security Hub. For each standard, the results include the standard ARN, the name, and a description.
      operationId: amazonWebServicesDescribeStandards
      tags:
      - Standards
  /standards/controls/{StandardsSubscriptionArn+}:
    GET:
      summary: Amazon Web Services Describestandardscontrols
      description: Returns a list of security standards controls. For each control, the results include information about whether it is currently enabled, the severity, and a link to remediation information.
      operationId: amazonWebServicesDescribeStandardsControls
      tags:
      - Standards
  /standards/get:
    POST:
      summary: Amazon Web Services Getenabledstandards
      description: Returns a list of the standards that are currently enabled.
      operationId: amazonWebServicesGetEnabledStandards
      tags:
      - Standards
  /standards/control/{StandardsControlArn+}:
    PATCH:
      summary: Amazon Web Services Updatestandardscontrol
      description: Used to control whether an individual security standard control is enabled or disabled.
      operationId: amazonWebServicesUpdateStandardsControl
      tags:
      - Standards
