info:
  title: Amazon Web Services robomaker Sync Deployment Job API
  description: This section provides documentation for the AWS RoboMaker API operations.
tags:
- name: Sync Deployment Job
paths:
  /syncDeploymentJob:
    POST:
      summary: Amazon Web Services Syncdeploymentjob
      description: Syncrhonizes robots in a fleet to the latest deployment. This is helpful if robots were added after a deployment. This API will no longer be supported as of May 2, 2022. Use it to remove resources that were created for Deployment Service.
      operationId: amazonWebServicesSyncDeploymentJob
      tags:
      - Sync Deployment Job
