openapi: 3.2.0
info:
  title: Amazon Web Services iot Cacertificates API
  description: 'IoT

    IoT provides secure, bi-directional communication between Internet-connected devices (such as sensors, actuators, embedded devices, or smart appliances) and the Amazon Web Services cloud.'
tags:
- name: Cacertificates
paths:
  /cacertificates:
    GET:
      summary: Amazon Web Services Listcacertificates
      description: Lists the CA certificates registered for your Amazon Web Services account. The results are paginated with a default page size of 25. You can use the returned marker to retrieve additional results. Requires permission to access the ListCACertificates action.
      operationId: amazonWebServicesListCACertificates
      tags:
      - Cacertificates
