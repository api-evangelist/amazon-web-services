openapi: 3.2.0
info:
  title: Amazon Web Services workdocs Document Versions API
  description: 'The Amazon WorkDocs API is designed for the following use cases:


    File Migration: File migration applications are supported for users who want to migrate their files from an on-premises or off-premises file system or service.'
tags:
- name: Document Versions
paths:
  /api/v1/documentVersions/{DocumentId}/versions/{VersionId}:
    DELETE:
      summary: Amazon Web Services Deletedocumentversion
      description: Deletes a specific version of a document.
      operationId: amazonWebServicesDeleteDocumentVersion
      tags:
      - Document Versions
  /api/v1/documentVersions/restore/{DocumentId}:
    POST:
      summary: Amazon Web Services Restoredocumentversions
      description: Recovers a deleted version of an Amazon WorkDocs document.
      operationId: amazonWebServicesRestoreDocumentVersions
      tags:
      - Document Versions
