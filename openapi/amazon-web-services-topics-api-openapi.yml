openapi: 3.2.0
info:
  title: Amazon Web Services iot-data Topics API
  description: 'IoT data

    IoT data enables secure, bi-directional communication between Internet-connected things (such as sensors, actuators, embedded devices, or smart appliances) and the Amazon Web Services cloud.'
tags:
- name: Topics
paths:
  /topics/{topic}:
    POST:
      summary: Amazon Web Services Publish
      description: Publishes an MQTT message. Requires permission to access the Publish action. For more information about MQTT messages, see MQTT Protocol in the IoT Developer Guide. For more information about messaging costs, see Amazon Web Services IoT Core pricing - Messaging.
      operationId: amazonWebServicesPublish
      tags:
      - Topics
