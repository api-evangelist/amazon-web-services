openapi: 3.2.0
info:
  title: Amazon Web Services iot Role Aliases API
  description: 'IoT

    IoT provides secure, bi-directional communication between Internet-connected devices (such as sensors, actuators, embedded devices, or smart appliances) and the Amazon Web Services cloud.'
tags:
- name: Role Aliases
paths:
  /role-aliases/{roleAlias}:
    PUT:
      summary: Amazon Web Services Updaterolealias
      description: Updates a role alias. Requires permission to access the UpdateRoleAlias action.
      operationId: amazonWebServicesUpdateRoleAlias
      tags:
      - Role Aliases
  /role-aliases:
    GET:
      summary: Amazon Web Services Listrolealiases
      description: Lists the role aliases registered in your account. Requires permission to access the ListRoleAliases action.
      operationId: amazonWebServicesListRoleAliases
      tags:
      - Role Aliases
