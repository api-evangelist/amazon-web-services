openapi: 3.2.0
info:
  title: Amazon Web Services route53 Trafficpolicies API
  description: 'Amazon Route 53 is a highly available and scalable Domain Name System (DNS) web service.


    You can use Route 53 to:


    Register domain names.


    For more information, see How domain registration works.


    Route internet traffic to the resources for your domain


    For more information, see How internet traffic is routed to your website or web application.


    Check the health of your resources.


    For more information, see How Route 53 checks the health of your resources.'
tags:
- name: Trafficpolicies
paths:
  /2013-04-01/trafficpolicies:
    GET:
      summary: Amazon Web Services Listtrafficpolicies
      description: Gets information about the latest version for every traffic policy that is associated with the current Amazon Web Services account. Policies are listed in the order that they were created in. For information about how of deleting a traffic policy affects the response from ListTrafficPolicies, see DeleteTrafficPolicy.
      operationId: amazonWebServicesListTrafficPolicies
      tags:
      - Trafficpolicies
  /2013-04-01/trafficpolicies/{Id}/versions:
    GET:
      summary: Amazon Web Services Listtrafficpolicyversions
      description: Gets information about all of the versions for a specified traffic policy. Traffic policy versions are listed in numerical order by VersionNumber.
      operationId: amazonWebServicesListTrafficPolicyVersions
      tags:
      - Trafficpolicies
