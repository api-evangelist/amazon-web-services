info:
  title: Amazon Web Services iot Policy Principals API
  description: 'IoT

    IoT provides secure, bi-directional communication between Internet-connected devices (such as sensors, actuators, embedded devices, or smart appliances) and the Amazon Web Services cloud.'
tags:
- name: Policy Principals
paths:
  /policy-principals:
    GET:
      summary: Amazon Web Services Listpolicyprincipals
      description: 'Lists the principals associated with the specified policy. Note: This action is deprecated and works as expected for backward compatibility, but we won''t add enhancements. Use ListTargetsForPolicy instead. Requires permission to access the ListPolicyPrincipals action.'
      operationId: amazonWebServicesListPolicyPrincipals
      tags:
      - Policy Principals
