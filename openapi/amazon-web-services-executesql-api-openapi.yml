openapi: 3.2.0
info:
  title: Amazon Web Services rds-data Execute Sql API
  description: 'RDS Data API

    Amazon RDS provides an HTTP endpoint to run SQL statements on an Amazon Aurora DB cluster. To run these statements, you use the RDS Data API (Data API).


    Data API is available with the following types of Aurora databases:


    Aurora PostgreSQL - Serverless v2, Serverless v1, and provisioned


    Aurora MySQL - Serverless v1 only


    For more information about the Data API, see Using RDS Data API in the Amazon Aurora User Guide.'
tags:
- name: ExecuteSql
paths:
  /ExecuteSql:
    POST:
      summary: Amazon Web Services Executesql
      description: Runs one or more SQL statements. This operation isn't supported for Aurora PostgreSQL Serverless v2 and provisioned DB clusters, and for Aurora Serverless v1 DB clusters, the operation is deprecated. Use the BatchExecuteStatement or ExecuteStatement operation.
      operationId: amazonWebServicesExecuteSql
      tags:
      - ExecuteSql
