openapi: 3.2.0
info:
  title: Amazon Web Services cloudfront Origin Access Identity API
  description: 'Amazon CloudFront

    This is the Amazon CloudFront API Reference. This guide is for developers who need detailed information about CloudFront API actions, data types, and errors. For detailed information about CloudFront features, see the Amazon CloudFront Developer Guide.'
tags:
- name: Origin Access Identity
paths:
  /2020-05-31/origin-access-identity/cloudfront:
    GET:
      summary: Amazon Web Services Listcloudfrontoriginaccessidentities
      description: Lists origin access identities.
      operationId: amazonWebServicesListCloudFrontOriginAccessIdentities
      tags:
      - Origin Access Identity
  /2020-05-31/origin-access-identity/cloudfront/{Id}:
    GET:
      summary: Amazon Web Services Getcloudfrontoriginaccessidentity
      description: Get the information about an origin access identity.
      operationId: amazonWebServicesGetCloudFrontOriginAccessIdentity
      tags:
      - Origin Access Identity
  /2020-05-31/origin-access-identity/cloudfront/{Id}/config:
    PUT:
      summary: Amazon Web Services Updatecloudfrontoriginaccessidentity
      description: Update an origin access identity.
      operationId: amazonWebServicesUpdateCloudFrontOriginAccessIdentity
      tags:
      - Origin Access Identity
