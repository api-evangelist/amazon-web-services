openapi: 3.2.0
info:
  title: Amazon Web Services resource-groups Get Group API
  description: Resource Groups lets you organize Amazon Web Services resources such as Amazon Elastic Compute Cloud instances, Amazon Relational Database Service databases, and Amazon Simple Storage Service buckets into groups using criteria that you define as tags.
tags:
- name: Get Group
paths:
  /get-group:
    POST:
      summary: Amazon Web Services Getgroup
      description: 'Returns information about a specified resource group. Minimum permissions To run this command, you must have the following permissions: resource-groups:GetGroup'
      operationId: amazonWebServicesGetGroup
      tags:
      - Get Group
  /GetGroup:
    POST:
      summary: Amazon Web Services Getgroup
      description: Retrieves group resource details.
      operationId: amazonWebServicesGetGroup
      tags:
      - Get Group
