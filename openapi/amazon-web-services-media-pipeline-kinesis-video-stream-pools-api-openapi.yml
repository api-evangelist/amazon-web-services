openapi: 3.2.0
info:
  title: Amazon Web Services chime-sdk-media-pipelines Media…
  description: The Amazon Chime SDK media pipeline APIs in this section allow software developers to create Amazon Chime SDK media pipelines that capture, concatenate, or stream your Amazon Chime SDK meetings. For more information about media pipelines, see Amazon Chime SDK media pipelines.
tags:
- name: Media Pipeline Kinesis Video Stream Pools
paths:
  /media-pipeline-kinesis-video-stream-pools:
    GET:
      summary: Amazon Web Services Listmediapipelinekinesisvideostreampools
      description: Lists the video stream pools in the media pipeline.
      operationId: amazonWebServicesListMediaPipelineKinesisVideoStreamPools
      tags:
      - Media Pipeline Kinesis Video Stream Pools
  /media-pipeline-kinesis-video-stream-pools/{identifier}:
    PUT:
      summary: Amazon Web Services Updatemediapipelinekinesisvideostreampool
      description: Updates an Kinesis video stream pool in a media pipeline.
      operationId: amazonWebServicesUpdateMediaPipelineKinesisVideoStreamPool
      tags:
      - Media Pipeline Kinesis Video Stream Pools
