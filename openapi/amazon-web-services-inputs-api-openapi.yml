openapi: 3.2.0
info:
  title: Amazon Web Services Inputs API
  version: '1.0'
  description: 'Operations tagged Inputs across 2 of this provider''s published API definitions: iotevents-data-openapi-original.yml, iotevents-openapi-original.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Inputs
paths:
  /inputs/messages:
    POST:
      summary: Amazon Web Services Batchputmessage
      description: Sends a set of messages to the IoT Events system. Each message payload is transformed into the input you specify ("inputName") and ingested into any detectors that monitor that input. If multiple messages are sent, the order in which the messages are processed isn't guaranteed. To guarantee ordering, you must send messages one at a time and wait for a successful response.
      operationId: amazonWebServicesBatchPutMessage
      tags:
      - Inputs
  /inputs:
    GET:
      summary: Amazon Web Services Listinputs
      description: Lists the inputs you have created.
      operationId: amazonWebServicesListInputs
      tags:
      - Inputs
  /inputs/{inputName}:
    PUT:
      summary: Amazon Web Services Updateinput
      description: Updates an input.
      operationId: amazonWebServicesUpdateInput
      tags:
      - Inputs
x-refined-from:
- iotevents-data-openapi-original.yml
- iotevents-openapi-original.yml
