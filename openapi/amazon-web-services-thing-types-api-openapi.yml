openapi: 3.2.0
info:
  title: Amazon Web Services iot Thing Types API
  description: 'IoT

    IoT provides secure, bi-directional communication between Internet-connected devices (such as sensors, actuators, embedded devices, or smart appliances) and the Amazon Web Services cloud.'
tags:
- name: Thing Types
paths:
  /thing-types/{thingTypeName}:
    GET:
      summary: Amazon Web Services Describethingtype
      description: Gets information about the specified thing type. Requires permission to access the DescribeThingType action.
      operationId: amazonWebServicesDescribeThingType
      tags:
      - Thing Types
  /thing-types/{thingTypeName}/deprecate:
    POST:
      summary: Amazon Web Services Deprecatethingtype
      description: Deprecates a thing type. You can not associate new things with deprecated thing type. Requires permission to access the DeprecateThingType action.
      operationId: amazonWebServicesDeprecateThingType
      tags:
      - Thing Types
  /thing-types:
    GET:
      summary: Amazon Web Services Listthingtypes
      description: Lists the existing thing types. Requires permission to access the ListThingTypes action.
      operationId: amazonWebServicesListThingTypes
      tags:
      - Thing Types
