openapi: 3.2.0
info:
  title: Amazon Web Services iot Accept Certificate Transfer API
  description: 'IoT

    IoT provides secure, bi-directional communication between Internet-connected devices (such as sensors, actuators, embedded devices, or smart appliances) and the Amazon Web Services cloud.'
tags:
- name: Accept Certificate Transfer
paths:
  /accept-certificate-transfer/{certificateId}:
    PATCH:
      summary: Amazon Web Services Acceptcertificatetransfer
      description: Accepts a pending certificate transfer. The default state of the certificate is INACTIVE. To check for pending certificate transfers, call ListCertificates to enumerate your certificates. Requires permission to access the AcceptCertificateTransfer action.
      operationId: amazonWebServicesAcceptCertificateTransfer
      tags:
      - Accept Certificate Transfer
