openapi: 3.2.0
info:
  title: Amazon Web Services iotwireless Position Configurations API
  description: AWS IoT Wireless provides bi-directional communication between internet-connected wireless devices and the AWS Cloud.
tags:
- name: Position Configurations
paths:
  /position-configurations/{ResourceIdentifier}:
    PUT:
      summary: Amazon Web Services Putpositionconfiguration
      description: Put position configuration for a given resource. This action is no longer supported. Calls to update the position configuration should use the UpdateResourcePosition API operation instead.
      operationId: amazonWebServicesPutPositionConfiguration
      tags:
      - Position Configurations
  /position-configurations:
    GET:
      summary: Amazon Web Services Listpositionconfigurations
      description: List position configurations for a given resource, such as positioning solvers. This action is no longer supported. Calls to retrieve position information should use the GetResourcePosition API operation instead.
      operationId: amazonWebServicesListPositionConfigurations
      tags:
      - Position Configurations
