openapi: 3.2.0
info:
  title: Amazon Web Services resource-groups Delete Group API
  description: Resource Groups lets you organize Amazon Web Services resources such as Amazon Elastic Compute Cloud instances, Amazon Relational Database Service databases, and Amazon Simple Storage Service buckets into groups using criteria that you define as tags.
tags:
- name: Delete Group
paths:
  /delete-group:
    POST:
      summary: Amazon Web Services Deletegroup
      description: 'Deletes the specified resource group. Deleting a resource group does not delete any resources that are members of the group; it only deletes the group structure. Minimum permissions To run this command, you must have the following permissions: resource-groups:DeleteGroup'
      operationId: amazonWebServicesDeleteGroup
      tags:
      - Delete Group
  /DeleteGroup:
    POST:
      summary: Amazon Web Services Deletegroup
      description: Deletes a group resource.
      operationId: amazonWebServicesDeleteGroup
      tags:
      - Delete Group
