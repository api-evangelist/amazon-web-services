openapi: 3.2.0
info:
  title: Amazon Web Services connect User Hierarchy Groups API
  description: Amazon Connect is a cloud-based contact center solution that you use to set up and manage a customer contact center and provide reliable customer engagement at any scale.
tags:
- name: User Hierarchy Groups
paths:
  /user-hierarchy-groups/{InstanceId}:
    PUT:
      summary: Amazon Web Services Createuserhierarchygroup
      description: Creates a new user hierarchy group.
      operationId: amazonWebServicesCreateUserHierarchyGroup
      tags:
      - User Hierarchy Groups
  /user-hierarchy-groups/{InstanceId}/{HierarchyGroupId}:
    GET:
      summary: Amazon Web Services Describeuserhierarchygroup
      description: Describes the specified hierarchy group.
      operationId: amazonWebServicesDescribeUserHierarchyGroup
      tags:
      - User Hierarchy Groups
  /user-hierarchy-groups/{InstanceId}/{HierarchyGroupId}/name:
    POST:
      summary: Amazon Web Services Updateuserhierarchygroupname
      description: Updates the name of the user hierarchy group.
      operationId: amazonWebServicesUpdateUserHierarchyGroupName
      tags:
      - User Hierarchy Groups
