openapi: 3.2.0
info:
  title: Amazon Web Services Access Policies API
  version: '1.0'
  description: 'Operations tagged Access Policies across 2 of this provider''s published API definitions: eks-openapi-original.yml, iotsitewise-openapi-original.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Access Policies
paths:
  /access-policies:
    GET:
      summary: Amazon Web Services Listaccesspolicies
      description: Lists the available access policies.
      operationId: amazonWebServicesListAccessPolicies
      tags:
      - Access Policies
  /access-policies/{accessPolicyId}:
    PUT:
      summary: Amazon Web Services Updateaccesspolicy
      description: Updates an existing access policy that specifies an identity's access to an IoT SiteWise Monitor portal or project resource.
      operationId: amazonWebServicesUpdateAccessPolicy
      tags:
      - Access Policies
