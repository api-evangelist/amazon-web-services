openapi: 3.2.0
info:
  title: Amazon Web Services iotwireless Resource Positions API
  description: AWS IoT Wireless provides bi-directional communication between internet-connected wireless devices and the AWS Cloud.
tags:
- name: Resource Positions
paths:
  /resource-positions/{ResourceIdentifier}:
    PATCH:
      summary: Amazon Web Services Updateresourceposition
      description: Update the position information of a given wireless device or a wireless gateway resource. The position coordinates are based on the World Geodetic System (WGS84).
      operationId: amazonWebServicesUpdateResourcePosition
      tags:
      - Resource Positions
