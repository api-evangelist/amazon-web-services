openapi: 3.2.0
info:
  title: Amazon Web Services cloudfront Tagging API
  description: 'Amazon CloudFront

    This is the Amazon CloudFront API Reference. This guide is for developers who need detailed information about CloudFront API actions, data types, and errors. For detailed information about CloudFront features, see the Amazon CloudFront Developer Guide.'
tags:
- name: Tagging
paths:
  /2020-05-31/tagging:
    GET:
      summary: Amazon Web Services Listtagsforresource
      description: List tags for a CloudFront resource.
      operationId: amazonWebServicesListTagsForResource
      tags:
      - Tagging
  /2020-05-31/tagging?Operation=Tag:
    POST:
      summary: Amazon Web Services Tagresource
      description: Add tags to a CloudFront resource.
      operationId: amazonWebServicesTagResource
      tags:
      - Tagging
  /2020-05-31/tagging?Operation=Untag:
    POST:
      summary: Amazon Web Services Untagresource
      description: Remove tags from a CloudFront resource.
      operationId: amazonWebServicesUntagResource
      tags:
      - Tagging
