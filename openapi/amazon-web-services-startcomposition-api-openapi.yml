openapi: 3.2.0
info:
  title: Amazon Web Services ivs-realtime Start Composition API
  description: 'Introduction


    The Amazon Interactive Video Service (IVS) real-time API is REST compatible, using a standard HTTP API and an AWS EventBridge event stream for responses.'
tags:
- name: StartComposition
paths:
  /StartComposition:
    POST:
      summary: Amazon Web Services Startcomposition
      description: 'Starts a Composition from a stage based on the configuration provided in the request. A Composition is an ephemeral resource that exists after this endpoint returns successfully. Composition stops and the resource is deleted: When StopComposition is called. After a 1-minute timeout, when all participants are disconnected from the stage. After a 1-minute timeout, if there are no participants in the stage when StartComposition is called. When broadcasting to the IVS channel fails and all retries are exhausted. When broadcasting is disconnected and all attempts to reconnect are exhausted.'
      operationId: amazonWebServicesStartComposition
      tags:
      - StartComposition
