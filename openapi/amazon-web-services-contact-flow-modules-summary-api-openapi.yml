openapi: 3.2.0
info:
  title: Amazon Web Services connect Contact Flow Modules Summary API
  description: Amazon Connect is a cloud-based contact center solution that you use to set up and manage a customer contact center and provide reliable customer engagement at any scale.
tags:
- name: Contact Flow Modules Summary
paths:
  /contact-flow-modules-summary/{InstanceId}:
    GET:
      summary: Amazon Web Services Listcontactflowmodules
      description: Provides information about the flow modules for the specified Amazon Connect instance.
      operationId: amazonWebServicesListContactFlowModules
      tags:
      - Contact Flow Modules Summary
