openapi: 3.2.0
info:
  title: Amazon Web Services xray Traces API
  description: Amazon Web Services X-Ray provides APIs for managing debug traces and retrieving service maps and other data created by processing those traces.
tags:
- name: Traces
paths:
  /Traces:
    POST:
      summary: Amazon Web Services Batchgettraces
      description: Retrieves a list of traces specified by ID. Each trace is a collection of segment documents that originates from a single request. Use GetTraceSummaries to get a list of trace IDs.
      operationId: amazonWebServicesBatchGetTraces
      tags:
      - Traces
