openapi: 3.2.0
info:
  title: Amazon Web Services accessanalyzer Access Preview API
  description: Identity and Access Management Access Analyzer helps you to set, verify, and refine your IAM policies by providing a suite of capabilities.
tags:
- name: Access Preview
paths:
  /access-preview:
    GET:
      summary: Amazon Web Services Listaccesspreviews
      description: Retrieves a list of access previews for the specified analyzer.
      operationId: amazonWebServicesListAccessPreviews
      tags:
      - Access Preview
  /access-preview/{accessPreviewId}:
    POST:
      summary: Amazon Web Services Listaccesspreviewfindings
      description: Retrieves a list of access preview findings generated by the specified access preview.
      operationId: amazonWebServicesListAccessPreviewFindings
      tags:
      - Access Preview
