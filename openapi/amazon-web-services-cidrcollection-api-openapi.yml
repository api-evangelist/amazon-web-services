openapi: 3.2.0
info:
  title: Amazon Web Services route53 Cidrcollection API
  description: 'Amazon Route 53 is a highly available and scalable Domain Name System (DNS) web service.


    You can use Route 53 to:


    Register domain names.


    For more information, see How domain registration works.


    Route internet traffic to the resources for your domain


    For more information, see How internet traffic is routed to your website or web application.


    Check the health of your resources.


    For more information, see How Route 53 checks the health of your resources.'
tags:
- name: Cidrcollection
paths:
  /2013-04-01/cidrcollection/{CidrCollectionId}:
    GET:
      summary: Amazon Web Services Listcidrlocations
      description: Returns a paginated list of CIDR locations for the given collection (metadata only, does not include CIDR blocks).
      operationId: amazonWebServicesListCidrLocations
      tags:
      - Cidrcollection
  /2013-04-01/cidrcollection:
    GET:
      summary: Amazon Web Services Listcidrcollections
      description: Returns a paginated list of CIDR collections in the Amazon Web Services account (metadata only).
      operationId: amazonWebServicesListCidrCollections
      tags:
      - Cidrcollection
  /2013-04-01/cidrcollection/{CidrCollectionId}/cidrblocks:
    GET:
      summary: Amazon Web Services Listcidrblocks
      description: Returns a paginated list of location objects and their CIDR blocks.
      operationId: amazonWebServicesListCidrBlocks
      tags:
      - Cidrcollection
