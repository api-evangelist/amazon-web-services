openapi: 3.2.0
info:
  title: Amazon Web Services eks Addons API
  description: Amazon Elastic Kubernetes Service (Amazon EKS) is a managed service that makes it easy for you to run Kubernetes on Amazon Web Services without needing to setup or maintain your own Kubernetes control plane.
tags:
- name: Add Ons
paths:
  /addons/configuration-schemas:
    GET:
      summary: Amazon Web Services Describeaddonconfiguration
      description: Returns configuration options.
      operationId: amazonWebServicesDescribeAddonConfiguration
      tags:
      - Add Ons
  /addons/supported-versions:
    GET:
      summary: Amazon Web Services Describeaddonversions
      description: Describes the versions for an add-on. Information such as the Kubernetes versions that you can use the add-on with, the owner, publisher, and the type of the add-on are returned.
      operationId: amazonWebServicesDescribeAddonVersions
      tags:
      - Add Ons
