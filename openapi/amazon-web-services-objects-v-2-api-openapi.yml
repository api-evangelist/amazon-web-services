openapi: 3.2.0
info:
  title: Amazon Web Services AWS S3 Objects V 2 API
  description: 'The API for Amazon Simple Storage Service (Amazon S3) provides an object

    storage solution with top-notch scalability, data availability, security,

    and performance. It caters to customers of varying sizes and industries,

    offering the ability to store and secure any volume of data for a wide

    range of purposes, including data lakes, cloud-native applications, and

    mobile apps.'
tags:
- name: Objects V 2
paths:
  /{Bucket}?list-type=2:
    GET:
      summary: Amazon Web Services List Objects V 2
      description: Returns some or all (up to 1,000) of the objects in a bucket with each request You can use the request parameters as selection criteria to return a subset of the objects in a bucket.
      tags:
      - Objects V 2
      operationId: listObjectsV2
