openapi: 3.2.0
info:
  title: Amazon Web Services codeguru-security Upload URL API
  description: Amazon CodeGuru Security is in preview release and is subject to change.
tags:
- name: Upload URL
paths:
  /uploadUrl:
    POST:
      summary: Amazon Web Services Createuploadurl
      description: Generates a pre-signed URL and request headers used to upload a code resource. You can upload your code resource to the URL and add the request headers using any HTTP client.
      operationId: amazonWebServicesCreateUploadUrl
      tags:
      - Upload URL
