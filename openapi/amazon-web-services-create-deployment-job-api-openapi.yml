openapi: 3.2.0
info:
  title: Amazon Web Services robomaker Create Deployment Job API
  description: This section provides documentation for the AWS RoboMaker API operations.
tags:
- name: Create Deployment Job
paths:
  /createDeploymentJob:
    POST:
      summary: Amazon Web Services Createdeploymentjob
      description: Deploys a specific version of a robot application to robots in a fleet. This API is no longer supported and will throw an error if used. The robot application must have a numbered applicationVersion for consistency reasons. To create a new version, use CreateRobotApplicationVersion or see Creating a Robot Application Version. After 90 days, deployment jobs expire and will be deleted. They will no longer be accessible.
      operationId: amazonWebServicesCreateDeploymentJob
      tags:
      - Create Deployment Job
