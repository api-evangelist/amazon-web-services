openapi: 3.2.0
info:
  title: Amazon Web Services AWS S3 Bucket Policy Status API
  description: 'The API for Amazon Simple Storage Service (Amazon S3) provides an object

    storage solution with top-notch scalability, data availability, security,

    and performance. It caters to customers of varying sizes and industries,

    offering the ability to store and secure any volume of data for a wide

    range of purposes, including data lakes, cloud-native applications, and

    mobile apps.'
tags:
- name: Bucket Policy Status
paths:
  /{Bucket}?policyStatus:
    GET:
      summary: Amazon Web Services Get Bucket Policy Status
      description: This operation is not supported by directory buckets Retrieves the policy status for an Amazon S3 bucket, indicating whether the bucket is public
      tags:
      - Bucket Policy Status
      operationId: getBucketPolicyStatus
