openapi: 3.2.0
info:
  title: Amazon Web Services apigateway Sdktypes API
  description: 'Amazon API Gateway

    Amazon API Gateway helps developers deliver robust, secure, and scalable mobile and web application back ends. API Gateway allows developers to securely connect mobile and web applications to APIs that run on Lambda, Amazon EC2, or other publicly addressable web services that are hosted outside of AWS.'
tags:
- name: Sdktypes
paths:
  /sdktypes/{sdktype_id}:
    GET:
      summary: Amazon Web Services Getsdktype
      description: Gets an SDK type.
      operationId: amazonWebServicesGetSdkType
      tags:
      - Sdktypes
  /sdktypes:
    GET:
      summary: Amazon Web Services Getsdktypes
      description: Gets SDK types
      operationId: amazonWebServicesGetSdkTypes
      tags:
      - Sdktypes
