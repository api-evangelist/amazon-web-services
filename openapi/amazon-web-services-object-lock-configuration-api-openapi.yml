openapi: 3.2.0
info:
  title: Amazon Web Services AWS S3 Object Lock Configuration API
  description: 'The API for Amazon Simple Storage Service (Amazon S3) provides an object

    storage solution with top-notch scalability, data availability, security,

    and performance. It caters to customers of varying sizes and industries,

    offering the ability to store and secure any volume of data for a wide

    range of purposes, including data lakes, cloud-native applications, and

    mobile apps.'
tags:
- name: Object Lock Configuration
paths:
  /{Bucket}?object-lock:
    PUT:
      summary: Amazon Web Services Put Object Lock Configuration
      description: This operation is not supported by directory buckets Places an Object Lock configuration on the specified bucket
      tags:
      - Object Lock Configuration
      operationId: putObjectLockConfiguration
