openapi: 3.2.0
info:
  title: Amazon Web Services Phone Numbers API
  version: '1.0'
  description: 'Operations tagged Phone Numbers across 2 of this provider''s published API definitions: chime-openapi-original.yml, chime-sdk-voice-openapi-original.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Phone Numbers
paths:
  /phone-numbers/{phoneNumberId}:
    POST:
      summary: Amazon Web Services Updatephonenumber
      description: Updates phone number details, such as product type or calling name, for the specified phone number ID. You can update one phone number detail at a time. For example, you can update either the product type or the calling name in one action. For toll-free numbers, you cannot use the Amazon Chime Business Calling product type. For numbers outside the U.S., you must use the Amazon Chime SIP Media Application Dial-In product type. Updates to outbound calling names can take 72 hours to complete. Pending updates to outbound calling names must be complete before you can request another update.
      operationId: amazonWebServicesUpdatePhoneNumber
      tags:
      - Phone Numbers
  /phone-numbers:
    GET:
      summary: Amazon Web Services Listphonenumbers
      description: Lists the phone numbers for the specified Amazon Chime account, Amazon Chime user, Amazon Chime Voice Connector, or Amazon Chime Voice Connector group.
      operationId: amazonWebServicesListPhoneNumbers
      tags:
      - Phone Numbers
  /phone-numbers/{phoneNumberId}?operation=restore:
    POST:
      summary: Amazon Web Services Restorephonenumber
      description: Moves a phone number from the Deletion queue back into the phone number Inventory.
      operationId: amazonWebServicesRestorePhoneNumber
      tags:
      - Phone Numbers
x-refined-from:
- chime-openapi-original.yml
- chime-sdk-voice-openapi-original.yml
