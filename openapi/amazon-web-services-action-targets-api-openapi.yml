openapi: 3.2.0
info:
  title: Amazon Web Services securityhub Action Targets API
  description: Security Hub provides you with a comprehensive view of your security state in Amazon Web Services and helps you assess your Amazon Web Services environment against security industry standards and best practices.
tags:
- name: Action Targets
paths:
  /actionTargets:
    POST:
      summary: Amazon Web Services Createactiontarget
      description: Creates a custom action target in Security Hub. You can use custom actions on findings and insights in Security Hub to trigger target actions in Amazon CloudWatch Events.
      operationId: amazonWebServicesCreateActionTarget
      tags:
      - Action Targets
  /actionTargets/{ActionTargetArn+}:
    PATCH:
      summary: Amazon Web Services Updateactiontarget
      description: Updates the name and description of a custom action target in Security Hub.
      operationId: amazonWebServicesUpdateActionTarget
      tags:
      - Action Targets
  /actionTargets/get:
    POST:
      summary: Amazon Web Services Describeactiontargets
      description: Returns a list of the custom action targets in Security Hub in your account.
      operationId: amazonWebServicesDescribeActionTargets
      tags:
      - Action Targets
