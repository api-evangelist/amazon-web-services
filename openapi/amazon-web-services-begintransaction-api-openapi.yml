openapi: 3.2.0
info:
  title: Amazon Web Services rds-data Begin Transaction API
  description: 'RDS Data API

    Amazon RDS provides an HTTP endpoint to run SQL statements on an Amazon Aurora DB cluster. To run these statements, you use the RDS Data API (Data API).


    Data API is available with the following types of Aurora databases:


    Aurora PostgreSQL - Serverless v2, Serverless v1, and provisioned


    Aurora MySQL - Serverless v1 only


    For more information about the Data API, see Using RDS Data API in the Amazon Aurora User Guide.'
tags:
- name: BeginTransaction
paths:
  /BeginTransaction:
    POST:
      summary: Amazon Web Services Begintransaction
      description: Starts a SQL transaction. A transaction can run for a maximum of 24 hours. A transaction is terminated and rolled back automatically after 24 hours. A transaction times out if no calls use its transaction ID in three minutes. If a transaction times out before it's committed, it's rolled back automatically. DDL statements inside a transaction cause an implicit commit. We recommend that you run each DDL statement in a separate ExecuteStatement call with continueAfterTimeout enabled.
      operationId: amazonWebServicesBeginTransaction
      tags:
      - BeginTransaction
