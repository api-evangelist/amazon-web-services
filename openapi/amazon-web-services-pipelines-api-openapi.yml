openapi: 3.2.0
info:
  title: Amazon Web Services iotanalytics Pipelines API
  description: IoT Analytics allows you to collect large amounts of device data, process messages, and store them.
tags:
- name: Pipelines
paths:
  /pipelines/{pipelineName}/reprocessing/{reprocessingId}:
    DELETE:
      summary: Amazon Web Services Cancelpipelinereprocessing
      description: Cancels the reprocessing of data through the pipeline.
      operationId: amazonWebServicesCancelPipelineReprocessing
      tags:
      - Pipelines
  /pipelines:
    GET:
      summary: Amazon Web Services Listpipelines
      description: Retrieves a list of pipelines.
      operationId: amazonWebServicesListPipelines
      tags:
      - Pipelines
  /pipelines/{pipelineName}:
    PUT:
      summary: Amazon Web Services Updatepipeline
      description: Updates the settings of a pipeline. You must specify both a channel and a datastore activity and, optionally, as many as 23 additional activities in the pipelineActivities array.
      operationId: amazonWebServicesUpdatePipeline
      tags:
      - Pipelines
  /pipelines/{pipelineName}/reprocessing:
    POST:
      summary: Amazon Web Services Startpipelinereprocessing
      description: Starts the reprocessing of raw message data through the pipeline.
      operationId: amazonWebServicesStartPipelineReprocessing
      tags:
      - Pipelines
