openapi: 3.2.0
info:
  title: Amazon Web Services iotwireless Partner Accounts API
  description: AWS IoT Wireless provides bi-directional communication between internet-connected wireless devices and the AWS Cloud.
tags:
- name: Partner Accounts
paths:
  /partner-accounts:
    GET:
      summary: Amazon Web Services Listpartneraccounts
      description: Lists the partner accounts associated with your AWS account.
      operationId: amazonWebServicesListPartnerAccounts
      tags:
      - Partner Accounts
  /partner-accounts/{PartnerAccountId}:
    PATCH:
      summary: Amazon Web Services Updatepartneraccount
      description: Updates properties of a partner account.
      operationId: amazonWebServicesUpdatePartnerAccount
      tags:
      - Partner Accounts
