openapi: 3.2.0
info:
  title: Amazon Web Services backup Supported Resource Types API
  description: 'Backup

    Backup is a unified backup service designed to protect Amazon Web Services services and their associated data. Backup simplifies the creation, migration, restoration, and deletion of backups, while also providing reporting and auditing.'
tags:
- name: Supported Resource Types
paths:
  /supported-resource-types:
    GET:
      summary: Amazon Web Services Getsupportedresourcetypes
      description: Returns the Amazon Web Services resource types supported by Backup.
      operationId: amazonWebServicesGetSupportedResourceTypes
      tags:
      - Supported Resource Types
