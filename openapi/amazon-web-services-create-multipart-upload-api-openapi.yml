openapi: 3.2.0
info:
  title: Amazon Web Services AWS S3 Create Multipart Upload API
  description: 'The API for Amazon Simple Storage Service (Amazon S3) provides an object

    storage solution with top-notch scalability, data availability, security,

    and performance. It caters to customers of varying sizes and industries,

    offering the ability to store and secure any volume of data for a wide

    range of purposes, including data lakes, cloud-native applications, and

    mobile apps.'
tags:
- name: Create Multipart Upload
paths:
  /{Bucket}/{Key+}?uploads:
    POST:
      summary: Amazon Web Services Create Multipart Upload
      description: This action initiates a multipart upload and returns an upload ID This upload ID is used to associate all of the parts in the specific multipart upload.
      tags:
      - Create Multipart Upload
      operationId: createMultipartUpload
