openapi: 3.2.0
info:
  title: Amazon Web Services iot Confirmdestination API
  description: 'IoT

    IoT provides secure, bi-directional communication between Internet-connected devices (such as sensors, actuators, embedded devices, or smart appliances) and the Amazon Web Services cloud.'
tags:
- name: Confirmdestination
paths:
  /confirmdestination/{confirmationToken+}:
    GET:
      summary: Amazon Web Services Confirmtopicruledestination
      description: Confirms a topic rule destination. When you create a rule requiring a destination, IoT sends a confirmation message to the endpoint or base address you specify. The message includes a token which you pass back when calling ConfirmTopicRuleDestination to confirm that you own or have access to the endpoint. Requires permission to access the ConfirmTopicRuleDestination action.
      operationId: amazonWebServicesConfirmTopicRuleDestination
      tags:
      - Confirmdestination
