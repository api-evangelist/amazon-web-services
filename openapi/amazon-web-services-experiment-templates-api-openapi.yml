openapi: 3.2.0
info:
  title: Amazon Web Services fis Experiment Templates API
  description: Fault Injection Simulator is a managed service that enables you to perform fault injection experiments on your Amazon Web Services workloads. For more information, see the Fault Injection Simulator User Guide.
tags:
- name: Experiment Templates
paths:
  /experimentTemplates:
    GET:
      summary: Amazon Web Services Listexperimenttemplates
      description: Lists your experiment templates.
      operationId: amazonWebServicesListExperimentTemplates
      tags:
      - Experiment Templates
  /experimentTemplates/{id}/targetAccountConfigurations/{accountId}:
    PATCH:
      summary: Amazon Web Services Updatetargetaccountconfiguration
      description: Updates the target account configuration for the specified experiment template.
      operationId: amazonWebServicesUpdateTargetAccountConfiguration
      tags:
      - Experiment Templates
  /experimentTemplates/{id}:
    PATCH:
      summary: Amazon Web Services Updateexperimenttemplate
      description: Updates the specified experiment template.
      operationId: amazonWebServicesUpdateExperimentTemplate
      tags:
      - Experiment Templates
  /experimentTemplates/{id}/targetAccountConfigurations:
    GET:
      summary: Amazon Web Services Listtargetaccountconfigurations
      description: Lists the target account configurations of the specified experiment template.
      operationId: amazonWebServicesListTargetAccountConfigurations
      tags:
      - Experiment Templates
