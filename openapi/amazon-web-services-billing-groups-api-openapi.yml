openapi: 3.2.0
info:
  title: Amazon Web Services iot Billing Groups API
  description: 'IoT

    IoT provides secure, bi-directional communication between Internet-connected devices (such as sensors, actuators, embedded devices, or smart appliances) and the Amazon Web Services cloud.'
tags:
- name: Billing Groups
paths:
  /billing-groups/addThingToBillingGroup:
    PUT:
      summary: Amazon Web Services Addthingtobillinggroup
      description: Adds a thing to a billing group. Requires permission to access the AddThingToBillingGroup action.
      operationId: amazonWebServicesAddThingToBillingGroup
      tags:
      - Billing Groups
  /billing-groups/{billingGroupName}:
    PATCH:
      summary: Amazon Web Services Updatebillinggroup
      description: Updates information about the billing group. Requires permission to access the UpdateBillingGroup action.
      operationId: amazonWebServicesUpdateBillingGroup
      tags:
      - Billing Groups
  /billing-groups:
    GET:
      summary: Amazon Web Services Listbillinggroups
      description: Lists the billing groups you have created. Requires permission to access the ListBillingGroups action.
      operationId: amazonWebServicesListBillingGroups
      tags:
      - Billing Groups
  /billing-groups/{billingGroupName}/things:
    GET:
      summary: Amazon Web Services Listthingsinbillinggroup
      description: Lists the things you have added to the given billing group. Requires permission to access the ListThingsInBillingGroup action.
      operationId: amazonWebServicesListThingsInBillingGroup
      tags:
      - Billing Groups
  /billing-groups/removeThingFromBillingGroup:
    PUT:
      summary: Amazon Web Services Removethingfrombillinggroup
      description: Removes the given thing from the billing group. Requires permission to access the RemoveThingFromBillingGroup action. This call is asynchronous. It might take several seconds for the detachment to propagate.
      operationId: amazonWebServicesRemoveThingFromBillingGroup
      tags:
      - Billing Groups
