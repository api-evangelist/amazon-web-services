openapi: 3.2.0
info:
  title: Amazon Web Services iotanalytics Datastores API
  description: IoT Analytics allows you to collect large amounts of device data, process messages, and store them.
tags:
- name: Datastores
paths:
  /datastores:
    GET:
      summary: Amazon Web Services Listdatastores
      description: Retrieves a list of data stores.
      operationId: amazonWebServicesListDatastores
      tags:
      - Datastores
  /datastores/{datastoreName}:
    PUT:
      summary: Amazon Web Services Updatedatastore
      description: Used to update the settings of a data store.
      operationId: amazonWebServicesUpdateDatastore
      tags:
      - Datastores
