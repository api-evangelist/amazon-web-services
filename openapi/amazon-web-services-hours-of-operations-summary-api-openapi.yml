openapi: 3.2.0
info:
  title: Amazon Web Services connect Hours of Operations Summary API
  description: Amazon Connect is a cloud-based contact center solution that you use to set up and manage a customer contact center and provide reliable customer engagement at any scale.
tags:
- name: Hours of Operations Summary
paths:
  /hours-of-operations-summary/{InstanceId}:
    GET:
      summary: Amazon Web Services Listhoursofoperations
      description: Provides information about the hours of operation for the specified Amazon Connect instance. For more information about hours of operation, see Set the Hours of Operation for a Queue in the Amazon Connect Administrator Guide.
      operationId: amazonWebServicesListHoursOfOperations
      tags:
      - Hours of Operations Summary
