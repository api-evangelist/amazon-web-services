openapi: 3.2.0
info:
  title: Amazon Web Services AWS S3 Delete Objects. API
  description: 'The API for Amazon Simple Storage Service (Amazon S3) provides an object

    storage solution with top-notch scalability, data availability, security,

    and performance. It caters to customers of varying sizes and industries,

    offering the ability to store and secure any volume of data for a wide

    range of purposes, including data lakes, cloud-native applications, and

    mobile apps.'
tags:
- name: Delete Objects.
paths:
  /{Bucket}?delete:
    POST:
      summary: Amazon Web Services Delete Objects
      description: This operation enables you to delete multiple objects from a bucket using a single HTTP request If you know the object keys that you want to delete, then this operation provides a suitable alternative to sending individual delete requests, reducing per-request overhead.
      tags:
      - Delete Objects.
      operationId: deleteObjects
