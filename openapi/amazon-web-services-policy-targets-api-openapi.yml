openapi: 3.2.0
info:
  title: Amazon Web Services iot Policy Targets API
  description: 'IoT

    IoT provides secure, bi-directional communication between Internet-connected devices (such as sensors, actuators, embedded devices, or smart appliances) and the Amazon Web Services cloud.'
tags:
- name: Policy Targets
paths:
  /policy-targets/{policyName}:
    POST:
      summary: Amazon Web Services Listtargetsforpolicy
      description: List targets for the specified policy. Requires permission to access the ListTargetsForPolicy action.
      operationId: amazonWebServicesListTargetsForPolicy
      tags:
      - Policy Targets
